      "有人说：部队生产，就不能作战和训练了；机关生产，就不能工作了。这种说法是不对的。最近几年，我们边区部队从事大量的生产，衣食丰足，同时又进行练兵，又有政治和文化学习，这些都比从前有更大的成绩，军队内部的团结和军民之间的团结，也比从前更好了。在前方，去年一年进行了大规模的生产运动，可是去年一年作战方面有很大的成绩，并且普遍地开始了练兵运动。机关因为生产，工作人员生活改善了，工作更安心、更有效率，边区和前方都是这样。《必须学会做经济工作》（一九四五年一月十日），《毛泽东选集》第三卷第一零一八页。",
      "我们的方针要放在什么基点上？放在自己力量的基点上，叫做自力更生。我们并不孤立，全世界一切反对帝国主义的国家和人民都是我们的朋友。但是我们强调自力更生，我们能够依靠自己组织的力量，打败一切中外反动派。《抗日战争胜利后的时局和我们的方针》（一九四五年八月十三日），《毛泽东选集》第四卷第一一三二页。",
      "我们是主张自力更生的。我们希望有外援，但是我们不能依赖它，我们依靠自己的努力，依靠全体军民的创造力。《必须学会做经济工作》（一九四五年一月十日），《毛泽东选集》第三卷第一零一五页夺取全国胜利，这只是万里长征走完了第一步。……中国的革命是伟大的，但革命以后的路程更长，工作更伟大，更艰苦。这一点现在就必须向党内讲明白，务必使同志们继续地保持谦虚、谨慎、不骄、不躁的作风，务必使同志们继续地保持艰苦奋斗的作风。《在中国共产党第七届中央委员会第二次全体会议上的报告》（一九四九年三月五日），《毛泽东选集》第四卷第一四三九——一四四零页。",
      "干部中一切不经过自己艰苦奋斗、流血流汗，而依靠意外便利、侥幸取胜的心理，必须扫除干净。《建立巩固的东北根据地》（一九四五年十月二十八日），《毛泽东选集》第四卷第一一七九页。",
      "我们应当把世界进步的情况和光明的前途，常常向人民宣传，使人民建立起胜利的信心，同时，我们还要告诉人民，告诉同志们，道路是曲折的。在革命的道路上还有许多障碍物，还有许多困难。我们党的七次代表大会设想过许多困难，我们宁肯把困难想得更多一些，有些同志不愿意多想困难。但是困难是事实，有多少就得承认多少，不能采取“不承认主义”。我们要承认困难，分析困难，向困难作斗争。世界上没有直路，要准备走曲折的路，不要贪便宜。不能设想，那一天早上，一切反动派会统统自己跪在地下。总之，前途是光明的，道路是曲折的。我们面前困难还多，不可忽视。我们和全体人民团结起来，共同努力，一定能够排除万难，达到胜利的目的。《关于重庆谈判》（一九四五年十月十七日），《毛泽东选集》第四卷第一一六二页。",
      "谁要是只看见光明一面，不看见困难一面，谁就会不能很好地为实现党的任务而斗争。《论联合政府》（一九四五年四月二十四日），《毛泽东选集》第三卷第一零九四页。",
      "社会的财富是工人、农民和劳动知识分子自己创造的。只要这些人掌握了自己的命运，又有一条马克思列宁主义的路线，不是回避问题，而是用积极的态度去解决问题，任何人间的困难总是可以解决的。《书记动手，全党办社》一文的按语（一九五五年），《中国农村的社会主义高潮》上册第五——六页。",
      "全党同志都必须充分地估计到，并准备用百折不回的毅力，有计划地克服所有的困难。反动势力面前和我们面前都有困难。但是反动势力的困难是不可能克服的，因为他们是接近于死亡的没有前途的势力。我们的困难是能够克服的，因为我们是新兴的有光明前途的势力。《迎接中国革命的新高潮》（一九四七年二月一日），毛泽东选集》第四卷第一二一四——一二一五页。",
      "我们的同志在困难的时候，要看到成绩，要看到光明，要提高我们的勇气。《为人民服务》（一九四四年九月八日），《毛泽东选集》第三卷第一零零四页。",
      "任何新生事物的成长都是要经过艰难曲折的。在社会主义事业中，要想不经过艰难曲折，不付出极大努力，总是一帆风顺，容易得到成功，这种想法，只是幻想。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第一七页。",
      "革命斗争中的某些时候，困难条件超过顺利条件，在这种时候，困难是矛盾的主要方面，顺利是其次要方面。然而由于革命党人的努力，能够逐步地克服困难，开展顺利的新局面，困难的局面让位于顺利的局面。《矛盾论》（一九三七年八月）《毛泽东选集》第一卷第三一三页什么叫工作，工作就是斗争。那些地方有困难、有问题，需要我们去解决。我们是为着解决困难去工作、去斗争的。越是困难的地方越是要去，这才是好同志。《关于重庆谈判》（一九四五年十月十七日。），《毛泽东选集》第四卷第一一六零页。",
      "中国古代有个寓言，叫做“愚公移山”。说的是古代有一位老人，住在华北，名叫北山愚公。他的家门南面有两座大山挡住他家的出路，一座叫做太行山，一座叫做王屋山。愚公下决心率领他的儿子们要用锄头挖去这两座大山。有个老头子名叫智叟的看了发笑，说是你们这样干未免太愚蠢了，你们父子数人要挖掉这样两座大山是完全不可能的。愚公回答说：我死了以后有我的儿子，儿子死了，又有孙子，子子孙孙是没有穷尽的。这两座山虽然很高，却是不会再增高了，挖一点就会少一点。为什么挖不平呢？愚公批驳了智叟的错误思想，毫不动摇，每天挖山不止。这件事感动了上帝，他就派了两个神仙下凡，把两座山背走了。现在也有两座压在中国人民头上的大山，一座叫做帝国主义，一座叫做封建主义。中国共产党早就下了决心，要挖掉这两座山。我们一定要坚持下去，一定要不断地工作，我们也会感动上帝的。这个上帝不是别人，就是全中国的人民大众。全国人民大众一齐起来和我们一道挖这两座山，有什么挖不平呢？《愚公移山》（一九四五年六月十一日），《毛泽东选集》第三卷第一一零二页。",
      "人类的历史，就是一个不断地从必然王国向自由王国发展的历史。这个历史永远不会完结。在有阶级存在的社会内，阶级斗争不会完结。在无阶级存在的社会内，新与旧、正确与错误之间的斗争永远不会完结。在生产斗争和科学实验范围内，人类总是不断发展的，自然界也总是不断发展的，永远不会停止在一个水平上。因此，人类总得不断地总结经验，有所发现，有所发明，有所创造，有所前进。停止的论点，悲观的论点，无所作为和骄傲自满的论点都是错误的。其所以是错误，因为这些论点，不符合大约一百万年以来人类社会发展的历史事实，也不符合迄今为止我们所知道的自然界（例如天体史，地球史，生物史，其他各种自然科学史所反映的自然界）的历史事实。",
      "转摘自《周恩来总理在第三届全国人民代表大会第一次会议上的政府工作报告》，一九六四年十二月三十一日《人民日报》",
      "自然科学是人们争取自由的一种武装。人们为着要在社会上得到自由，就要用社会科学来了解社会，改造社会进行社会革命。人们为着要在自然界里得到自由，就要用自然科学来了解自然，克服自然和改造自然，从自然里得到自由。",
      "在边区自然科学研究会成立大会上的讲话（一九四零年二月五日），一九四零年三月十五日《新中华报》",
      "马克思主义的哲学辩证唯物论有两个最显著的特点：一个是它的阶级性，公然申明辨证唯物论是为无产阶级服务的；再一个是它的实践性，强调理论对于实践的依赖关系，理论的基础是实践，又转过来为实践服务。《实践论》（一九三七年七月），《毛泽东选集》第一卷第二七三页。",
      "马克思主义的哲学认为十分重要的问题，不在于懂得了客观世界的规律性，因而能够解释世界，而在于拿了这种对于客观规律性的认识去能动地改造世界。《实践论》（一九三七年七月），《毛泽东选集》第一卷第二八零——二八一页。",
      "人的正确思想是从那里来的？是从天上掉下来的吗？不是。是自己头脑里固有的吗？不是。人的正确思想，只能从社会实践中来，只能从社会的生产斗争、阶级斗争和科学实验这三项实践中来。《人的正确思想是从那里来的？》（一九六三年五月），人民出版社版第一页。",
      "人们的社会存在，决定人们的思想。而代表先进阶级的正确思想，一旦被群众掌握，就会变成改造社会、改造世界的物质力量。《人的正确思想是从那里来的？》（一九六三年五月），人民出版社版第一页。",
      "人们在社会实践中从事各项斗争，有了丰富的经验，有成功的，有失败的。无数客观外界的现象通过人的眼、耳、鼻、舌、身这五个官能反映到自己的头脑中来，开始是感性认识。这种感性认识的材料积累多了，就会产生一个飞跃，变成了理性认识，这就是思想。这是一个认识过程。这是整个认识过程的第一个阶段，即由客观物质到主观精神的阶段，由存在到思想的阶段。这时候的精神、思想（包括理论、政策、计划、办法）是否正确地反映了客观外界的规律，还是没有证明的，还不能确定是否正确，然后又有认识过程的第二个阶段，即由精神到物质的阶段，由思想到存在的阶段，这就是把第一个阶段得到的认识放到社会实践中去，看这些理论、政策、计划、办法等等是否能得到预期的成功。一般的说来，成功了的就是正确的，失败了的就是错误的，特别是人类对自然界的斗争是如此。在社会斗争中，代表先进阶级的势力，有时候有些失败，并不是因为思想不正确，而是因为在斗争力量的对比上，先进势力这一方，暂时还不如反动势力那一方，所以暂时失败了，但是以后总有一天会要成功的。人们的认识经过实践的考验，又会产生一个飞跃。这次飞跃，比起前一次飞跃来，意义更加伟大。因为只有这一次飞跃才能证明认识的第一次飞跃，即从客观外界的反映过程中得到的思想、理论、计划、办法等等，究竟是正确的还是错误的，此外再无别的检验真理的办法。《人的正确思想是从那里来的？》（一九六三年五月），人民出版社版第一——二页。",
      "一个正确的认识，往往需要经过由物质到精神，由精神到物质，即由实践到认识，由认识到实践这样多次的反复，才能够完成。这就是马克思主义的认识论，就是辩证唯物论的认识论。《人的正确思想是从那里来的？》（一九六三年五月），人民出版社版第三页。",
      "无论何人要认识什么事物，除了同那个事物接触，即生活于（实践于）那个事物的环境中，是没有法子解决的。……你要有知识，你就得参加变革现实的实践。你要知道梨子的滋味，你就得变革梨子，亲口吃一吃。……你要知道革命的理论和方法，你就得参加革命。一切真知都是从直接经验发源的。《实践论》（一九三七年七），《毛泽东选集》第一卷第二七五——二七六页。",
      "认识从实践始，经过实践得到了理论的认识，还须再回到实践去。认识的能动作用，不但表现于从感性的认识到理性的认识之能动的飞跃，更重要的还须表现于从理性的认识到革命的实践这一个飞跃。《实践论》（一九三七年七月），《毛泽东选集》第一卷第二八一页。",
      "大家明白。不论做什么事，不懂得那件事的情形，它的性质，它和它以外的事情的关联，就不知道那件事的规律，就不知道如何去做，就不能做好那件事。《中国革命战争的战略问题》（一九三六年十二月），《毛泽东选集》第一卷第一六三——一六四页。",
      "人们要想得到工作的胜利即得到预想的结果，一定要使自己的思想合于客观外界的规律性，如果不合，就会在实践中失败。人们经过失败之后，也就从失败取得教训，改正自己的思想使之适合于外界的规律性，人们就能变失败为胜利，所谓“失败者成功之母”，“吃一堑长一智”，就是这个道理。《实践论》（一九三七年七月），《毛泽东选集》第一卷第二七三页。",
      "我们是马克思主义者，马克思主义叫我们看问题不要从抽象的定义出发，而要从客观存在的事实出发，从分析这些事实中找出方针、政策、办法来。《在延安文艺座谈会上的讲话》（一九四二年五月），《毛泽东选集》第三卷第八五五页。",
      "按照实际情况决定工作方针，这是一切共产党员所必须牢牢记住的最基本的工作方法。我们所犯的错误，研究其发生的原因，都是由于我们离开了当时当地的实际情况，主观地决定自己的工作方针。《在晋绥干部会议上的讲话》（一九四八年四月一日），《毛泽东选集》第四卷第一三零六页。",
      "世界上只有唯心论和形而上学最省力，因为它可以由人们瞎说一气，不要根据客观实际，也不受客观实际检查的。唯物论和辩证法则要用气力，它要根据客观实际，并受客观实际检查，不用气力就会滑到唯心论和形而上学方面去。《关于胡风反革命集团的材料》按语（一九五五年五月），《关于胡风反革命集团的材料》人民出版社版第七零页我们看事情必须要看它的实质，而把它的现象只看作入门的向导，一进了门就要抓住它的实质，这才是可靠的科学的分析方法。《星星之火，可以燎原》（一九三零年一月五日），《毛泽东选集》第一卷第一零三页。",
      "事物发展的根本原因，不是在事物的外部而是在事物的内部，在于事物内部的矛盾性。任何事物内部都有这种矛盾性，因此引起了事物的运动和发展。事物内部的这种矛盾性是事物发展的根本原因，一事物和他事物的互相联系和互相影响则是事物发展的第二位的原因。《矛盾论》（一九三七年八月），《毛泽东选集》第一卷第二八九——二九零页。",
      "唯物辩证法认为外因是变化的条件，内因是变化的根据，外因通过内因而起作用。鸡蛋因得适当的温度而变化为鸡子，但温度不能使石头变为鸡子，因为二者的根据是不同的。《矛盾论》（一九三七年蜍 月），《毛泽东选集》第一卷第二九一页。",
      "马克思主义的哲学认为，对立统一规律是宇宙的根本规律。这个规律，不论在自然界、人类社会和人们的思想中，都是普遍存在的。矛盾着的对立面又统一，又斗争，由此推动事物的运动和变化。矛盾是普遍存在的，不过按事物的性质不同，矛盾的性质也就不同，对于任何一个具体的事物说来，对立的统一是有条件的、暂时的、过渡的，因而是相对的，对立的斗争则是绝对的。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第九——一零页。",
      "分析的方法就是辩证的方法。所谓分析，就是分析事物的矛盾。不熟悉生活，对于所论的矛盾不真正了解，就不可能有中肯的分析。《在中国共产党全国宣传工作会议上的讲话》（一九五七年三月十二日），人民出版社版第一五页。",
      "列宁说，对于具体情况作具体的分析，是“马克思主义的最本质的东西，马克思主义的活的灵魂”。我们许多同志缺乏分析的头脑，对于复杂事物，不愿作反复深入的分析研究，而爱作绝对肯定或绝对否定的简单结论。……今后应该改善这种状况。《学习和时局》（一九四四年四月十二日），《毛泽东选集》第三卷第九四三页。",
      "这些同志看问题的方法不对。他们不去看问题的本质方面，主流方面，而是强调那些非本质方面、非主流方面的东西。应当指出：不能忽略非本质方面和非主流方面的问题，必须逐一地将它们解决。但是，不应当将这些看成为本质和主流，以致迷惑了自己的方向。《关于农业合作化问题》（一九五五年七月三十一日），《人民出版社版第二一页。",
      "世界上的事情是复杂的，是由各方面的因素决定的。看问题要从各方面去看，不能只从单方面看。《关于重庆谈判》（一九四五年十月十七日），《毛泽东选集》第四卷第一一五六页。",
      "只有那些主观地、片面地和表面地看问题的人，跑到一个地方，不问环境的情况，不看事情的全体（事情的历史和全部现状），也不触到事情的本质（事情的性质及此一事情和其他事情的内部联系），就自以为是地发号施令起来，这样的人是没有不跌交子的。《实践论》（一九三七年七月），《毛泽东选集》第一卷第二七八——二七九页。",
      "研究问题，忌带主观性、片面性和表面性。所谓主观性，就是不知道客观地看问题，也就是不知道用唯物的观点去看问题。这一点，我在《实践论》一文中已经说过了。所谓片面性，就是不知道全面地看问题。……或者叫做只看见局部，不看见全体，只看见树木，不看见森林。这样，是不能找出解决矛盾的方法的，是不能完成革命任务的，是不能做好所任工作的，是不能正确地发展党内的思想斗争的。孙子论军事说：“知彼知己，百战不殆。” 他说的是作战的双方。唐朝人魏征说过：“兼听则明，偏信则暗。” 也懂得片面性不对。可是我们的同志看问题，往往带片面性，这样的人就往往碰钉子。……列宁说：“要真正地认识对象，就必须把握和研究它的一切方面、一切联系和‘媒介’。我们决不会完全地作到这一点，可是要求全面性，将使我们防止错误，防止僵化。”我们应该记得他的话。表面性，是对矛盾总体和矛盾各方的特点都不去看，否认深入事物里面精细地研究矛盾特点的必要，仅仅站在那里远远地望一望，粗枝大叶地看到一点矛盾的形相，就想动手去解决矛盾（答复问题、解决纠纷、处理工作、指挥战争）。这样的做法，没有不出乱子的。……片面性、表面性也是主观性，因为一切客观事物本来是互相联系的和具有内部规律的，人们不去如实地反映这些情况，而只是片面地或表面地去看它们，不认识事物的互相联系，不认识事物的内部规律，所以这种方法是主观主义的。《矛盾论》（一九三七年八月），《毛泽东选集》第一卷第三零零——三零二页片面性就是思想上的绝对化，就是形而上学地看问题。对于我们的工作的看法，肯定一切或者否定一切，都是片面性的。……肯定一切，就是只看到好的，看不到坏的，只能赞扬，不能批评。说我们的工作似乎一切都好，这不合乎事实。不是一切都好，还有缺点和错误。但是也不是一切都坏，这也不合乎事实。要加以分析。否定一切，就是不加分析地认为事情都做得不好，社会主义建设这样一个伟大事业，几亿人口所进行的这个伟大斗争，似乎没有什么好处可说，一团糟。许多具有这种看法的人，虽然和那些对社会主义制度心怀敌意的人还不相同，但是这种看法是很错误的，很有害的，它只会使人丧失信心。不论是用肯定一切的观点或者否定一切的观点来看我们的工作，都是错误的。《在中国共产党全国宣传工作会议上的讲话》（一九五七年三月十二日），人民出版社版第一三——一四页。",
      "马克思主义者看问题，不但要看到部分，而且要看到全体。一个虾蟆坐在井里说：“天有一个井大。”这是不对的，因为天不止一个井大。如果它说：“天的某一部分有一个井大。”这是对的，因为合乎事实。《论反对日本帝国主义的策略》（一九三五年十二月二十七日），《毛泽东选集》第一卷第一四四页我们必须学会全面地看问题，不但要看到事物的正面，也要看到它的反面。在一定的条件下，坏的东西可以引出好的结果，好的东西也可以引出坏的结果。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第三四页。",
      "我们承认总的历史发展中是物质的东西决定精神的东西，是社会的存在决定社会的意识；但是同时又承认而且必须承认精神的东西的反作用，社会意识对于社会存在的反作用，上层建筑对于经济基础的反作用。这不是违反唯物论，正是避免了机械唯物论，坚持了辩证唯物论。《矛盾论》（一九三七年八月），《毛泽东选集》第一卷第三一四页。",
      "指导战争的人们不能超越客观条件许可的限度期求战争的胜利，然而可以而且必须在客观条件的限度之内，能动地争取战争的胜利。战争指挥员活动的舞台，必须建筑在客观条件的许可之上，然而他们凭借这个舞台，却可以导演出很多有声有色、威武雄壮的戏剧来。《论持久战》（一九三八年五月），《毛泽东选集》第二卷第四六八页人们的思想必须适应已经变化的情况，当然，任何人不可以无根据地胡思乱想，不可以超越客观情况所许可的条件去计划自己的行动，不要勉强地去做那些实在做不到的事情。但是现在的问题，还是右倾保守思想在许多方面作怪，使许多方面的工作不能适应客观情况的发展。现在的问题是经过努力本来可以做到的事情，却有很多人认为做不到。《中国农村的社会主义高潮》的序言（一九五五年十二月二十七日），《中国农村的社会主义高潮》上册第四页。",
      "凡事应该用脑筋好好想一想。俗话说：“眉头一皱，计上心来。” 就是说多想出智慧。要去掉我们党内浓厚的盲目性，必须提倡思索，学会分析事物的方法，养成分析的习惯。《学习和时局》（一九四四年四月十二日），《毛泽东选集》第九五二页。",
      "任何过程如果有多数矛盾存在的话，其中必定有一种是主要的，起着领导的、决定的作用，其他则处于次要和服从的地位。因此，研究任何过程，如果是存在着两个以上矛盾的复杂过程的话，就要用全力找出它的主要矛盾。捉住了这个主要矛盾，一切问题就迎刃而解了。《矛盾论》（一九三七年八月），《毛泽东选集》第一卷第三一零页矛盾着的两方面中，必有一方面是主要的，他方面是次要的。其主要的方面，即所谓矛盾起主导作用的方面。事物的性质，主要地是由取得支配地位的矛盾的主要方面所规定的。",
      "然而这种情形不是固定的，矛盾的主要和非主要的方面互相转化着，事物的性质也就随着起变化。《矛盾论》（九三七年八月），《毛泽东选集》第一卷第三一零页。",
      "我们不但要提出任务，而且要解决完成任务的方法问题。我们的任务是过河，但是没有桥或没有船就不能过。不解决桥或船的问题，过河就是一句空话。不解决方法问题，任务也只是瞎说一顿。《关心群众生活，注意工作方法》（一九三四年一月二十七日），《毛泽东选集》第一卷第一三四页。",
      "任何工作任务，如果没有一般的普遍的号召，就不能动员广大群众行动起来。但如果只限于一般号召，而领导人员没有具体地直接地从若干组织将所号召的工作深入实施，突破一点，取得经验，然后利用这种经验去指导其他单位，就无法考验自己提出的一般号召是否正确，也无法充实一般号召的内容，就有使一般号召归于落空的危险。《关于领导方法的若干问题》（一九四三年六月一日），《毛泽东选集》第三卷第八九九页。",
      "任何领导人员，凡不从下级个别单位的个别人员、个别事件取得具体经验者，必不能向一切单位作普遍的指导。这一方法必须普遍地提倡，使各级领导干部都能学会使用。《关于领导方法的若干问题》（一九四三年六月一日），《毛泽东选集》第三卷第九零零页。",
      "在任何一个地区内，不能同时有许多中心工作，在一定时间内只能有一个中心工作，辅以别的第二位、第三位的工作。因此，一个地区的总负责人，必须考虑到该处的斗争历史和斗争环境，将各项工作摆在适当的地位；而不是自己全无计划，只按上级指示来一件做一件，形成很多的“中心工作”和凌乱无秩序的状态。",
      "上级机关也不要不分轻重缓急地没有中心地同时指定下级机关做很多项工作，以致引起下级在工作步骤上的凌乱，而得不到确定的结果。领导人员依照每一具体地区的历史条件和环境条件，统筹全局，正确地决定每一时期的工作重心和工作秩序，并把这种决定坚持地贯彻下去，务必得到一定的结果，这是一种领导艺术。《关于领导方法的若干问题》（一九四三年六月一日），《毛泽东选集》第三卷第九零三页必须随时掌握工作进程，交流经验，纠正错误，不要等数月、半年以至一年后，才开总结会，算总帐，总的纠正。这样损失太大，而随时纠正，损失较少。《关于工商业政策》（一九四八年二月二十七日），《毛泽东选集》第四卷第一二八页。",
      "不要等到问题成了堆，闹出了许多乱子，然后才去解决。领导一定要走在运动的前面，不要落在它的后面。《季节包工》一文的按语（一九五五年），《中国农村的社会主义高潮》下册第一一五九页。",
      "我们需要的是热烈而镇定的情绪，紧张而有秩序的工作。《中国革命战争的战略问题》（一九三六年十二月），《毛泽东选集》第一卷第一九六——一九七页。",
      "一切实际工作者必须向下作调查。对于只懂得理论不懂得实际情况的人，这种调查工作尤有必要，否则他们就不能将理论和实际相联系。“没有调查就没有发言权”，这句话，虽然曾经被人讥为“狭隘经验论”的，我却至今不悔；不但不悔，我仍然坚持没有调查是不可能有发言权的。有许多人，“下车伊始”，就哇喇哇喇地发议论，提意见，这也批评，那也指责，其实这种人十个有十个要失败。因为这种议论或批评，没有经过周密调查，不过是无知妄说。我们党吃所谓“钦差大臣”的亏，是不可胜数的。而这种“钦差大臣”则是满天飞，几乎到处都有。斯大林的话说得对：“理论若不和革命实践联系起来，就会变成无对象的理论。” 当然又是他的话对：“实践若不以革命理论为指南，就会变成盲目的实践。”除了盲目的、无前途的、无远见的实际家，是不能叫做“狭隘经验论”的。《“农村调查”的序言和跋》（一九四一年三月、四月），《毛泽东选集》第三卷第七九一页。",
      "这种态度，就是实事求是的态度。“实事”就是客观存在着的一切事物，“是”就是客观事物的内部联系，即规律性，“求”就是我们去研究。我们要从国内外、省内外、县内外、区内外的实际情况出发，从其中引出其固有的而不是臆造的规律性，即找出周围事变的内部联系，作为我们行动的向导。而要这样做，就须不凭主观想像，不凭一时的热情，不凭死的书本，而凭客观存在的事实，详细地占有材料，在马克思列宁主义一般原理的指导下，从这些材料中引出正确的结论。《改造我们的学习》（一九四一年五月）《毛泽东选集》第三卷第八零一页。",
      "“闭塞眼睛捉麻雀”，“瞎子摸鱼”，粗枝大叶，夸夸其谈，满足于一知半解，这种极坏的作风，这种完全违反马克思列宁主义基本精神的作风，还在我党许多同志中继续存在着。马克思、恩格斯、列宁、斯大林教导我们认真地研究情况，从客观的真实的情况出发，而不是从主观的愿望出发；我们的许多同志却直接违反这一真理。《改造我们的学习》（一九四一年五月），《毛泽东选集》第三卷第七九七页。",
      "你对于那个问题不能解决么？那末，你就去调查那个问题的现状和它的历史吧！你完完全全调查明白了，你对那个问题就有解决的办法了。一切结论产生于调查情况的末尾，而不是在它的先头。只有蠢人，才是他一个人，或者邀集一堆人，不作调查，而只是冥思苦索地“想办法”，“打主意”。须知这是一定不能想出什么好办法，打出什么好主意的。《反对本本主义》（一九三零年五月），人民出版社版第二页。",
      "调查就象“十月怀胎”，解决问题就象“一朝分娩”。调查就是解决问题。《反对本本主义》（一九三零年五月），人民出版社版第三页。",
      "应用马克思列宁主义的理论和方法，对周围环境作系统的周密的调查和研究。不是单凭热情去工作，而是如同斯大林所说的那样：把革命气概和实际精神结合起来。《改造我们的学习》（一九四一年五月），《毛泽东选集》第三卷第八零一页。",
      "要了解情况，唯一的方法是向社会作调查，调查社会各阶级的生动情况。对于担负指导工作的人来说，有计划地抓住几个城市、几个乡村，用马克思主义的基本观点，即阶级分析的方法，作几次周密的调查，乃是了解情况的最基本的方法。《“农村调查”的序言和跋》（一九四一年三月、四月），《毛泽东选集》第三卷第七八九页。",
      "开调查会每次人不必多，三五个七八个人即够。必须给予时间，必须有调查纲目，还必须自己口问手写，并同到会人展开讨论。因此，没有满腔的热忱，没有眼睛向下的决心，没有求知的渴望，没有放下臭架子、甘当小学生的精神，是一定不能做，也一定做不好的。《“农村调查”的序言和跋》（一九四一年三月、四月），《毛泽东选集》第三卷第七九零页指挥员的正确的部署来源于正确的决心，正确的决心来源于正确的判断，正确的判断来源于周到的和必要的侦察，和对于各种侦察材料的联贯起来的思索。指挥员使用一切可能的和必要的侦察手段，将侦察得来的敌方情况的各种材料加以去粗取精、去伪存真、由此及彼、由表及里的思索，然后将自己方面的情况加上去，研究双方的对比和相互的关系，因而构成判断，定下决心，作出计划，——这是军事家在作出每一个战略、战役或战斗的计划之前的一个整个的认识情况的过程。《中国革命战争的战略问题》（一九三六年十二月），《毛泽东选集》第一卷第一七三页。",
      "即使我们的工作得到了极其伟大的成绩，也没有任何值得骄傲自大的理由。虚心使人进步，骄傲使人落后，我们应当永远记住这个真理。《中国共产党第八次全国代表大会开幕词》（一九五六年九月十五日），《中国共产党第八次全国代表大会文献》第九——一零页因为胜利，党内的骄傲情绪，以功臣自居的情绪，停顿起来不求进步的情绪，贪图享乐不愿再过艰苦生活的情绪，可能生长。因为胜利，人民感谢我们，资产阶级也会出来捧场。敌人的武力是不能征服我们的，这点已经得到证明了。资产阶级的捧场则可能征服我们队伍中的意志薄弱者。可能有这样一些共产党人，他们是不曾被拿枪的敌人征服过的，他们在这些敌人面前不愧英雄的称号；但是经不起人们用糖衣裹着的炮弹的攻击，他们在糖弹面前要打败仗。我们必须预防这种情况。《在中国共产党第七届中央委员会第二次全体会议上的报告》（一九四九年三月五日），《毛泽东选集》第四卷第一四三九页。",
      "有许多的东西，只要我们对它们陷入盲目性，缺乏自觉性，就可能成为我们的包袱，成为我们的负担。例如：犯过错误，可以使人觉得自己反正是犯了错误的，从此萎靡不振；未犯错误，也可以使人觉得自己是未犯过错误的，从此骄傲起来。工作无成绩，可以使人悲观丧气；工作有成绩，又可以使人趾高气扬。斗争历史短的，可以因其短而不负责任；斗争历史长的，可以因其长而自以为是。工农分子，可以自己的光荣出身傲视知识分子；知识分子，又可以自己有某些知识傲视工农分子。各种业务专长，都可以成为高傲自大轻视旁人的资本。甚至年龄也可以成为骄傲的工具：青年人可以因为自己聪明能干而看不起老年人，老年人又可以因为自己富有经验而看不起青年人。对于诸如此类的东西，如果没有自觉性，那它们就会成为负担或包袱。《学习和时局》（一九四四年四月十二日），《毛泽东选集》第三卷第九五一页。",
      "一部分军队工作同志养成了一种骄气，对士兵，对人民，对政府，对党，横蛮不讲理，只责备做地方工作的同志，不责备自己，只看见成绩，不看见缺点，只爱听恭维话，不爱听批评话。……军队必须注意克服这种毛病。《组织起来》（一九四三年十一月二十九日），《毛泽东选集》第三卷第九三七页。",
      "艰苦的工作就象担子，摆在我们的面前，看我们敢不敢承担。担子有轻有重。有的人拈轻怕重，把重担子推给人家，自己拣轻的挑。这就不是好的态度。有的同志不是这样，享受让给人家，担子拣重的挑，吃苦在别人前头，享受在别人后头。这样的同志就是好同志。这种共产主义者的精神，我们都要学习。《关于重庆谈判》（一九四五年十月十七日），《毛泽东选集》第四卷第一一六零页。",
      "不少的人对工作不负责任，拈轻怕重，把重担子推给人家，自己挑轻的。一事当前，先替自己打算，然后再替别人打算。出了一点力就觉得了不起，喜欢自吹，生怕人家不知道。对同志对人民不是满腔热忱，而是冷冷清清，漠不关心，麻木不仁。这种人其实不是共产党员，至少不能算一个纯粹的共产党员。《纪念白求恩》（一九三九年十二月二十一日），《毛泽东选集》第二卷第六五三——六五四页。",
      "闹这类独立性的人，常常跟他们的个人第一主义分不开，他们在个人和党的关系问题上，往往是不正确的。他们在口头上虽然也说尊重党，但他们在实际上却把个人放在第一位，把党放在第二位。这种人闹什么东西呢？闹名誉，闹地位，闹出风头。在他们掌管一部分事业的时候，就要闹独立性。为了这些，就要拉拢一些人，排挤一些人，在同志中吹吹拍拍，拉拉扯扯，把资产阶级政党的庸俗作风也搬进共产党里来了。这种人的吃亏在于不老实。我想，我们应该是老老实实地办事；在世界上要办成几件事，没有老实态度是根本不行的。《整顿党的作风》（一九四二年二月一日），《毛泽东选集》第三卷第八二三——八二四页。",
      "共产党员必须懂得以局部需要服从全局需要这一个道理。如果某项意见在局部的情形看来是可行的，而在全局的情形看来是不可行的，就应以局部服从全局。反之也是一样，在局部的情形看来是不可行的，而在全局的情形看来是可行的，也应以局部服从全局。这就是照顾全局的观点。《中国共产党在民族战争中的地位》（一九三八年十月），《毛泽东选集》第二卷第五一三——五一四页。",
      "享乐主义。个人主义见于享乐方面的，在红军中也有不少的人。他们总是希望队伍开到大城市去。他们要到大城市不是为了去工作，而是为了去享乐。他们最不乐意的是在生活艰难的红色区域里工作。《关于纠正党内的错误思想》（一九二九年十二月），《毛泽东选集》第一卷第九六页。",
      "必须反对只顾自己不顾别人的本位主义的倾向。谁要是对别人的困难不管，别人要调他所属的干部不给，或以坏的送人，“以邻为壑”，全不为别部、别地、别人想一想，这样的人就叫做本位主义者，这就是完全失掉了共产主义的精神。不顾大局，对别部、别地、别人漠不关心，就是这种本位主义者的特点。对于这样的人，必须加重教育，使他们懂得这就是一种宗派主义的倾向，如果发展下去，是很危险的。《整顿党的作风》（一九四二年二月一日），《毛泽东选集》第三卷第八二五——八二六页。",
      "自由主义有各种表现。因为是熟人、同乡、同学、知心朋友、亲爱者、老同事、老部下，明知不对，也不同他们作原则上的争论，任其下去，求得和平和亲热。或者轻描淡写地说一顿，不作彻底解决，保持一团和气。结果是有害于团体，也有害于个人。这是第一种。不负责任的背后批评，不是积极地向组织建议。当面不说，背后乱说；开会不说，会后乱说。心目中没有集体生活的原则，只有自由放任。这是第二种。事不关己，高高挂起；明知不对，少说为佳；明哲保身，但求无过。这是第三种。命令不服从，个人意见第一。只要组织照顾，不要组织纪律。这是第四种。不是为了团结，为了进步，为了把事情弄好，向不正确的意见斗争和争论，而是个人攻击，闹意气，泄私愤，图报复。这是第五种。听了不正确的议论也不争辩，甚至听了反革命分子的话也不报告，泰然处之，行若无事。这是第六种。见群众不宣传，不鼓动，不演说，不调查，不询问，不关心其痛痒，漠然置之，忘记了自己是一个共产党员，把一个共产党员混同于一个普通的老百姓。这是第七种。见损害群众利益的行为不愤恨，不劝告，不制止，不解释，听之任之。这是第八种。办事不认真，无一定计划，无一定方向，敷衍了事，得过且过，做一天和尚撞一天钟。这是第九种。自以为对革命有功，摆老资格，大事做不来，小事又不做，工作随便，学习松懈。这是第十种。自己错了，也已经懂得，又不想改正，自己对自己采取自由主义。这是第十一种。《反对自由主义》（一九三七年九月七日），《毛泽东选集》第二卷第三四七——三四八页。",
      "革命的集体组织中的自由主义是十分有害的。它是一种腐蚀剂，使团结涣散，关系松懈，工作消极，意见分歧。它使革命队伍失掉严密的组织和纪律，政策不能贯彻到底，党的组织和党所领导的群众发生隔离。这是一种严重的恶劣倾向。《反对自由主义》（一九三七年九月七日），《毛泽东选集》第二卷第三四八页。",
      "自由主义者以抽象的教条看待马克思主义的原则。他们赞成马克思主义，但是不准备实行之，或不准备完全实行之，不准备拿马克思主义代替自己的自由主义。这些人，马克思主义是有的，自由主义也是有的：说的是马克思主义，行的是自由主义；对人是马克思主义，对己是自由主义。两样货色齐备，各有各的用处。",
      "这是一部分人的思想方法。《反对自由主义》（一九三七年九月七日），《毛泽东选集》第二卷第三四九页。",
      "人民的国家是保护人民的。有了人民的国家，人民才有可能在全国范围内和全体规模上，用民主的方法，教育自己和改造自己，使自己脱离内外反动派的影响（这个影响现在还是很大的，并将在长时期内存在着，不能很快地消灭），改造自己从旧社会得来的坏习惯和坏思想，不使自己走入反动派指引的错误路上去，并继续前进，向着社会主义社会和共产主义社会前进。《论人民民主专政》（一九四九年六人三十日），《毛泽东选集》第四卷第一四八一页。",
      "一个人做点好事并不难，难的是一辈子做好事，不做坏事，一贯的有益于广大群众，一贯的有益于青年，一贯的有益于革命，艰苦奋斗几十年如一日，这才是最难最难的呵！《吴玉章同志六十寿辰祝词》（一九四零年一月十五日），一九四零年一月二十四日《新中华报》",
      "国家的统一，人民的团结，国内各民族的团结，这是我们的事业必定要胜利的基本保证。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第一页。",
      "只有经过共产党的团结，才能达到全阶级和全民族的团结，只有经过全阶级全民族的团结，才能战胜敌人，完成民族和民主革命的任务。《为争取千百万群众进入抗日民族统一战线而斗争》（一九三七年五月七日），《毛泽东选集》第一卷第二六九页。",
      "我们要把我们党的一切力量在民主集中制的组织和纪律的原则之下，坚强地团结起来。不论什么同志，只要他是愿意服从党纲、党章和党的决议的，我们就要和他团结。《论联合政府》（一九四五年四月二十四日），《毛泽东选集》第三卷第一零九八页。",
      "在一九四二年，我们曾经把解决人民内部矛盾的这种民主的方法，具体化为一个公式，叫做“团结——批评——团结”。讲详细一点，就是从团结的愿望出发，经过批评或者斗争使矛盾得到解决，从而在新的基础上达到新的团结。按照我们的经验，这是解决人民内部矛盾的一个正确的方法。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第六——七页。",
      "这个军队有一个很好的内部和外部的团结。在内部——官兵之间，上下级之间，军事工作、政治工作和后勤工作之间；在外部 ——军民之间，军政之间，我友之间，都是团结一致的。一切妨害团结的现象，都在必须克服之列。《论联合政府》（一九四五年四月二十四日），《毛泽东选集》第三卷第一零三九页。",
      "在人民内部，民主是对集中而言，自由是对纪律而言。这些都是一个统一体的两个矛盾着的侧面，它们们是矛盾的，又是统一的，我们不应当片面地强调某一个侧面而否定另一个侧面。在人民内部，不可以没有自由，也不可以没有纪律；不可以没有民主，也不可以没有集中。这种民主和集中的统一，自由和纪律的统一，就是我们的民主集中制。在这个制度下，人民享受着广泛的民主和自由；同时又必须用社会主义的纪律约束自己。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第五——六页必须重申党的纪律：（一）个人服从组织；（二）少数服从多数；（三）下级服从上级；（四）全党服从中央。谁破坏了这些纪律，谁就破坏了党的统一。《中国共产党在民族战争中的地位》（一九三八年十月），《毛泽东选集》第二卷第五一六页。",
      "党的纪律之一是少数服从多数。少数人在自己的意见被否决之后，必须拥护多数人所通过的决议。除必要时得在下一次会议再提出讨论外，不得在行动上有任何反对的表示。《关于纠正党内的错误思想》（一九二九年十二月），《毛泽东选集》第一卷第九二页。",
      "三大纪律如下：（一） 一切行动听指挥；（二）不拿群众一针一线；（三）一切缴获要归公。八项注意如下：（一） 说话和气；（二）买卖公平；（三）借东西要还；（四）损坏东西要赔；（五）不打人骂人；（六）不损坏庄稼；（七）不调戏妇女；（八）不虐待俘虏。《中国人民解放军总部关于重行颁布三大纪律八项注意的训令》（一九四七年十月十日），《毛泽东选集》第四卷第一二四一页必须提高纪律性，坚决执行命令，执行政策，执行三大纪律八项注意，军民一致，军政一致，官兵一致，全军一致，不允许任何破坏纪律的现象存在。《中国人民解放军宣言》（一九四七年十月），",
      "共产党是不怕批评的，因为我们是马克思主义者，真理是在我们方面，工农基本群众是在我们方面。《在中国共产党全国宣传工作会议上的讲话》（一九五七年三月十二日），人民出版社版第一一页。",
      "彻底的唯物主义者是无所畏惧的，我们希望一切同我们共同奋斗的人能够勇敢地负起责任，克服困难，不要怕挫折，不要怕有人议论讥笑，也不要怕向我们共产党人提批评建议。“舍得一身剐，敢把皇帝拉下马”，我们在为社会主义共产主义而斗争的时候，必须有这种大无畏的精神。《在中国共产党全国宣传工作会议上的讲话》（一九五七年三月十二日），人民出版社版第一二——一三页我们有批评和自我批评这个马克思列宁主义的武器。我们能够去掉不良作风，保持优良作风。《在中国共产党第七届中央委员会第二次全体会议上的报告》（一九四九年三月五日），《毛泽东选集》第四卷第一四四零页。",
      "有无认真的自我批评，也是我们和其他政党互相区别的显著的标志之一。我们曾经说过，房子是应该经常打扫的，不打扫就会积满了灰尘；脸是应该经常洗的，不洗也就会灰尘满面。我们同志的思想，我们党的工作，也会沾染灰尘的，也应该打扫和洗涤。 “流水不腐，户枢不蠹”，是说它们在不停的运动中抵抗了微生物或其他生物的侵蚀。对于我们，经常地检讨工作，在检讨中推广民主作风，不惧怕批评和自我批评，实行“知无不言，言无不尽”，“言者无罪，闻者足戒”，“有则改之，无则加勉”这些中国人民的有益的格言，正是抵抗各种政治灰尘和政治微生物侵蚀我们同志的思想和我们党的肌体的唯一有效的方法。《论联合政府》（一九四五年四月二十四日），《毛泽东选集》第三卷第一零九七页。",
      "党内不同思想的对立和斗争是经常发生的，这是社会的阶级矛盾和新旧事物的矛盾在党内的反映。党内如果没有矛盾和解决矛盾的思想斗争，党的生命也就停止了。《矛盾论》（一九三七年八月），《毛泽东选集》第一卷第二九四页。",
      "我们主张积极的思想斗争，因为它是达到党内和革命团体内的团结使之利于战斗的武器。每个共产党员和革命分子，应该拿起这个武器。",
      "但是自由主义取消思想斗争，主张无原则的和平，结果是腐朽庸俗的作风发生，使党和革命团体的某些组织和某些个人在政治上腐化起来。《反对自由主义》（一九三七年九月七日），《毛泽东选集》第二卷第三四七页。",
      "我们反对主观主义、宗派主义、党八股，有两条宗旨是必须注意的：第一是“惩前毖后”，第二是“治病救人”。对以前的错误一定要揭发，不讲情面，要以科学的态度来分析批判过去的坏东西，以便使后来的工作慎重些，做得好些。这就是“惩前毖后” 的意思。但是我们揭发错误、批判缺点的目的，好象医生治病一样，完全是为了救人，而不是为了把人整死。一个人发了阑尾炎，医生把阑尾割了，这个人就救出来了。任何犯错误的人，只要他不讳疾忌医，不固执错误，以至于达到不可救药的地步，而是老老实实，真正愿意医治，愿意改正，我们就要欢迎他，把他的毛病治好，使他变为一个好同志。这个工作决不是痛快一时，乱打一顿，所能奏效的。对待思想上的毛病和政治上的毛病，决不能采用鲁莽的态度，必须采用“治病救人”的态度，才是正确有效的方法。《整顿党的作风》（一九四二年二月一日），《毛泽东选集》第三卷第八二九——八三零页。",
      "关于党内批评问题，还有一点要说及的，就是有些同志的批评不注意大的方面，只注意小的方面。他们不明白批评的主要任务，是指出政治上的错误和组织上的错误。至于个人缺点，如果不是与政治的和组织的错误有联系，则不必多所指摘，使同志们无所措手足。而且这种批评一发展，党内精神完全集注到小的缺点方面，人人变成了谨小慎微的君子，就会忘记党的政治任务，这是很大的危险。《关于纠正党内的错误思想》（一九二九年十二月），《毛泽东选集》第一卷第九四页。",
      "党内批评要防止主观武断和把批评庸俗化，说话要有证据，批评要注意政治。《关于纠正党内的错误思想》（一九二九年十二月），《毛泽东选集》第一卷第九五页党内批评是坚强党的组织、增加党的战斗力的武器。但是红军党内的批评有些不是这样，变成了攻击个人。其结果，不但毁坏了个人，也毁坏了党的组织。这是小资产阶级个人主义的表现。纠正的方法，在于使党员明白批评的目的是增加党的战斗力以达到阶级斗争的胜利，不应当利用批评去做攻击个人的工具。《关于纠正党内的错误思想》（一九二九年十二月），《毛泽东选集》第一卷第九二页。",
      "因为我们是为人民服务的，所以，我们如果有缺点，就不怕别人批评指出。不管是什么人，谁向我们指出都行。只要你说得对，我们就改正。你说的办法对人民有好处，我们就照你的办。《为人民服务》（一九四四年九月八日），《毛泽东选集》第三卷第一零零三页。",
      "以中国最广大人民的最大利益为出发点的中国共产党人，相信自己的事业是完全合乎正义的，不惜牺牲自己个人的一切，随时准备拿出自己的生命去殉我们的事业，难道还有什么不适合人民需要的思想、观点、意见、办法，舍不得丢掉的吗？难道我们还欢迎任何政治的灰尘、政治的微生物来玷污我们的清洁的面貌和侵蚀我们的健全的肌体吗？无数革命先烈为了人民的利益牺牲了他们的生命，使我们每个活着人想起他们就心里难过，难道我们还有什么个人利益不能牺牲，还有什么错误不能抛弃吗？《论联合政府》（一九四五年四月二十四日），《毛泽东选集》第三卷第一零九七——一零九八页。",
      "我们决不能一见成绩就自满自足起来。我们应该抑制自满，时时批评自己的缺点，好象我们为了清洁，为了去掉灰尘，天天要洗脸，天天要扫地一样。《组织起来》（一九四三年十一月二十九日），《毛泽东选集》第三卷第九三八页。",
      "批评要是及时的批评，不要老是爱好事后的批评。《关于农业合作化问题》（一九五五年七月三十一日），人民出版社版第二九页。",
      "错误和挫折教训了我们，使我们比较地聪明起来了，我们的事情就办得好一些。任何个人，错误总是难免的，我们要求犯得少一点。犯了错误则要求改正，改正得越迅速，越彻底，越好。《论人民民主专政》（一九四九年六月三十日），《毛泽东选集》第四卷第一四八五页。",
      "一个共产党员，应该是襟怀坦白，忠实，积极，以革命利益为第一生命，以个人利益服从革命利益；无论何时何地，坚持正确的原则，同一切不正确的思想和行为作不疲倦的斗争，用以巩固党的集体生活，巩固党和群众的联系；关心党和群众比关心个人为重，关心他人比关心自己为重。这样才算得一个共产党员。《反对自由主义》（一九三七年九月七日），《毛泽东选集》第二卷第三四九页。",
      "应该使每个同志明了，共产党人的一切言论行动，必须以合乎最广大人民群众的最大利益，为最广大人民群众所拥护为最高标准。《论联合政府》（一九四五年四月二十四日），《毛泽东选集》第三卷第一零九七页。",
      "共产党员无论何时何地都不应以个人利益放在第一位，而应以个人利益服从于民族的和人民群众的利益。因此，自私自利，消极怠工，贪污腐化，风头主义等等，是最可鄙的；而大公无私，积极努力，克已奉公，埋头苦干的精神，才是可尊敬的。《中国共产党在民族战争中的地位》（一九三八年十月），《毛泽东选集》第二卷第五一零页共产党人必须随时准备坚持真理，因为任何真理都是符合于人民利益的；共产党人必须随时准备修正错误，因为任何错误都是不符合于人民利益的。《论联合政府》（一九四五年四月二十四日），《毛泽东选集》第三卷第一零九六页。",
      "共产党员对任何事情都要问一个为什么，都要经过自己头脑的周密思考，想一想它是否合乎实际，是否真有道理，绝对不应盲从，绝对不应提倡奴隶主义。《整顿党的作风》（一九四二年二月一日），《毛泽东选集》第三卷第八二九页。",
      "要提倡顾全大局。每一个党员，每一种局部工作，每一项言论或行动，都必须以全党利益为出发点，绝对不许可违反这个原则。《整顿党的作风》（一九四二年二月一日），《毛泽东选集》第三卷第八二三页。",
      "共产党员应是实事求是的模范，又是具有远见卓识的模范。因为只有实事求是，才能完成确定的任务；只有远见卓识，才能不失前进的方向。《中国共产党在民族战争中的地位》（一九三八年十月），《毛泽东选集》第二卷第五一零页。",
      "共产党员应该作到最有远见，最富于牺牲精神，最坚定，而又最能虚心体会情况，依靠群众的多数，得到群众的拥护。《中国共产党在抗日时期的任务》（一九三七年五月三日），《毛泽东选集》第一卷第二五四页。",
      "共产党员又应成为学习的模范，他们每天都是民众的教师，但又每天都是民众的学生。《中国共产党在民族战争中的地位》（一九三八年十月），《毛泽东选集》第二卷第五一零——五一一页。",
      "共产党员在民众运动中，应该是民众的朋友，而不是民众的上司，是诲人不倦的教师，而不是官僚主义的政客。《中国共产党在民族战争中的地位》（一九三八年十月），《毛泽东选集》第二卷第五一零页。",
      "共产党员决不可脱离群众的多数，置多数人的情况于不顾，而率领少数先进队伍单独冒进；必须注意组织先进分子和广大群众之间的密切联系。这就是照顾多数的观点。《中国共产党在民族战争中的地位》（一九三八年十月），《毛泽东选集》第二卷第五一四页。",
      "我们共产党人好比种子，人民好比土地。我们到了一个地方，就要同那里的人民结合起来，在人民中间生根、开花。《关于重庆谈判》（一九四五年十月十七日），《毛泽东选集》第四卷第一一六一页。",
      "我们共产党员，无论在什么问题上，一定要能够同群众相结合。如果我们的党员，一生一世坐在房子里不出去，不经风雨，不见世面，这种党员，对于中国人民究竟有什么好处没有呢？一点好处也没有的，我们不需要这样的人做党员。我们共产党员应该经风雨，见世面；这个风雨，就是群众斗争的大风雨，这个世面，就是群众斗争的大世面。《组织起来》（一九四三年十一月二十九日），《毛泽东选集》第三卷第九三六页。",
      "共产党员的先锋作用和模范作用是十分重要的。共产党员在八路军和新四军中，应该成为英勇作战的模范，执行命令的模范，遵守纪律的模范，政治工作的模范和内部团结统一的模范。《中国共产党在民族战争中的地位》（一九三八年十月），《毛泽东选集》第二卷第五一零页共产党员决不可自以为是，盛气凌人，以为自己是什么都好，别人是什么都不好；决不可把自己关在小房子里，自吹自擂，称王称霸。《在陕甘宁边区参议会的演说》（一九四一年十一月二十一日），《毛泽东选集》第三卷第八一一页。",
      "共产党员必须倾听党外人士的意见，给别人以说话的机会。别人说得对的，我们应该欢迎，并要跟别人的长处学习；别人说得不对，也应该让别人说完，然后慢慢加以解释。《在陕甘宁边区参议会的演说》（一九四一年十一月二十一日），《毛泽东选集》第三卷第八一一页。",
      "共产党员对于在工作中犯过错误的人们，除了不可救药者外，不是采取排斥态度，而是采取规劝态度，使之翻然改进，弃旧图新。《中国共产党在民族战争中的地位》（一九三八年十月），《毛泽东选集》第二卷第五一零页。",
      "共产党员对于落后的人们的态度，不是轻视他们，看不起他们，而是亲近他们，团结他们，说服他们，鼓励他们前进。《中国共产党在民族战争中的地位》（一九三八年十月），《毛泽东选集》第二卷第五一零页。",
      "为了保证我们的党和国家不改变颜色，我们不仅需要正确的路线和政策，而且需要培养和造就千百万无产阶级革命事业的接班人。",
      "培养无产阶级革命事业接班人的问题从根本上来说，就是老一代无产阶级革命家所开创的马克思列宁主义的革命事业是不是后继有人的问题，就是将来我们党和国家的领导能不能继续掌握在无产阶级革命家手中的问题，就是我们的子孙后代能不能沿着马克思列宁主义的正确道路继续前进的问题，也就是我们能不能胜利地防止赫鲁晓夫修正主义在中国重演的问题。总之，这是关系我们党和国家命运的生死存亡的极其重大的问题。这是无产阶级革命事业的百年大计，千年大计，万年大计。帝国主义的预言家们根据苏联发生的变化，也把“和平演变”的希望，寄托在中国党的第三代或者第四代身上。我们一定要使帝国主义的这种预言彻底破产。我们一定要从上到下地、普遍地、经常不断地注意培养和造就革命事业的接班人。",
      "具备什么条件，才能够充当无产阶级革命事业的接班人呢？他们必须是真正的马克思列宁主义者，而不是象赫鲁晓夫那样的挂着马克思列宁主义招牌的修正主义者。他们必须是全心全意为中国和世界的绝大多数人服务的革命者，而不是象赫鲁晓夫那样，在国内为一小撮资产阶级特权阶层的利益服务，在国际为帝国主义和反动派的利益服务。他们必须是能够团结绝大多数人一道工作的无产阶级政治家。不但要团结和自己意见相同的人，而且要善于团结那些和自己意见不同的人，还要善于团结那些反对过自己并且已被实践证明是犯了错误的人。但是要特别警惕像赫鲁晓夫那样的个人野心家和阴谋家，防止这样的坏人篡夺党和国家的各级领导。他们必须是党的民主集中制的模范执行者，必须学会“从群众中来，到群众中去”的领导方法，必须养成善于听取群众意见的民主作风。而不能像赫鲁晓夫那样，破坏党的民主集中制，专横跋扈，对同志搞突然袭击，不讲道理，实行个人独裁。他们必须谦虚谨慎，戒骄戒躁，富于自我批评精神，勇于改正自己工作中的缺点和错误。而绝不能象赫鲁晓夫那样，文过饰非，把一切功劳归于自己，把一切错误归于别人。",
      "无产阶级革命事业的接班人，是在群众斗争中产生的，是在革命大风大浪的锻炼中成长的。应当在长期的群众斗争中，考察和识别干部，挑选和培养接班人。转摘自《关于赫鲁晓夫的假共产主义及其在世界历史上的教训》，一九六四年七月十四日《人民日报》。",
      "我们党的组织要向全国发展，要自觉地造就成万数的干部，要有几百个最好的群众领袖。这些干部和领袖懂得马克思列宁主义，有政治远见，有工作能力，富于牺牲精神，能独立解决问题，在困难中不动摇，忠心耿耿地为民族、为阶级、为党而工作。党依靠着这些人而联系党员和群众，依靠着这些人对于群众的坚强领导而达到打倒敌人之目的。这些人不要自私自利，不要个人英雄主义和风头主义，不要懒惰和消极性，不要自高自大的宗派主义，他们是大公无私的民族的阶级的英雄，这就是共产党员、党的干部、党的领袖应该有的性格和作风。《为争取千百万群众进入抗日民族统一战线而斗争》（一九三七年五月七日），《毛泽东选集》第一卷第二六七——二六八页。",
      "政治路线确定之后，干部就是决定的因素。因此，有计划地培养大批的新干部。就是我们的战斗任务。《中国共产党在民族战争中的地位》（一九三八年十月），《毛泽东选集》第二卷第五一四页。",
      "共产党的干部政策，应是以能否坚决地执行党的路线，服从党的纪律，和群众有密切的联系，有独立的工作能力，积极肯干，不谋私利为标准，这就是“任人唯贤”的路线。《中国共产党在民族战争中的地位》（一九三八年十月），《毛泽东选集》第二卷第五一五页必须坚持干部参加集体生产劳动的制度。我们党和国家的干部是普通劳动者，而不是骑在人民头上的老爷。干部通过参加集体生产劳动，同劳动人民保持最广泛的、经常的、密切的联系。这是社会主义制度下一件带根本性的大事，它有助于克服官僚主义，防止修正主义和教条主义。转摘自《关于赫鲁晓夫的假共产主义及其在世界历史上的教训》，一九六四年七月十四日《人民日报》",
      "必须善于识别干部。不但要看干部的一时一事，而且要看干部的全部历史和全部工作，这是识别干部的主要方法。《中国共产党在民族战争中的地位》（一九三八年十月），《毛泽东选集》第二卷第五一五页。",
      "必须善于使用干部。领导者的责任，归结起来，主要地是出主意、用干部两件事。一切计划、决议、命令、指示等等，都属于“出主意”一类。使这一切主意见之实行，必须团结干部，推动他们去做，属于“用干部”一类。《中国共产党在民族战争中的地位》（一九三八年十月），《毛泽东选集》第二卷第五一五页必须善于爱护干部。爱护的办法是：第一，指导他们。这就是让他们放手工作，使他们敢于负责；同时，又适时地给以指示，使他们能在党的政治路线下发挥其创造性。第二，提高他们。这就是给以学习的机会，教育他们，使他们在理论上在工作能力上提高一步。第三，检查他们的工作，帮助他们总结经验，发扬成绩，纠正错误。有委托而无检查，及至犯了严重的错误，方才加以注意，不是爱护干部的办法。第四，对于犯错误的干部，一般地应采取说服的方法。帮助他们改正错误。只有对犯了严重错误而又不接受指导的人们，才应当采取斗争的方法。在这里，耐心是必要的；轻易地给人们戴上“机会主义”的大帽子，轻易地采用“开展斗争”的方法，是不对的。第五，照顾他们的困难。干部有疾病、生活、家庭等项困难问题者，必须在可能限度内用心给以照顾。这些就是爱护干部的方法。《中国共产党在民族战争中的地位》（一九三八年十月），《毛泽东选集》第二卷第五一五——五一六页。",
      "凡属真正团结一致、联系群众的领导骨干，必须是从群众斗争中逐渐形成，而不是脱离群众斗争所能形成的。在多数情形下，一个伟大的斗争过程，其开始阶段、中间阶段和最后阶段的领导骨干，不应该是也不可能是完全同一的；必须不断地提拔在斗争中产生的积极分子，来替换原有骨干中相形见绌的分子，或腐化了的分子。《关于领导方法的若干问题》（一九四三年六月一日），《毛泽东选集》第三卷第九零零页。",
      "我们党如果没有广大的新干部同老干部一致合作，我们的事业就会中断。所以一切老干部应该以极大的热忱欢迎新干部，关心新干部。不错，新干部是有缺点的，他们参加革命还不久，还缺乏经验，他们中的有些人还不免带来旧社会不良思想的尾巴，这就是小资产阶级个人主义思想的残余。但是这些缺点是可以从教育中从革命锻炼中逐渐地去掉的。他们的长处，正如斯大林说过的，是对于新鲜事物有锐敏的感觉，因而有高度的热情和积极性，而在这一点上，有些老干部则正是缺乏的。新老干部应该是彼此尊重，互相学习，取长补短，以便团结一致，进行共同的事业，而防止宗派主义的倾向。《整顿党的作风》（一九四二年二月一日），《毛泽东选集》第三卷第八二六页。",
      "不但要关心党的干部，还要关心非党的干部。党外存在着很多的人材，共产党不能把他们置之度外。去掉孤傲习气，善于和非党干部共事，真心诚意地帮助他们，用热烈的同志的态度对待他们，把他们的积极性组织到抗日和建国的伟大事业中去，这是每一个共产党员的责任。《中国共产党在民族战争中的地位》（一九三八年十月），《毛泽东选集》第二卷第五一五页。",
      "世界是你们的，也是我们的，但是归根结底是你们的。你们青年人朝气蓬勃，正在兴旺时期，好象早晨八、九点钟的太阳。希望寄托在你们身上。世界是属于你们的。中国的前途是属于你们的。在莫斯科会见我国留学生和实习生时的谈话（一九五七年十一月十七日），《毛主席在苏联的言论》人民日报出版社版第一四——一五页。",
      "要使全体青年们懂得，我们的国家现在还是一个很穷的国家，并且不可能在短时间内根本改变这种状态，全靠青年和全体人民在几十年时间内，团结奋斗，用自己的双手创造出一个富强的国家。社会主义制度的建立给我们开辟了一条到达理想境界的道路，而理想境界的实现还要靠我们的辛勤劳动。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第二三页不少青年人由于缺少政治经验和社会生活经验，不善于把旧中国和新中国加以比较，不容易深切了解我国人民曾经怎样经历千辛万苦的斗争才摆脱了帝国主义和国民党反动派的压迫，而建立一个美好的社会主义社会要经过怎样的长时间的艰苦劳动。因此，需要在群众中间经常进行生动的、切实的政治教育，并且应当经常把发生的困难向他们作真实的说明，和他们一起研究如何解决困难的办法。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第三二——三三页。",
      "青年是整个社会力量中的一部分最积极最有生气的力量。他们最肯学习，最少保守思想，在社会主义时代尤其是这样。希望各地的党组织，协同青年团组织，注意研究如何特别发挥青年人的力量，不要将他们一般看待，抹杀了他们的特点。当然青年人必须向老年人和成年人学习，要尽量争取在老年人和成年人同意之下去做各种有益的活动。《中山县新平乡第九农业生产合作社的青年突击队》一文的按语（一九五五年），《中国农村的社会主义高潮》下册第九五九页。",
      "看一个青年是不是革命的，拿什么做标准呢？拿什么去辨别他呢？只有一个标准，这就是看他愿意不愿意、并且实行不实行和广大的工农群众结合在一块。愿意并且实行和工农结合的，是革命的，否则就是不革命的，或者是反革命的。他今天把自己结合于工农群众，他今天是革命的；但是如果他明天不去结合了，或者反过来压迫老百姓，那就是不革命的，或者是反革命的了。《青年运动的方向》（一九三九年五月四日），《毛泽东选集》第二卷第五五四页。",
      "知识分子在其未和群众的革命斗争打成一片，在其未下决心为群众利益服务并与群众相结合的时候，往往带有主观主义和个人主义的倾向，他们的思想往往是空虚的，他们的行动往往是动摇的。因此，中国的广大的革命知识分子虽然有先锋的和桥梁的作用，但不是所有这些知识分子都能革命到底的。其中一部分，到了革命的紧急关头，就会脱离革命队伍，采取消极态度；其中少数人，就会变成革命的敌人。知识分子的这种缺点，只有在长期的群众斗争中才能克服。《中国革命和中国共产党》（一九三九年十二月），《毛泽东选集》第二卷第六三六页。",
      "青年团除了应继续配合党的中心工作以外，还要有适合青年特点的独立工作。新中国要为青年们着想，要关怀青年一代的成长。青年们要学习，要工作，但青年时期是长身体的时期。因此，要充分兼顾青年的工作、学习和娱乐、体育、休息两个方面。在接见青年团第二次全国代表大会主席团时的指示（一九五三年六月三十日），一九五三年七月三日《人民日报》",
      "中国的男子，普通要受三种有系统的权力（指政权、族权、神权 ——编者）的支配，……至于女子，除受上述三种权力的支配以外，还受男子的支配（夫权）。这四种权力——政权、族权、神权、夫权，代表了全部封建宗法的思想和制度，是束缚中国人民特别是农民的四条极大的绳索。农民在乡下怎样推翻地主的政权，已如前头所述。地主政权，是一切权力的基干。地主政权既被打翻，族权、神权、夫权便一概跟着动摇起来。……夫权这种东西，自来在贫农中就比较地弱一点。因为经济上贫农妇女不能不较富有阶级的女子多参加劳动，所以她们取得对于家事的发言权以至决定权的是比较多些。至近年，农村经济益发破产，男子控制女子的基本条件，业已破坏了。最近农民运动一起，许多地方，妇女跟着组织了乡村女界联合会，妇女抬头的机会已到，夫权便一天一天地动摇起来。总而言之，所有一切封建的宗法的思想和制度，都随着农民权力的升涨而动摇。《湖南农民运动考察报告》（一九二七年三月），《毛泽东选集》第一卷第三三——三四页团结起来，参加生产和政治活动，改善妇女的经济地位和政治地位。为《新中国妇女》杂志的题词，一九四九年七月二十日《新中国妇女》创刊号",
      "要求保护青年、妇女、儿童的利益，救济失学青年，并使青年、妇女组织起来，以平等地位参加有益于抗日战争和社会进步的各项工作，实现婚姻自由，男女平等，使青年和儿童得到有益的学习；……《论联合政府》（一九四五年四月二十四日），《毛泽东选集》第三卷第一零六五页。",
      "有组织地调剂劳动力和推动妇女参加生产，是我们农业生产方面的最基本的任务。《我们的经济政策》（一九三四年一月二十三日），《毛泽东选集》第一卷第一二六——一二七页。",
      "为了建设伟大的社会主义社会，发动广大的妇女群众参加生产活动，具有极大的意义。在生产中，必须实现男女平等，只有在整个社会的社会主义改造过程中才能实现。《妇女走上了劳动战线》一文的按语（一九五五年），《中国农村的社会主义高潮》上册第三五七页。",
      "在合作化以后，许多合作社感到劳动力不足了，有必要发动过去不参加田间劳动的广大的妇女群众参加到劳动战线上去。……中国的妇女是一种伟大的人力资源。必须发掘这种资源，为了建设一个伟大的社会主义国家而奋斗。《发动妇女投入生产，解决了劳动力不足的困难》一文的按语（一九五五年），《中国农村的社会主义高潮》中册第六七四——六七五页。",
      "使全部妇女劳动力，在同工同酬的原则下，一律参加到劳动战线上去，这个要求，应当在尽可能短的时间内，予以实现。《邢台县民主妇女联合会关于发展农业合作化运动中妇女工作的规划》一文的按语（一九五五年），《中国农村的社会主义高潮》上册第六六页。",
      "在现在世界上，一切文化或文学艺术都是属于一定的阶级，属于一定的政治路线的。为艺术的艺术，超阶级的艺术，和政治并行或互相独立的艺术，实际上是不存在的。无产阶级的文学艺术是无产阶级整个革命事业的一部分，如同列宁所说，是整个革命机器中的“齿轮和螺丝钉”。《在延安文艺座谈会上的讲话》（一九四二年五月），《毛泽东选集》第三卷第八六七页。",
      "革命文化，对于人民大众，是革命的有力武器。革命文化，在革命前，是革命的思想准备；在革命中，是革命总战线中的一条必要和重要的战线。《新民主主义论》（一九四零年一月），《毛泽东选集》第二卷第七零一页。",
      "我们的文学艺术都是为人民大众的，首先是为工农兵的，为工农兵而创作，为工农兵所利用的。《在延安文艺座谈会上的讲话》（一九四二年五月），《毛泽东选集》第三卷第八六五页。",
      "我们的文艺工作者一定要完成这个任务，一定要把立足点移过来，一定要在深入工农兵群众、深入实际斗争的过程中，在学习马克思主义和学习社会的过程中，逐渐地移过来，移到工农兵这方面来，移到无产阶级这方面来。只有这样，我们才能有真正为工农兵的文艺，真正无产阶级的文艺。《在延安文艺座谈会上的讲话》（一九四二年五月），《毛泽东选集》第三卷第八五九页。",
      "要使文艺很好地成为整个革命机器的一个组成部分，作为团结人民、教育人民、打击敌人、消灭敌人的有力的武器，帮助人民同心同德地和敌人作斗争。《在延安文艺座谈会上的讲话》（一九四二年五月），《毛泽东选集》第三卷第八五零页。",
      "文艺批评有两个标准，一个是政治标准，一个是艺术标准。…… 又是政治标准，又是艺术标准，这两者的关系怎么样呢？政治并不等于艺术，一般的宇宙观也并不等于艺术创作和艺术批评的方法。我们不但否认抽象的绝对不变的政治标准，也否认抽象的绝对不变的艺术标准，各个阶级社会中的各个阶级都有不同的政治标准和不同的艺术标准。但是任何阶级社会中的任何阶级，总是以政治标准放在第一位，以艺术标准放在第二位的。……我们的要求则是政治和艺术的统一，内容和形式的统一，革命的政治内容和尽可能完美的艺术形式的统一。缺乏艺术性的艺术品，无论政治上怎样进步，也是没有力量的。因此，我们既反对政治观点错误的艺术品，也反对只有正确的政治观点而没有艺术力量的所谓“标语口号式”的倾向。我们应该进行文艺问题上的两条战线斗争。《在延安文艺座谈会上的讲话》（一九四二年五月），《毛泽东选集》第三卷第八六九——八七一页。",
      "百花齐放、百家争鸣的方针，是促进艺术发展和科学进步的方针，是促进我国的社会主义文化繁荣的方针。艺术上不同的形式和风格可以自由发展，科学上不同的学派可以自由争论。利用行政力量，强制推行一种风格，一种学派，禁止另一种风格，另一种学派，我们认为会有害于艺术和科学的发展。艺术和科学中的是非问题，应当通过艺术界科学界的自由讨论去解决，通过艺术和科学的实践去解决，而不应当采取简单的方法去解决。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第二五——二六页。",
      "没有文化的军队是愚蠢的军队，而愚蠢的军队是不能战胜敌人的。《文化工作中的统一战线》（一九四四年十月三十日），《毛泽东选集》第三卷第一零零九页。",
      "要把一个落后的农业的中国改变成为一个先进的工业化的中国，我们面前的工作是很艰苦的，我们的经验是很不够的。因此，必须善于学习。《中国共产党第八次全国代表大会开幕词》（一九五六年九月十五日），《中国共产党第八次全国代表大会文献》第九页。",
      "情况是在不断地变化，要使自己的思想适应新的情况，就得学习。即使是对于马克思主义已经了解得比较多的人，无产阶级立场比较坚定的人，也还是要再学习，要接受新事物，要研究新问题。《在中国共产党全国宣传工作会议上的讲话》（一九五七年三月十二日），人民出版社版第七页。",

    function ToString(n) {
      if (!/^(0|[1-9]\d*)(\.\d+)?$/.test(n)) {
        return "数据非法";  //判断数据是否大于0
      }

      var unit = "千百拾亿千百拾万千百拾", str = "";
      n += "";

      var indexpoint = n.indexOf('.');  // 如果是小数，截取小数点前面的位数

      if (indexpoint >= 0) {

        n = n.substring(0, indexpoint) + n.substr(indexpoint + 1, 2);   // 若为小数，截取需要使用的unit单位
      }

      unit = unit.substr(unit.length - n.length + 1);  // 若为整数，截取需要使用的unit单位
      for (var i = 0; i < n.length; i++) {
        str += "零一二三四五六七八九十".charAt(n.charAt(i)) + unit.charAt(i);  //遍历转化为大写的数字 零壹贰叁肆伍陆柒捌玖
      }

      return str.replace(/零(千|百|拾|角)/g, "零").replace(/(零)+/g, "零").replace(/零(万|亿|元)/g, "$1").replace(/(亿)万|壹(拾)/g, "$1$2").replace(/^元零?|零分/g, "").replace(/元$/g, "元整"); // 替换掉数字里面的零字符，得到结果
    }

    /**
     * ES3基础版 宝宝年龄计算，兼容老iOS Safari
     * @param {Date} birthDate 生日Date对象
     * @param {Date} targetDate 当前时间Date对象
     * @return {Object} {years, months, days, totalDays}
     */
    function calcBabyAge(birthDate, targetDate) {
      // 拷贝日期对象，防止修改外部原值
      var birth = new Date(birthDate.getTime());
      var now = new Date(targetDate.getTime());

      var years = now.getFullYear() - birth.getFullYear();
      var months = now.getMonth() - birth.getMonth();
      var days = now.getDate() - birth.getDate();

      // 日期不够，向月份借位
      if (days < 0) {
        months = months - 1;
        // 获取上月最后一天（原生最简写法，不依赖任何第三方历法库）
        var lastMonthDay = new Date(now.getFullYear(), now.getMonth(), 0);
        days = days + lastMonthDay.getDate();
      }

      // 月份不够，向年份借位
      if (months < 0) {
        years = years - 1;
        months = months + 12;
      }

      // ====== 计算总天数（消除时区零点bug）======
      var birthDayOnly = new Date(birth.getFullYear(), birth.getMonth(), birth.getDate());
      var nowDayOnly = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var oneDayMs = 24 * 60 * 60 * 1000;
      // 老Safari避免浮点精度，使用Math.floor
      var diffDayCount = Math.floor((nowDayOnly - birthDayOnly) / oneDayMs);
      var totalDays = diffDayCount + 1; // 出生当天算第1天，保持你原有规则

      return {
        years: years,
        months: months,
        days: days,
        totalDays: totalDays
      };
    }
