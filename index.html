          XIU_SONG: {
            '{xx.jiao}': '角星造作主荣昌，外进田财及女郎，嫁娶婚姻出贵子，文人及第见君王，惟有埋葬不可用，三年之后主瘟疫，起工修筑坟基地，堂前立见主人凶。',
            '{xx.kang}': '亢星造作长房当，十日之中主有殃，田地消磨官失职，接运定是虎狼伤，嫁娶婚姻用此日，儿孙新妇守空房，埋葬若还用此日，当时害祸主重伤。',
            '{xx.di}': '氐星造作主灾凶，费尽田园仓库空，埋葬不可用此日，悬绳吊颈祸重重，若是婚姻离别散，夜招浪子入房中，行船必定遭沉没，更生聋哑子孙穷。',
            '{xx.fang}': '房星造作田园进，钱财牛马遍山岗，更招外处田庄宅，荣华富贵福禄康，埋葬若然用此日，高官进职拜君王，嫁娶嫦娥至月殿，三年抱子至朝堂。',
            '{xx.xin}': '心星造作大为凶，更遭刑讼狱囚中，忤逆官非宅产退，埋葬卒暴死相从，婚姻若是用此日，子死儿亡泪满胸，三年之内连遭祸，事事教君没始终。',
            '{xx.tail}': '尾星造作主天恩，富贵荣华福禄增，招财进宝兴家宅，和合婚姻贵子孙，埋葬若能依此日，男清女正子孙兴，开门放水招田宅，代代公侯远播名。',
            '{xx.ji}': '箕星造作主高强，岁岁年年大吉昌，埋葬修坟大吉利，田蚕牛马遍山岗，开门放水招田宅，箧满金银谷满仓，福荫高官加禄位，六亲丰禄乐安康。',
            '{xx.dou}': '斗星造作主招财，文武官员位鼎台，田宅家财千万进，坟堂修筑贵富来，开门放水招牛马，旺蚕男女主和谐，遇此吉宿来照护，时支福庆永无灾。',
            '{xx.niu}': '牛星造作主灾危，九横三灾不可推，家宅不安人口退，田蚕不利主人衰，嫁娶婚姻皆自损，金银财谷渐无之，若是开门并放水，牛猪羊马亦伤悲。',
            '{xx.nv}': '女星造作损婆娘，兄弟相嫌似虎狼，埋葬生灾逢鬼怪，颠邪疾病主瘟惶，为事遭官财失散，泻利留连不可当，开门放水用此日，全家财散主离乡。',
            '{xx.xu}': '虚星造作主灾殃，男女孤眠不一双，内乱风声无礼节，儿孙媳妇伴人床，开门放水遭灾祸，虎咬蛇伤又卒亡，三三五五连年病，家破人亡不可当。',
            '{xx.wei}': '危星不可造高楼，自遭刑吊见血光，三年孩子遭水厄，后生出外永不还，埋葬若还逢此日，周年百日取高堂，三年两载一悲伤，开门放水到官堂。',
            '{xx.shi}': '室星修造进田牛，儿孙代代近王侯，家贵荣华天上至，寿如彭祖八千秋，开门放水招财帛，和合婚姻生贵儿，埋葬若能依此日，门庭兴旺福无休。',
            '{xx.qiang}': '壁星造作主增财，丝蚕大熟福滔天，奴婢自来人口进，开门放水出英贤，埋葬招财官品进，家中诸事乐陶然，婚姻吉利主贵子，早播名誉著祖鞭。',
            '{xx.kui}': '奎星造作得祯祥，家内荣和大吉昌，若是埋葬阴卒死，当年定主两三伤，看看军令刑伤到，重重官事主瘟惶，开门放水遭灾祸，三年两次损儿郎。',
            '{xx.lou}': '娄星修造起门庭，财旺家和事事兴，外进钱财百日进，一家兄弟播高名，婚姻进益生贵子，玉帛金银箱满盈，放水开门皆吉利，男荣女贵寿康宁。',
            '{xx.vei}': '胃星造作事如何，家贵荣华喜气多，埋葬贵临官禄位，夫妇齐眉永保康，婚姻遇此家富贵，三灾九祸不逢他，从此门前多吉庆，儿孙代代拜金阶。',
            '{xx.mao}': '昴星造作进田牛，埋葬官灾不得休，重丧二日三人死，尽卖田园不记增，开门放水招灾祸，三岁孩儿白了头，婚姻不可逢此日，死别生离是可愁。',
            '{xx.bi}': '毕星造作主光前，买得田园有余钱，埋葬此日添官职，田蚕大熟永丰年，开门放水多吉庆，合家人口得安然，婚姻若得逢此日，生得孩儿福寿全。',
            '{xx.zi}': '觜星造作有徒刑，三年必定主伶丁，埋葬卒死多因此，取定寅年使杀人，三丧不止皆由此，一人药毒二人身，家门田地皆退败，仓库金银化作尘。',
            '{xx.can}': '参星造作旺人家，文星照耀大光华，只因造作田财旺，埋葬招疾哭黄沙，开门放水加官职，房房子孙见田加，婚姻许遁遭刑克，男女朝开幕落花。',
            '{xx.jing}': '井星造作旺蚕田，金榜题名第一光，埋葬须防惊卒死，狂颠风疾入黄泉，开门放水招财帛，牛马猪羊旺莫言，贵人田塘来入宅，儿孙兴旺有余钱。',
            '{xx.gui}': '鬼星起造卒人亡，堂前不见主人郎，埋葬此日官禄至，儿孙代代近君王，开门放水须伤死，嫁娶夫妻不久长，修土筑墙伤产女，手扶双女泪汪汪。',
            '{xx.liu}': '柳星造作主遭官，昼夜偷闭不暂安，埋葬瘟惶多疾病，田园退尽守冬寒，开门放水遭聋瞎，腰驼背曲似弓弯，更有棒刑宜谨慎，妇人随客走盘桓。',
            '{xx.xing}': '星宿日好造新房，进职加官近帝王，不可埋葬并放水，凶星临位女人亡，生离死别无心恋，要自归休别嫁郎，孔子九曲殊难度，放水开门天命伤。',
            '{xx.zhang}': '张星日好造龙轩，年年并见进庄田，埋葬不久升官职，代代为官近帝前，开门放水招财帛，婚姻和合福绵绵，田蚕人满仓库满，百般顺意自安然。',
            '{xx.yi}': '翼星不利架高堂，三年二载见瘟惶，埋葬若还逢此日，子孙必定走他乡，婚姻此日不宜利，归家定是不相当，开门放水家须破，少女恋花贪外郎。',
            '{xx.zhen}': '轸星临水造龙宫，代代为官受皇封，富贵荣华增寿禄，库满仓盈自昌隆，埋葬文昌来照助，宅舍安宁不见凶，更有为官沾帝宠，婚姻龙子入龙宫。'

      "少年十五二十時，步行奪得胡馬射。射殺中山白額虎，肯數鄴下黃鬚兒。一身轉戰三千里，一劒曾當百萬師。漢兵奮迅如霹靂，虜騎崩騰畏蒺藜。衞青不敗由天幸，李廣無功緣數奇。自從棄置便衰朽，世事磋跎成白首。昔時飛箭無全目，今日垂楊生左肘。路傍時賣故侯瓜，門前學種先生柳。蒼茫古木連窮巷，寥落寒山對虛牖。誓令疏勒出飛泉，不似潁川空使酒。賀蘭山下陣如雲，羽檄交馳日夕聞。節使三河募年少，詔書五道出將軍。試拂鐵衣如雪色，聊持寶劒動星文。願得燕弓射天將，恥令越甲鳴吳軍。莫嫌舊日雲中守，猶堪一戰取功勳。——《老將行》王維",
      "漁舟逐水愛山春，兩岸桃花夾去津。坐看紅樹不知遠，行盡青溪不見人。山口潛行始隈隩，山開曠望旋平陸。遙看一處攢雲樹，近入千家散花竹。樵客初傳漢姓名，居人未改秦衣服。居人共住武陵源，還從物外起田園。月明松下房櫳靜，日出雲中雞犬喧。驚聞俗客爭來集，競引還家問都邑。平明閭巷埽花開，薄暮漁樵乘水入。初因避地去人間，及至成仙遂不還。峽裏誰知有人事，世中遙望空雲山。不疑靈境難聞見，塵心未盡思鄉縣。出洞無論隔山水，辭家終擬長游衍。自謂經過舊不迷，安知峰壑今來變。當時只記入山深，青溪幾曲到雲林。春來遍是桃花水，不辨仙源何處尋。——《桃源行》王維",
      "洛陽女兒對門居，纔可容顏十五餘。良人玉勒乘驄馬，侍女金盤鱠鯉魚。畫閣朱樓盡相望，紅桃綠柳垂簷向。羅幃送上七香車，寶扇迎歸九華帳。狂夫富貴在青春，意氣驕奢劇季倫。自憐碧玉親教舞，不惜珊瑚持與人。春窗曙滅九微火，九微片片飛花璅。戲罷曾無理曲時，妝成秪是薰香坐。城中相識盡繁華，日夜經過趙李家。誰憐越女顏如玉，貧賤江頭自浣紗。——《洛陽女兒行》王維",
      "寒山轉蒼翠，秋水日潺湲。倚杖柴門外，臨風聽暮蟬。渡頭餘落日，墟里上孤煙。復值接輿醉，狂歌五柳前。——《輞川閑居贈裴秀才迪》王維",
      "晚年唯好靜，萬事不關心。自顧無長策，空知返舊林。松風吹解帶，山月照彈琴。君問窮通理，漁歌入浦深。——《酬張少府》王維",
      "萬壑樹參天，千山響杜鵑。山中一夜雨，樹杪百重泉。漢女輸橦布，巴人訟芋田。文翁翻教授，不敢倚先賢。——《送梓州李使君》王維",
      "昨夜裙帶解，今朝蟢子飛。鉛華不可棄，莫是藁砧歸。——《玉臺體十二首 十一》權德輿",
      "山石犖確行徑微，黃昏到寺蝙蝠飛。升堂坐階新雨足，芭蕉葉大支子肥。僧言古壁佛畫好，以火來照所見稀。鋪牀拂席置羹飯，疎糲亦足飽我飢。夜深靜臥百蟲絕，清月出嶺光入扉。天明獨去無道路，出入高下窮煙霏。山紅澗碧紛爛漫，時見松櫪皆十圍。當流赤足蹋澗石，水聲激激風吹衣。人生如此自可樂，豈必局束爲人鞿。嗟哉吾黨二三子，安得至老不更歸。——《山石》韓愈",
      "纖雲四卷天無河，清風吹空月舒波。沙平水息聲影絕，一桮相屬君當歌。君歌聲酸辭且苦，不能聽終淚如雨。洞庭連天九疑高，蛟龍出沒猩鼯號。十生九死到官所，幽居默默如藏逃。下牀畏蛇食畏藥，海氣濕蟄熏腥臊。昨者州前搥大鼓，嗣皇繼聖登夔臯。赦書一日行萬里，罪從大辟皆除死。遷者追廻流者還，滌瑕蕩垢清朝班。州家申名使家抑，坎軻祗得移荆蠻。判司卑官不堪說，未免捶楚塵埃間。同時輩流多上道，天路幽險難追攀。君歌且休聽我歌，我歌今與君殊科。——《八月十五夜贈張功曹》韓愈",
      "五嶽祭秩皆三公，四方環鎮嵩當中。火維地荒足妖怪，天假神柄專其雄。噴雲泄霧藏半腹，雖有絕頂誰能窮。我來正逢秋雨節，陰氣晦昧無清風。潛心默禱若有應，豈非正直能感通。須臾靜掃衆峰出，仰見突兀撐青空。紫蓋連延接天柱，石廩騰擲堆祝融。森然魄動下馬拜，松柏一逕趨靈宮。粉牆丹柱動光彩，鬼物圖畫填青紅。升階傴僂薦脯酒，欲以菲薄明其衷。廟令老人識神意，睢盱偵伺能鞠躬。手持桮珓導我擲，云此最吉餘難同。竄逐蠻荒幸不死，衣食纔足甘長終。侯王將相望久絕，神縱欲福難爲功。夜投佛寺上高閣，星月掩暎雲朣朧。猿鳴鐘動不知曙，杲杲寒日生於東。——《謁衡嶽廟遂宿嶽寺題門樓》韓愈",
      "碧闌干外繡簾垂，猩血屏風畫折枝。八尺龍鬚方錦褥，已涼天氣未寒時。——《已涼》韓偓",
      "早被嬋娟誤，欲妝臨鏡慵。承恩不在貌，教妾若爲容。風暖鳥聲碎，日高花影重。年年越溪女，相憶採芙蓉。——《春宮怨》杜荀鶴",
      "洞房昨夜停紅燭，待曉堂前拜舅姑。[妝]罷低聲問夫壻，畫眉深淺入時無。——《近試上張籍水部》朱慶餘",
      "清時有味是無能，閑愛孤雲靜愛僧。欲把一麾江海去，樂遊原上望昭陵。——《將赴吳興登樂遊原一絕》杜牧",
      "折戟沈沙鐵未銷，自將磨洗認前朝。東風不與周郎便，銅雀春深鏁二喬。——《赤壁》杜牧",
      "煙籠寒水月籠沙，夜泊秦淮近酒家。商女不知亡國恨，隔江猶唱後庭花。——《泊秦淮》杜牧",
      "娉娉褭褭十三餘，豆蔻梢頭二月初。春風十里揚州路，卷上珠簾總不如。——《贈別二首 一》杜牧",
      "多情却似總無情，唯覺尊前笑不成。蠟燭有心還惜別，替人垂淚到天明。——《贈別二首 二》杜牧",
      "落魄江南載酒行，楚腰腸斷掌中輕。十年一覺揚州夢，贏得青樓薄倖名。——《遣懷》杜牧",
      "紅燭秋光冷畫屏，輕羅小扇撲流螢。天階夜色涼如水，坐看牽牛織女星。——《秋夕》杜牧",
      "繁華事散逐香塵，流水無情草自春。日暮東風怨啼鳥，落花猶似墮樓人。——《金谷園》杜牧",
      "旅館無良伴，凝情自悄然。寒燈思舊事，斷鴈警愁眠。遠夢歸侵曉，家書到隔年。湘江好煙月，門繫釣魚船。——《旅宿》杜牧",
      "遙夜泛清瑟，西風生翠蘿。殘螢委玉露，早鴈拂銀河。高樹曉還密，遠山晴更多。淮南一葉下，自覺老煙波。——《早秋三首 一》許渾",
      "紅葉晚蕭蕭，長亭酒一瓢。殘雲歸太華，疎雨過中條。樹色隨山迥，河聲入海遙。帝鄉明日到，猶自夢漁樵。——《秋日赴闕題潼關驛樓》許渾",
      "別夢依依到謝家，小廊迴合曲闌斜。多情只有春庭月，猶爲離人照落花。——《寄人 一》張泌",
      "誓掃匈奴不顧身，五千貂錦喪胡塵。可憐無定河邊骨，猶是春閨夢裏人。——《隴西行四首 二》陳陶",
      "打起黄鶯兒，莫教枝上啼。幾回驚妾夢，不得到遼西。——《頌古三十二首  其二三》釋明辯",
      "淚濕羅巾夢不成，夜深前殿按歌聲。紅顏未老恩先斷，斜倚薰籠坐到明。——《後宮詞》白居易",
      "十年離亂後，長大一相逢。問姓驚初見，稱名憶舊容。別來滄海事，語罷暮天鐘。明日巴陵道，秋山又幾重。——《喜見外弟又言別》李益",
      "嫁得瞿塘賈，朝朝悞妾期。早知潮有信，嫁與弄潮兒。——《江南詞》李益",
      "回樂峰前沙似雪，受降城下月如霜。不知何處吹蘆管，一夜征人盡望鄉。——《夜上受降城聞笛》李益",
      "鳴箏金粟柱，素手玉房前。欲得周郎顧，時時誤拂弦。——《聽箏》李端",
      "世亂同南去，時清獨北還。他鄉生白髮，舊國見青山。曉月過殘壘，繁星宿故關。寒禽與衰草，處處伴愁顏。——《賊平後送人北歸》司空曙",
      "故人江海別，幾度隔山川。乍見翻疑夢，相悲各問年。孤燈寒照雨，溼竹暗浮煙。更有明朝恨，離杯惜共傳。——《雲陽館與韓紳宿別》司空曙",
      "靜夜四無鄰，荒居舊業貧。雨中黃葉樹，燈下白頭人。以我獨沈久，愧君相見頻。平生自有分，況是蔡家親。——《喜外弟盧綸見宿》司空曙",
      "泠泠七絲上，靜聽松風寒。古調雖自愛，今人多不彈。——《聽彈琴》劉長卿",
      "孤雲將野鶴，豈向人間住。莫買沃洲山，時人已知處。——《送方外上人》劉長卿",
      "蒼蒼竹林寺，杳杳鐘聲晚。荷笠帶夕陽，青山獨歸遠。——《送靈澈上人》劉長卿",
      "鄉心新歲切，天畔獨潸然。老至居人下，春歸在客先。嶺猨同旦暮，江柳共風煙。已是長沙傅，從今又幾年。——《新年作》劉長卿",
      "古臺搖落後，秋日望鄉心。野寺人來少，雲峰水隔深。夕陽依舊壘，寒磬滿空林。惆悵南朝事，長江獨至今。——《秋日登吳公臺上寺遠眺寺即陳將吳明徹戰場》劉長卿",
      "一路經行處，莓苔見履痕。白雲依靜渚，春草閉閑門。過雨看松色，隨山到水源。溪花與禪意，相對亦忘言。——《尋南溪常山道人隱居》劉長卿",
      "望君煙水闊，揮手淚霑巾。飛鳥沒何處，青山空向人。長江一帆遠，落日五湖春。誰見汀洲上，相思愁白蘋。——《餞別王十一南遊》劉長卿",
      "生涯豈料承優詔，世事空知學醉歌。江上月明胡鴈過，淮南木落楚山多。寄身且喜滄洲近，顧影無如白髮何。今日龍鍾人共棄，媿君猶遣慎風波。——《江州重別薛六柳八二員外》劉長卿",
      "三年謫宦此棲遲，萬古惟留楚客悲。秋草獨尋人去後，寒林空見日斜時。漢文有道恩猶薄，湘水無情弔豈知。寂寂江山搖落處，憐君何事到天涯。——《長沙過賈誼宅》劉長卿",
      "[汀]洲無浪復無煙，楚客相思益渺然。漢口夕陽斜渡鳥，洞庭秋水遠連天。孤城背嶺寒吹角，獨戍臨江夜泊船。賈誼上書憂漢室，長沙謫去古今憐。——《自夏口至鸚鵡洲夕望岳陽寄源中丞》劉長卿",
      "鶯啼燕語報新年，馬邑龍堆路幾千。家住層城臨漢苑，[心]隨明月到胡天。機中錦字論長恨，樓上花枝笑獨眠。爲問元戎竇車騎，何時返斾勒燕然。——《賦得》劉長卿",
      "漢文皇帝有高臺，此日登臨曙色開。三晉雲山皆北向，二陵風雨自東來。關門令尹誰能識，河上仙翁去不回。且欲近尋彭澤宰，陶然共醉菊花杯。——《九日登望仙臺呈劉明府容》崔曙",
      "葡萄美酒夜光杯，欲飲琵琶馬上催。醉臥沙場君莫笑，古來征戰幾人回。——《涼州詞二首 一》王翰",
      "北山白雲裏，隱者自怡悅。相望試登高，心飛逐鳥滅。愁因薄暮起，興是清秋發。時見歸村人，沙行渡頭歇。天邊樹若薺，江畔舟如月。何當載酒來，共醉重陽節。——《秋登蘭山寄張五》孟浩然",
      "山光忽西落，池月漸東上。散髮乘夕涼，開軒臥閑敞。荷風送香氣，竹露滴清響。欲取鳴琴彈，恨無知音賞。感此懷故人，中宵勞夢想。——《夏日南亭懷辛大》孟浩然",
      "夕陽度西嶺，羣壑倏已暝。松月生夜涼，風泉滿清聽。樵人歸欲盡，煙鳥棲初定。之子期宿來，孤琴候蘿逕。——《宿業師山房期丁大不至》孟浩然",
      "山寺鐘鳴晝已昏，漁梁渡頭爭渡喧。人隨沙路向江村，余亦乘舟歸鹿門。鹿門月照開煙樹，忽到龐公棲隱處。巖扉松徑長寂寥，惟有幽人夜來去。——《夜歸鹿門山歌》孟浩然",
      "八月湖水平，涵虛混太清。氣蒸雲夢澤，波撼岳陽城。欲濟無舟楫，端居恥聖明。坐觀垂釣者，空有羨魚情。——《望洞庭湖贈張丞相》孟浩然",
      "一丘常欲臥，三徑苦無資。北土非吾願，東林懷我師。黃金然桂盡，壯志逐年衰。日夕涼風至，聞蟬但益悲。——《秦中感秋寄遠上人》孟浩然",
      "山暝聞猿愁，滄江急夜流。風鳴兩岸葉，月照一孤舟。建德非吾土，維揚憶舊遊。還將兩行淚，遙寄海西頭。——《宿桐廬江寄廣陵舊遊》孟浩然",
      "木落雁南度，北風江上寒。我家襄水上，遙隔楚雲端。鄉淚客中盡，孤帆天際看。迷津欲有問，平海夕漫漫。——《早寒江上有懷》孟浩然",
      "寂寂竟何待，朝朝空自歸。欲尋芳草去，惜與故人違。當路誰相假，知音世所稀。秪應守索寞，還掩故園扉。——《留別王侍御維》孟浩然",
      "林臥愁春盡，開軒覽物華。忽逢青鳥使，邀入赤松家。丹竈初開火，仙桃正落花。童顏若可駐，何惜醉流霞。——《清明日宴梅道士房》孟浩然",
      "人事有代謝，往來成古今。江山留勝跡，我輩復登臨。水落魚梁淺，天寒夢澤深。羊公碑字在，讀罷淚沾襟。——《與諸子登峴山》孟浩然",
      "故人具雞黍，邀我至田家。綠樹村邊合，青山郭外斜。開筵面場圃，把酒話桑麻。待到重陽日，還來就菊花。——《過故人莊》孟浩然",
      "北闕休上書，南山歸敝廬。不才明主棄，多病故人疎。白髮催年老，青陽逼歲除。永懷愁不寐，松月夜窗虛。——《歲暮歸南山》孟浩然",
      "迢遞三巴路，羈危萬里身。亂山殘雪夜，孤燈異鄉人。漸與骨肉遠，轉於奴僕親。那堪正飄泊，來日歲華新。——《歲除夜有懷》孟浩然",
      "春眠不覺曉，處處聞啼鳥。夜來風雨聲，花落知多少。——《春曉》孟浩然",
      "移舟泊煙渚，日暮客愁新。野曠天低樹，江清月近人。——《宿建德江》孟浩然",
      "噫吁戲！危乎高哉！蜀道之難難於上青天！蠶叢及魚鳧，開國何茫然。爾來四萬八千歲，不與秦塞通人煙。西當太白有鳥道，可以橫絕峨眉巔。地崩山摧壯士死，然後天梯石棧相鉤連。上有六龍回日之高標，下有衝波逆折之回川。黃鶴之飛尚不得過，猨猱欲度愁攀援。青泥何盤盤，百步九折縈巖巒。捫參歷井仰脅息，以手撫膺坐長歎。問君西遊何時還？畏途巉巖不可攀。但見悲鳥號古木，雄飛雌從繞林間。又聞子規啼夜月，愁空山，蜀道之難難於上青天，使人聽此凋朱顏。連峯去天不盈尺，枯松倒挂倚絕壁。飛湍瀑流爭喧豗，砅厓轉石萬壑雷。其險也如此，嗟爾遠道之人胡爲乎來哉！劒閣崢嶸而崔嵬，一夫當關，萬夫莫開。所守或匪親，化爲狼與豺。朝避猛虎，夕避長蛇。磨牙吮血，殺人如麻。錦城雖云樂，不如早還家。蜀道之難難於上青天，側身西望長咨嗟。——《蜀道難》李白",
      "君不見黃河之水天上來，奔流到海不復迴。君不見高堂明鏡悲白髮，朝如青絲暮成雪。人生得意須盡歡，莫使金樽空對月。天生我材必有用，千金散盡還復來。烹羊宰牛且爲樂，會須一飲三百盃。岑夫子，丹丘生，將進酒，君莫停。與君歌一曲，請君爲我側耳聽。鐘鼓饌玉不足貴，但願長醉不願醒。古來聖賢皆寂寞，惟有飲者留其名。陳王昔時宴平樂，斗酒十千恣讙謔。主人何爲言少錢，徑須沽取對君酌。五花馬，千金裘，呼兒將出換美酒，與爾同銷萬古愁。——《將進酒》李白",
      "早被嬋娟誤，欲妝臨鏡慵。承恩不在貌，教妾若爲容。風暖鳥聲碎，日高花影重。年年越溪女，相憶採芙蓉。——《春宮怨》杜荀鶴",
      "天秋月又滿，城闕夜千重。還作江南會，翻疑夢裏逢。風枝驚暗鵲，露草覆寒蛩。羈旅長堪醉，相留畏曉鐘。——《客夜與故人偶集》戴叔倫",
      "鷲翎金僕姑，燕尾繡蝥弧。獨立揚新令，千營共一呼。——《和張僕射塞下曲 一》盧綸",
      "林暗草驚風，將軍夜引弓。平明尋白羽，沒在石稜中。——《和張僕射塞下曲 二》盧綸",
      "月黑鴈飛高，單于夜遁逃。欲將輕騎逐，大雪滿弓刀。——《和張僕射塞下曲 三》盧綸",
      "野幕敞瓊筵，羌戎賀勞旋。醉和金甲舞，雷鼓動山川。——《和張僕射塞下曲 四》盧綸",
      "雲開遠見漢陽城，猶是孤帆一日程。估客晝眠知浪靜，舟人夜語覺潮生。三湘衰鬢逢秋色，萬里歸心對月明。舊業已隨征戰盡，更堪江上鼓鼙聲。——《晚次鄂州》盧綸",
      "故關衰草遍，離別自堪悲。路出寒雲外，人歸暮雪時。少孤爲客早，多難識君遲。掩淚空相向，風塵何處期。——《李端公》盧綸",
      "不知香積寺，數里入雲峰。古木無人逕，深山何處鐘。泉聲咽危石，日色冷青松。薄暮空潭曲，安禪制毒龍。——《過香積寺》王維",
      "空山新雨後，天氣晚來秋。明月松間照，清泉石上流。竹喧歸浣女，蓮動下漁舟。隨意春芳歇，王孫自可留。——《山居秋暝》王維",
      "中歲頗好道，晚家南山陲。興來每獨往，勝事空自知。行到水窮處，坐看雲起時。偶然值林叟，談笑無還期。——《終南別業》王維",
      "清川帶長薄，車馬去閑閑。流水如有意，暮禽相與還。荒城臨古渡，落日滿秋山。迢遞嵩高下，歸來且閉關。——《歸嵩山作》王維",
      "太乙近天都，連山接海隅。白雲迴望合，青靄入看無。分野中峰變，陰晴衆壑殊。欲投人處宿，隔水問樵夫。——《終南山》王維",
      "楚塞三湘接，荆門九派通。江流天地外，山色有無中。郡邑浮前浦，波瀾動遠空。襄陽好風日，留醉與山翁。——《漢江臨汎》王維",
      "渭水自縈秦塞曲，黃山舊遶漢宮斜。鑾輿迥出千門柳，閣道廻看上苑花。雲裏帝城雙鳳闕，雨中春樹萬人家。爲乘陽氣行時令，不是宸遊玩物華。——《奉和聖製從蓬萊向興慶閣道中留春雨中春望之作應制》王維",
      "絳幘雞人送曉籌，尚衣方進翠雲裘。九天閶闔開宮殿，萬國衣冠拜冕旒。日色纔臨仙掌動，香煙欲傍衮龍浮。朝罷須裁五色詔，佩聲歸向鳳池頭。——《和賈舍人早朝大明宮之作》王維",
      "洞門高閣靄餘輝，桃李陰陰柳絮飛。禁裏疎鐘官舍晚，省中啼鳥吏人稀。晨搖玉佩趨金殿，夕奉天書拜瑣闈。強欲從君無那老，將因臥病解朝衣。——《酬郭給事》王維",
      "積雨空林煙火遲，蒸藜炊黍餉東菑。漠漠水田飛白鷺，陰陰夏木囀黃鸝。山中習靜觀朝槿，松下清齋折露葵。野老與人爭席罷，海鷗何事更相疑。——《積雨輞川莊作》王維",
      "空山不見人，但聞人語響。返景入深林，復照青苔上。——《輞川集 鹿柴》王維",
      "獨坐幽篁裏，彈琴復長嘯。深林人不知，明月來相照。——《輞川集 竹里館》王維",
      "山中相送罷，日暮掩柴扉。春草明年綠，王孫歸不歸。——《送別》王維",
      "君自故鄉來，應知故鄉事。來日綺窗前，寒梅着花未。——《雜詩三首 二》王維",
      "紅豆生南國，秋來發故枝。願君多采擷，此物最相思。——《相思》王維",
      "獨在異鄉爲異客，每逢佳節倍思親。遙知兄弟登高處，遍插茱萸少一人。——《九月九日憶山東兄弟》王維",
      "渭城朝雨浥輕塵，客舍青青楊柳春。勸君更盡一杯酒，西出陽關無故人。——《渭城曲》王維",
      "歸山深淺去，須盡丘壑美。莫學武陵人，暫游桃源裏。——《崔九欲往南山馬上口號與別》裴迪",
      "絕頂一茅茨，直[上]三十里。扣關無僮僕，窺室唯案几。若非巾柴車，應是釣秋水。差池不相見，黽勉空仰止。草色新雨中，松聲晚牕裏。及茲契幽絕，自足蕩心耳。雖無賓主意，頗得清淨理。興盡方下山，何必待之子。——《尋西山隱者不遇》丘爲",
      "昔人已乘白雲去，此地空餘黃鶴樓。黃鶴一去不復返，白雲千載空悠悠。晴川歷歷漢陽樹，春草萋萋鸚鵡洲。日暮鄉關何處是，煙波江上使人愁。——《黃鶴樓》崔顥",
      "岧嶤太華俯咸京，天外三峰削不成。武帝祠前雲欲散，仙人掌上雨初晴。河山北枕秦關險，驛樹西連漢畤平。借問路傍名利客，無如此處學長生。——《行經華陰》崔顥",
      "君家何處住？妾住在橫塘。停船暫借問，或恐是同鄉。——《長干曲四首 一》崔顥",
      "家臨九江水，來去九江側。同是長干人，自小不相識。——《長干曲四首 二》崔顥",
      "燕臺一望客心驚，簫鼓喧喧漢將營。萬里寒光生積雪，三邊曙色動危旌。沙場烽火連胡月，海畔雲山擁薊城。少小雖非投筆吏，論功還欲請長纓。——《望薊門》祖詠",
      "終南陰嶺秀，積雪浮雲端。林表明霽色，城中增暮寒。——《終南望餘雪》祖詠",
      "白日登山望烽火，黃昏飲馬傍交河。行人刁斗風沙暗，公主琵琶幽怨多。野雲萬里無城郭，雨雪紛紛連大漠。胡鴈哀鳴夜夜飛，胡兒眼淚雙雙落。聞道玉門猶被遮，應將性命逐輕車。年年戰骨埋荒外，空見蒲桃入漢家。——《古從軍行》李頎",
      "主人有酒歡今夕，請奏鳴琴廣陵客。月照城頭烏半飛，霜淒萬樹風入衣。銅鑪華燭燭增輝，初彈淥水後楚妃。一聲已動物皆靜，四座無言星欲稀。清淮奉使千餘里，敢告雲山從此始。——《琴歌》李頎",
      "四月南風大麥黃，棗花未落桐陰長。青山朝別暮還見，嘶馬出門思舊鄉。陳侯立身何坦蕩，虬鬚虎眉仍大顙。腹中貯書一萬卷，不肯低頭在草莽。東門酤酒飲我曹，心輕萬事皆鴻毛。醉臥不知白日暮，有時空望孤雲高。長河浪頭連天黑，津口停舟渡不得。鄭國遊人未及家，洛陽行子空歎息。聞道故林相識多，罷官昨日今如何。——《送陳章甫》李頎",
      "南山截竹爲觱篥，此樂本自龜茲出。流傳漢地曲轉奇，涼州胡人爲我吹。傍鄰聞者多歎息，遠客思鄉皆淚垂。世人解聽不解賞，長飆風中自來往。枯桑老柏寒颼飀，九雛鳴鳳亂啾啾。龍吟虎嘯一時發，萬籟百泉相與秋。忽然更作漁陽摻，黃雲蕭條白日暗。變調如聞楊柳春，上林繁花照眼新。歲夜高堂列明燭，美酒一杯聲一曲。——《聽安萬善吹觱篥歌》李頎",
      "男兒事長征，少小幽燕客。賭勝馬蹄下，由來輕七尺。殺人莫敢前，鬚如蝟毛磔。黃雲隴底白雪飛，未得報恩不能歸。遼東小婦年十五，慣彈琵琶解歌舞。今爲羗笛出塞聲，使我三軍淚如雨。——《古意》李頎",
      "蔡女昔造胡笳聲，一彈一十有八拍。胡人落淚沾邊草，漢使斷腸對歸客。古戍蒼蒼烽火寒，大荒沈沈飛雪白。先拂商弦後角羽，四郊秋葉驚摵摵。董夫子，通神明，深山竊聽來妖精。言遲更速皆應手，將往復旋如有情。空山百鳥散還合，萬里浮雲陰且晴。嘶酸雛鴈失羣夜，斷絕胡兒戀母聲。川爲淨其波，鳥亦罷其鳴。烏孫部落家鄉遠，邏娑沙塵哀怨生。幽音變調忽飄灑，長風吹林雨墮瓦。迸泉颯颯飛木末，野鹿呦呦走堂下。長安城連東掖垣，鳳凰池對青瑣門。高才脫略名與利，日夕望君抱琴至。——《聽董大彈胡笳聲兼寄語弄房給事》李頎",
      "朝聞遊子唱離歌，昨夜微霜初渡河。鴻鴈不堪愁裏聽，雲山況是客中過。關城樹色催寒近，御苑砧聲向晚多。莫見長安行樂處，空令歲月易蹉跎。——《送魏萬之京》李頎",
      "幽意無斷絕，此去隨所偶。晚風吹行舟，花路入溪口。際夜轉西壑，隔山望南斗。潭煙飛溶溶，林月低向後。生事且彌漫，願爲持竿叟。——《春泛若耶溪》綦毋潛",
      "蟬鳴空桑林，八月蕭關道。出塞入塞寒，處處黃蘆草。從來幽幷客，皆共塵沙老。莫學遊俠兒，矜夸紫騮好。——《塞下曲四首 一》王昌齡",
      "飲馬渡秋水，水寒風似刀。平沙日未沒，黯黯見臨洮。昔日長城戰，咸言意氣高。黃塵足今古，白骨亂蓬蒿。——《塞下曲四首 二》王昌齡",
      "高臥南齋時，開帷月初吐。清輝淡水木，演漾在窗戶。苒苒幾盈虛，澄澄變今古。美人清江畔，是夜越吟苦。千里其如何，微風吹蘭杜。——《同從弟銷南齋玩月憶山陰崔少府》王昌齡",
      "秦時明月漢時關，萬里長征人未還。但使龍城飛將在，不教胡馬度陰山。——《出塞二首 一》王昌齡",
      "昨夜風開露井桃，未央前殿月輪高。平陽歌舞新承寵，簾外春寒賜錦袍。——《春宮曲》王昌齡",
      "閨中少婦不曾愁，春日凝妝上翠樓。忽見陌頭楊柳色，悔教夫壻覓封侯。——《閨怨》王昌齡",
      "寒雨連天夜入湖，平明送客楚山孤。洛陽親友如相問，一片冰心在玉壺。——《芙蓉樓送辛漸二首 一》王昌齡",
      "清溪深不測，隱處唯孤雲。松際露微月，清光猶爲君。茅亭宿花影，藥院滋苔紋。余亦謝時去，西山鸞鶴羣。——《宿王昌齡隱居》常建",
      "雲想衣裳花想容，春風拂檻露華濃。若非羣玉山頭見，會向瑤臺月下逢。——《清平調 一》李白",
      "一枝紅豔露凝香，雲雨巫山枉斷腸。借問漢宮誰得似，可憐飛燕倚新妝。——《清平調 二》李白",
      "名花傾國兩相歡，常得君王帶笑看。解得春風無限恨，沈香亭北倚闌干。——《清平調 三》李白",
      "少小離家老大回，鄉音難改鬢毛衰。兒童相見不相識，借問客從何處來。——《還鄉偶書  其二》黄拱",
      "漢皇重色思傾國，御宇多年求不得。楊家有女初長成，養在深閨人未識。天生麗質難自棄，一朝選在君王側。回眸一笑百媚生，六宮粉黛無顏色。春寒賜浴華清池，溫泉水滑洗凝脂。侍兒扶起嬌無力，始是新承恩澤時。雲鬢花顏金步搖，芙蓉帳暖度春宵。春宵苦短日高起，從此君王不早朝。承歡侍宴無閑暇，春從春遊夜專夜。後宮佳麗三千人，三千寵愛在一身。金屋妝成嬌侍夜，玉樓宴罷醉和春。姊妹弟兄皆列土，可憐光彩生門戶。遂令天下父母心，不重生男重生女。驪宮高處入青雲，仙樂風飄處處聞。緩歌慢舞凝絲竹，盡日君王看不足。漁陽鞞鼓動地來，驚破霓裳羽衣曲。九重城闕煙塵生，千乘萬騎西南行。翠華搖搖行復止，西出都門百餘里。六軍不發無奈何，宛轉蛾眉馬前死。花鈿委地無人收，翠翹金雀玉搔頭。君王掩面救不得，回看血淚相和流。黃埃散漫風蕭索，雲棧縈紆登劒閣。峨嵋山下少人行，旌旗無光日色薄。蜀江水碧蜀山青，聖主朝朝暮暮情。行宮見月傷心色，夜雨聞鈴腸斷聲。天旋日轉迴龍馭，到此躊躇不能去。馬嵬坡下泥土中，不見玉顏空死處。君臣相顧盡霑衣，東望都門信馬歸。歸來池苑皆依舊，太液芙蓉未央柳。芙蓉如面柳如眉，對此如何不淚垂？春風桃李花開夜，秋雨梧桐葉落時。西宮南苑多秋草，宮葉滿階紅不埽。棃園弟子白髮新，椒房阿監青娥老。夕殿螢飛思悄然，孤燈挑盡未成眠。遲遲鐘鼓初長夜，耿耿星河欲曙天。鴛鴦瓦冷霜華重，翡翠衾寒誰與共。悠悠生死別經年，魂魄不曾來入夢。臨邛道士鴻都客，能以精誠致魂魄。爲感君王展轉思，遂教方士殷勤覓。排空馭氣奔如電，升天入地求之徧。上窮碧落下黃泉，兩處茫茫皆不見。忽聞海上有仙山，山在虛無縹緲間。樓閣玲瓏五雲起，其中綽約多仙子。中有一人字太真，雪膚花貌參差是。金闕西廂叩玉扃，轉教小玉報雙成。聞道漢家天子使，九華帳裏夢魂驚。攬衣推枕起裴回，珠箔銀屏邐迤開。雲鬢半偏新睡覺，花冠不整下堂來。風吹仙袂飄颻舉，猶似霓裳羽衣舞。玉容寂莫淚闌干，棃花一枝春帶雨。含情凝睇謝君王，一別音容兩渺茫。昭陽殿裏恩愛絕，蓬萊宮中日月長。回頭下望人寰處，不見長安見塵霧。唯將舊物表深情，鈿合金釵寄將去。釵留一股合一扇，釵擘黃金合分鈿。但教心似金鈿堅，天上人間會相見。臨別殷勤重寄詞，詞中有誓兩心知。七月七日長生殿，夜半無人私語時。在天願作比翼鳥，在地願爲連理枝。天長地久有時盡，此恨緜緜無絕期。——《長恨歌》白居易",
      "潯陽江頭夜送客，楓葉荻花秋索索。主人下馬客在船，舉酒欲飲無管弦。醉不成歡慘將別，別時茫茫江浸月。忽聞水上琵琶聲，主人忘歸客不發。尋聲暗問彈者誰，琵琶聲停欲語遲。移船相近邀相見，添酒迴燈重開宴。千呼萬喚始出來，猶抱琵琶半遮面。轉軸撥弦三兩聲，未成曲調先有情。弦弦掩抑聲聲思，似訴平生不得意。低眉信手續續彈，說盡心中無限事。輕攏慢撚抹復挑，初爲霓裳後六幺。大弦嘈嘈如急雨，小弦切切如私語。嘈嘈切切錯雜彈，大珠小珠落玉盤。間關鶯語花底滑，幽咽泉流水下灘。水泉冷澀弦疑絕，疑絕不通聲暫歇。別有幽愁暗恨生，此時無聲勝有聲。銀缾乍破水漿迸，鐵騎突出刀槍鳴。曲終收撥當心畫，四弦一聲如裂帛。東舟西舫悄無言，唯見江心秋月白。沈吟放撥插弦中，整頓衣裳起斂容。自言本是京城女，家在蝦蟇陵下住。十三學得琵琶成，名蜀教坊第一部。曲罷曾教善才伏，妝成每被秋娘妬。五陵年少爭纏頭，一曲紅綃不知數。鈿頭雲箆擊節碎，血色羅帬飜酒汙。今年歡笑復明年，秋月春風等閑度。弟走從軍阿姨死，暮去朝來顏色故。門前冷落鞍馬稀，老大嫁作商人婦。商人重利輕別離，前月浮梁買茶去。去來江口守空船，繞船月明江水寒。夜深忽夢少年事，夢啼妝淚紅闌干。我聞琵琶已歎息，又聞此語重唧唧。同是天涯淪落人，相逢何必曾相識。我從去年辭帝京，謫居臥病潯陽城。潯陽小處無音樂，終歲不聞絲竹聲。住近湓江地低濕，黃蘆苦竹繞宅生。其間旦暮聞何物，杜鵑啼血猨哀鳴。春江花朝秋月夜，往往取酒還獨傾。豈無山歌與村笛，嘔啞嘲哳難爲聽。今夜聞君琵琶語，如聽仙樂耳暫明。莫辭更坐彈一曲，爲君飜作琵琶行。感我此言良久立，却坐促弦弦轉急。淒淒不似向前聲，滿座重聞皆掩泣。座中泣下誰最多，江州司馬青衫濕。——《琵琶引》白居易",
      "離離原上草，一歲一枯榮。野火燒不盡，春風吹又生。遠芳侵古道，晴翠接荒城。又送王孫去，萋萋滿別情。——《賦得古原草送別》白居易",
      "時難年饑世業空，弟兄羇旅各西東。田園寥落干戈後，骨肉流離道路中。弔影分爲千里鴈，辭根散作九秋蓬。共看明月應垂淚，一夜鄉心五處同。——《自河南經亂關內阻饑兄弟離散各在一處因望月有感聊書所懷寄上浮梁大兄於潛七兄烏江十五兄兼示符離及下邽弟妹》白居易",
      "綠螘新醅酒，紅泥小火壚。晚來天欲雪，能飲一杯無。——《問劉十九》白居易",
      "松下問童子，言師採藥去。只在此山中，雲深不知處。——《尋隱者不遇》賈島",
      "澹然空水對斜暉，曲島蒼茫接翠微。波上馬嘶看櫂去，柳邊人歇待船歸。數叢沙草羣鷗散，萬頃江田一鷺飛。誰解乘舟尋范蠡，五湖煙水獨忘機。——《利州南渡》溫庭筠",
      "冰簟銀牀夢不成，碧天如水夜雲輕。雁聲遠過瀟湘去，十二樓中月自明。——《瑤瑟怨》溫庭筠",
      "荒戍落黃葉，浩然離故關。高風漢陽渡，初日郢門山。江上幾人在，天涯孤櫂還。何當重相見，尊酒慰離顏。——《送人東遊》溫庭筠",
      "蘇武魂銷漢使前，古祠高樹兩茫然。雲邊雁斷胡天月，隴上羊歸塞草煙。廻日樓臺非甲帳，去時冠劒是丁年。茂陵不見封侯印，空向秋波哭逝川。——《蘇武廟》溫庭筠",
      "嶺外音書絕，經年復歷春。近鄉情更怯，不敢問來人。——《渡漢江》李頻",
      "蓬門未識綺羅香，擬託良媒益自傷。誰愛風流高格調，共憐時世儉梳妝。敢將十指誇偏巧，不把雙眉鬬畫長。苦恨年年壓金線，爲他人作嫁衣裳。——《貧女》秦韜玉",
      "早被嬋娟誤，欲妝臨鏡慵。承恩不在貌，教妾若爲容。風暖鳥聲碎，日高花影重。年年越溪女，相憶采芙蓉。——《春宮怨》周朴",
      "幾行歸去盡，片影獨何之。暮雨相呼失，寒塘獨下遲。渚雲低暗度，關月冷遙隨。未必逢矰繳，孤飛自可疑。——《孤鴈 二》崔塗",
      "迢遰三巴路，羇危萬里身。亂山殘雪夜，孤燭異鄉春。漸與骨肉遠，轉於僮僕親。那堪正漂泊，明日歲華新。——《巴山道中除夜書懷》崔塗",
      "故國三千里，深宮二十年。一聲河滿子，雙淚落君前。——《宮詞二首 一》張祜",
      "禁門宮樹月痕過，媚眼唯看宿燕窠。斜拔玉釵燈影畔，剔開紅焰救飛蛾。——《贈內人》張祜",
      "日光斜照集靈臺，紅樹花迎曉露開。昨夜上皇新授籙，太真含笑入簾來。——《集靈臺二首 一》張祜",
      "虢國夫人承主恩，平明騎馬入宮門。却嫌脂粉汚顏色，淡掃蛾眉朝至尊。——《集靈臺二首 二》張祜",
      "金陵津渡小山樓，一宿行人自可愁。潮落夜江斜月裏，兩三星火是瓜州。——《題金陵渡》張祜",
      "寂寂花時閉院門，美人相並立瓊軒。含情欲說宮中事，鸚鵡前頭不敢言。——《宮詞》朱慶餘",
      "張生手持石鼓文，勸我試作石鼓歌。少陵無人謫仙死，才薄將奈石鼓何。周綱陵遲四海沸，宣王憤起揮天戈。大開明堂受朝賀，諸侯劒佩鳴相磨。蒐于岐陽騁雄俊，萬里禽獸皆遮羅。鐫功勒成告萬世，鑿石作鼓隳嵯峨。從臣才藝咸第一，揀選撰刻留山阿。雨淋日炙野火燎，鬼物守護煩撝呵。公從何處得紙本，毫髮盡備無差訛。辭嚴義密讀難曉，字體不類隸與科。年深豈免有缺畫，快劒斫斷生蛟鼉。鸞翔鳳翥衆僊下，珊瑚碧樹交枝柯。金繩鐵索鎖紐壯，古鼎躍水龍騰梭。陋儒編詩不收入，二雅褊迫無委蛇。孔子西行不到秦，掎摭星宿遺羲娥。嗟予好古生苦晚，對此涕淚雙滂沱。憶昔初蒙博士徴，其年始改稱元和。故人從軍在右輔，爲我度量掘臼科。濯冠沐浴告祭酒，如此至寶存豈多。氊包席裹可立致，十鼓祗載數駱駝。薦諸太廟比郜鼎，光價豈止百倍過。聖恩若許留太學，諸生講解得切磋。觀經鴻都尚填咽，坐見舉國來奔波。剜苔剔蘚露節角，安置妥帖平不頗。大廈深簷與蓋覆，經歷久遠期無佗。中朝大官老於事，詎肯感激徒媕婀。牧童敲火牛礪角，誰復著手爲摩挲。日銷月鑠就埋沒，六年西顧空吟哦。羲之俗書趁姿媚，數紙尚可博白鵝。繼周八代爭戰罷，無人收拾理則那。方今太平日無事，柄任儒術崇丘軻。安能以此上論列，願借辨口如懸河。石鼓之歌止於此，嗚呼吾意其蹉跎。——《石鼓歌》韓愈",
      "桂魄初生秋露微，輕羅已薄未更衣。銀箏夜久殷勤弄，心怯空房不忍歸。——《秋夜曲》王涯",
      "汲井漱寒齒，清心拂塵服。閒持貝葉書，步出東齋讀。真源了無取，妄跡世所逐。遺言冀可冥，繕性何由熟。道人庭宇靜，苔色連深竹。日出霧露餘，青松如膏沐。澹然離言說，悟悅心自足。——《晨詣超師院讀禪經》柳宗元",
      "城上高樓接大荒，海天愁思正茫茫。驚風亂颭芙蓉水，密雨斜侵薜荔牆。嶺樹重遮千里目，江流曲似九廻腸。共來百越文身地，猶自音書滯一鄉。——《登柳州城樓寄漳汀封連四州》柳宗元",
      "久爲簪組累，幸此南夷謫。閑依農圃鄰，偶似山林客。曉耕翻露草，夜榜響溪石。來往不逢人，長歌楚天碧。——《溪居》柳宗元",
      "千山鳥飛絕，萬逕人蹤滅。孤舟蓑笠翁，獨釣寒江雪。——《江雪》柳宗元",
      "漁翁夜傍西巖宿，曉汲清湘燃楚竹。煙銷日出不見人，[欸]乃一聲山水綠。迴看天際下中流，巖上無心雲相逐。——《漁翁》柳宗元",
      "天地英雄氣，千秋尚凜然。勢分三足鼎，業復五銖錢。得相能開國，生兒不象賢。淒涼蜀故妓，來舞魏宮前。——《蜀先主廟》劉禹錫",
      "今夜鄜州月，閨中只獨看。遙憐小兒女，未解憶長安。香霧雲鬟濕，清輝玉臂寒。何時倚虛幌，雙照淚痕乾。——《月夜》杜甫",
      "國破山河在，城春草木深。感時花濺淚，恨別鳥驚心。烽火連三月，家書抵萬金。白頭搔更短，渾欲不勝簪。——《春望》杜甫",
      "花隱掖垣暮，啾啾棲鳥過。星臨萬戶動，月傍九霄多。不寢聽金鑰，因風想玉珂。明朝有封事，數問夜如何。——《春宿左省》杜甫",
      "此道昔歸順，西郊胡正繁。至今殘破膽，應有未招魂。近得歸京邑，移官豈至尊。無才日衰老，駐馬望千門。——《至德二載甫自京金光門出問道歸鳳翔乾元初從左拾遺移華州掾與親故別因出此門有悲往事》杜甫",
      "戍鼓斷人行，秋邊一雁聲。露從今夜白，月是故鄉明。有弟皆分散，無家問死生。寄書長不避，況乃未休兵。——《月夜憶舍弟》杜甫",
      "涼風起天末，君子意如何。鴻雁幾時到，江湖秋水多。文章憎命達，魑魅喜人過。應共冤魂語，投詩贈汩羅。——《天末憶李白》杜甫",
      "丞相祠堂何處尋，錦官城外柏森森。映堦碧草自春色，隔葉黃鸝空好音。三顧頻煩天下計，兩朝開濟老臣心。出師未捷身先死，長使英雄淚滿襟。——《蜀相》杜甫",
      "舍南舍北皆春水，但見羣鷗日日來。花徑不曾緣客掃，蓬門今始爲君開。盤餐市遠無兼味，樽酒家貧只舊醅。肯與鄰翁相對飲，隔籬呼取盡餘桮。——《客至》杜甫",
      "西山白雪三奇戍，南浦清江萬里橋。海內風塵諸弟隔，天涯涕淚一身遙。唯將遲暮供多病，未有涓埃荅聖朝。跨馬出郊時極目，不堪人事日蕭條。——《野望》杜甫",
      "遠送從此別，青山空復情。幾時桮重把，昨夜月同行。列郡謳歌惜，三朝出入榮。江村獨歸處，寂寞養殘生。——《奉濟驛重送嚴公四韻》杜甫",
      "劒外忽傳收薊北，初聞涕淚滿衣裳。却看妻子愁何在，漫卷詩書喜欲狂。白日放歌須縱酒，青春作伴好還鄉。即從巴峽穿巫峽，便下襄陽向洛陽。——《聞官軍收河南河北》杜甫",
      "風急天高猨嘯哀，渚清沙白鳥飛迴。無邊落木蕭蕭下，不盡長江衮衮來。萬里悲秋常作客，百年多病獨登臺。艱難苦恨繁霜鬢，潦倒新停濁酒桮。——《登高》杜甫",
      "他鄉復行役，駐馬別孤墳。近淚無乾土，低空有斷雲。對碁陪謝傅，把劒覓徐君。唯見林花落，鸎啼送客聞。——《別房太尉墓》杜甫",
      "花近高樓傷客心，萬方多難此登臨。錦江春色來天地，玉壘浮雲變古今。北極朝廷終不改，西山寇盜莫相侵。可憐後主還祠廟，日暮聊爲梁甫吟。——《登樓》杜甫",
      "清秋幕府井梧寒，獨宿江城蠟炬殘。永夜角聲悲自語，中天月色好誰看。風塵荏苒音書絕，關塞蕭條行路難。已忍伶俜十年事，強移栖息一枝安。——《宿府》杜甫",
      "細草微風岸，危檣獨夜舟。星垂平野闊，月湧大江流。名豈文章著，官因老病休。飄飄何所似，天地一沙鷗。——《旅夜書懷》杜甫",
      "歲暮陰陽催短景，天涯霜雪霽寒宵。五更鼓角聲悲壯，三峽星河影動搖。野哭幾家聞戰伐，夷歌數處起漁樵。臥龍躍馬終黃土，人事依依漫寂寥。——《閣夜》杜甫",
      "功蓋三分國，名高八陣圖。江流石不轉，遺恨失吞吳。——《八陣圖》杜甫",
      "支離東北風塵際，漂泊西南天地間。三峽樓臺淹日月，五溪衣服共雲山。羯胡事主終無賴，詞客衰時且未還。庾信平生最蕭瑟，暮年詩賦動江關。——《詠懷古跡五首 一》杜甫",
      "搖落深知宋玉悲，風流儒雅亦吾師。悵望千秋一灑淚，蕭條異代不同時。江山故宅空文藻，雲雨荒臺豈夢思。最是楚宮俱泯滅，舟人指點到今疑。——《詠懷古跡五首 二》杜甫",
      "羣山萬壑赴荆門，生長明妃尚有村。一去紫臺連朔漠，獨留青塚向黃昏。畫圖省識春風面，環佩空歸月夜魂。千載琵琶作胡語，分明怨恨曲中論。——《詠懷古跡五首 三》杜甫",
      "蜀主窺吳幸三峽，崩年亦在永安宮。翠華想像空山裏，玉殿虛無野寺中。古廟杉松巢水鶴，歲時伏臘走村翁。武侯祠屋常鄰近，一體君臣祭祀同。——《詠懷古跡五首 四》杜甫",
      "諸葛大名垂宇宙，宗臣遺像肅清高。三分割據紆籌策，萬古雲霄一羽毛。伯仲之間見伊呂，指揮若定失蕭曹。福移漢祚難恢復，志決身殲軍務勞。——《詠懷古跡五首 五》杜甫",
      "歧王宅裏尋常見，崔九堂前幾度聞。正是江南好風景，落花時節又逢君。——《江南逢李龜年》杜甫",
      "昔聞洞庭水，今上岳陽樓。吳楚東南坼，乾坤日夜浮。親朋無一字，老病有孤舟。戎馬關山北，憑軒涕泗流。——《登岳陽樓》杜甫",
      "虢國夫人承主恩，平明上馬入宮門。却嫌脂粉涴顏色，澹埽蛾眉朝至尊。——《虢國夫人》杜甫",
      "海上生明月，天涯共此時。情人怨遙夜，竟夕起相思。滅燭憐光滿，披衣覺露滋。不堪盈手贈，還寢夢佳期。——《望月懷遠》張九齡",
      "陽月南飛雁，傳聞至此回。我行殊未已，何日復歸來？江靜潮初落，林昏瘴不開。明朝望鄉處，應見隴頭梅。——《題大庾嶺北驛》宋之問",
      "嶺外音書斷，經冬復歷春。近鄉情更怯，不敢問來人。——《渡漢江》宋之問",
      "鄉心新歲切，天畔獨澘然。老至居人下，春歸在客先。嶺猨同旦暮，江柳共風煙。已似長沙傅，從今又幾年。——《新年作》宋之問",
      "城闕輔三秦，風煙望五津。與君離別意，同是宦遊人。海內存知己，天涯若比隣。無爲在岐路，兒女共霑巾。——《杜少府之任蜀州》王勃",
      "獨有宦遊人，偏驚物候新。雲霞出海曙，梅柳渡江春。淑氣催黃鳥，晴光轉綠蘋。忽聞歌古調，歸思欲霑巾。——《和晉陵陸丞早春遊望》杜審言",
      "白日依山盡，黃河入海流。欲窮千里目，更上一層樓。——《登樓》朱斌",
      "嗟君此別意何如，駐馬銜桮問謫居。巫峽啼猿數行淚，衡陽歸雁幾封書。青楓江上秋天遠，白帝城邊古木疎。聖代即今多雨露，暫時分手莫躊躇。——《送李少府貶峽中王少府貶長沙》高適",
      "岱宗夫如何，齊魯青未了。造化鍾神秀，陰陽割昏曉。盪胷生曾雲，決眥入歸鳥。會當凌絕頂，一覽衆山小。——《望嶽》杜甫",
      "車轔轔，馬蕭蕭，行人弓箭各在腰。耶孃妻子走相送，塵埃不見咸陽橋。牽衣頓足闌道哭，哭聲直上干雲霄。道傍過者問行人，行人但云點行頻。或從十五北防河，便至四十西營田。去時里正與裹頭，歸來頭白還戍邊。邊亭流血成海水，武皇開邊意未已。君不聞漢家山東二百州，千村萬落生荆杞。縱有健婦把鋤犂，禾生隴畝無東西。況復秦兵耐苦戰，被驅不異犬與雞。長者雖有問，役夫敢申恨。且如今年冬，未休關西卒。縣官急索租，租稅從何出？信知生男惡，反是生女好。生女猶是嫁比鄰，生男埋沒隨百草。君不見青海頭，古來白骨無人收。新鬼煩冤舊鬼哭，天陰雨濕聲啾啾。——《兵車行》杜甫",
      "人生不相見，動如參與商。今夕復何夕，共此燈燭光。少壯能幾時，鬢髮各已蒼。訪舊半爲鬼，驚呼熱中腸。焉知二十載，重上君子堂。昔別君未婚，兒女忽成行。怡然敬父執，問我來何方。問荅乃未已，兒女羅酒漿。夜雨剪春韭，新炊間黃粱。主稱會面難，一舉累十觴。十觴亦不醉，感子故意長。明日隔山岳，世事兩茫茫。——《贈衛八處士》杜甫",
      "三月三日天氣新，長安水邊多麗人。態濃意遠淑且真，肌理細膩骨肉勻。繡羅衣裳照暮春，蹙金孔雀銀麒麟。頭上何所有，翠微㔩葉垂鬢脣。背後何所見，珠壓腰衱穩稱身。就中雲幕椒房親，賜名大國虢與秦。紫駝之峰出翠釜，水精之盤行素鱗。犀箸厭飫久未下，鑾刀縷切空紛綸。黃門飛鞚不動塵，御廚絡繹送八珍。簫鼓哀吟感鬼神，賓從雜遝實要津。後來鞍馬何逡巡，當軒下馬入錦茵。楊花雪落覆白蘋，青鳥飛去銜紅巾。炙手可熱勢絕倫，慎莫近前丞相嗔。——《麗人行》杜甫",
      "少陵野老吞聲哭，春日潛行曲江曲。江頭宮殿鎖千門，細柳新蒲爲誰綠。憶昔霓旌下南苑，苑中萬物生顏色。昭陽殿裏第一人，同輦隨君侍君側。輦前才人帶弓箭，白馬嚼齧黃金勒。翻身向天仰射雲，一箭正墜雙飛翼。明眸皓齒今何在，血污遊魂歸不得。清渭東流劒閣深，去住彼此無消息。人生有情淚霑臆，江水江花豈終極。黃昏胡騎塵滿城，欲往城南忘南北。——《哀江頭》杜甫",
      "長安城頭頭白烏，夜飛延秋門上呼。又向人家啄大屋，屋底達官走避胡。金鞭斷折九馬死，骨肉不待同馳驅。腰下實玦青珊瑚，可憐王孫泣路隅。問之不肯道姓名，但道困苦乞爲奴。已經百日竄荆棘，身上無有完肌膚。高帝子孫盡隆準，龍種自與常人殊。豺狼在邑龍在野，王孫善保千金軀。不敢長語臨交衢，且爲王孫立斯須。昨夜東風吹血腥，東來橐駝滿舊都。朔方健兒好身手，昔何勇銳今何愚。竊聞天子已傳位，賢德北服南單于。花門剺面請雪恥，慎勿出口他人狙。哀哉王孫慎勿疎，五陵佳氣無時無。——《哀王孫》杜甫",
      "絕代有佳人，幽居在空谷。自云良家子，零落依草木。關中昔喪敗，兄弟遭殺戮。官高何足論，不得收骨肉。世情惡衰歇，萬事隨轉燭。夫壻輕薄兒，新人已如玉。合昏尚知時，鴛鴦不獨宿。但見新人笑，那聞舊人哭。在山泉水清，出山泉水濁。侍婢賣珠回，牽蘿補茅屋。摘花不插髮，采柏動盈匊。天寒翠袖薄，日暮倚修竹。——《佳人》杜甫",
      "死別已吞聲，生別常惻惻。江南瘴癘地，逐客無消息。故人入我夢，明我長相憶。恐非平生魂，路遠不可測。魂來楓葉青，魂返關塞黑。君今在羅網，何以有羽翼。落月滿屋梁，猶疑照顏色。水深波浪闊，無使蛟龍得。——《夢李白二首 一》杜甫",
      "浮雲終日行，遊子久不至。三夜頻夢君，情親見君意。告歸常局促，苦道來不易。江湖多風波，舟楫恐失墜。出門搔白首，若負平生志。冠蓋滿京華，斯人獨顦顇。孰云網恢恢，將老身反累。千秋萬歲名，寂莫身後事。——《夢李白二首 二》杜甫",
      "國初已來畫鞍馬，神妙獨數江都王。將軍得名三十載，人間又見真乘黃。曾貌先帝照夜白，龍池十日飛霹靂。內府殷紅馬腦盌，倢伃傳詔才人索。盌賜將軍拜舞歸，輕紈細綺相追飛。貴戚權門得筆跡，始覺屏障生光輝。昔日太宗拳毛騧，近時郭家師子花。今之新圖有二馬，復令識者久歎嗟。此皆騎戰一敵萬，縞素漠漠開風沙。其餘七匹亦殊絕，迥若寒空動煙雪。霜蹄蹴踏長楸間，馬官廝養森成列。可憐九馬爭神駿，顧視清高氣深穩。借問苦心愛者誰，後有韋諷前支遁。憶昔巡幸新豐宮，翠華拂天來向東。騰驤磊落三萬匹，皆與此圖筋骨同。自從獻寶朝河宗，無復射蛟江水中。君不見金粟堆前松柏裏，龍媒去盡鳥呼風。——《韋諷錄事宅觀曹將軍畫馬圖》杜甫",
      "將軍魏武之子孫，於今爲庶爲清門。英雄割據雖已矣，文彩風流猶尚存。學書初學衛夫人，但恨無過王右軍。丹青不知老將至，富貴於我如浮雲。開元之中常引見，承恩數上南熏殿。凌煙功臣少顏色，將軍下筆開生面。良相頭上進賢冠，猛將腰間大羽箭。褒公鄂公毛髮動英姿颯爽來酣戰。先帝天馬玉花驄，畫工如山貌不同。是日牽來赤墀下，迥立閶闔生長風。詔謂將軍拂絹素，意匠慘澹經營中。斯須九重真龍出，一洗萬古凡馬空。玉花却在御榻上，榻上庭前屹相向。至尊含笑催賜金，圉人太僕皆惆悵。弟子韓幹早入室，亦能畫馬窮殊相。幹惟畫肉不畫骨，忍使驊騮氣凋喪。將軍畫善蓋有神，必逢佳士亦寫真。即今飄泊干戈際，屢貌尋常行路人。途窮反遭俗眼白，世上未有如公貧。但看古來盛名下，終日坎壈纏其身。——《丹青引贈曹將軍霸》杜甫",
      "今我不樂思岳陽，身欲奮飛病在牀。美人娟娟隔秋水，濯足洞庭望八荒。鴻飛冥冥日月白，青楓葉赤天雨霜。玉京羣帝集北斗，或騎騏驎翳鳳皇。芙蓉旌旗煙霧樂，影動倒景搖瀟湘。星宮之君醉瓊漿，羽人稀少不在旁。似聞昨者赤松子，恐是漢代韓張良。昔隨劉氏定長安，帷幄未改神慘傷。國家成敗吾豈敢，色難腥腐餐風香。周南留滯古所惜，南極老人應壽昌。美人胡爲隔秋水，焉得置之貢玉堂。——《寄韓諫議》杜甫",
      "孔明廟前有老柏，柯如青銅根如石。霜皮溜雨四十圍，黛色參天二千尺。君臣已與時際會，樹木猶爲人愛惜。雲來氣接巫峽長，月出寒通雪山白。憶昨路繞錦亭東，先主武侯同閟宮。崔嵬枝幹郊原古，窈窕丹青戶牖空。落落盤踞雖得地，冥冥孤高多烈風。扶持自是神明力，正直原因造化功。大廈如傾要梁棟，萬牛回首丘山重。不露文章世已驚，未辭剪伐誰能送。苦心豈免容螻蟻，香葉終經宿鸞鳳。志士幽人莫怨嗟，古來材大難爲用。——《古柏行》杜甫",
      "昔有佳人公孫氏，一舞劒氣動四方。觀者如山色沮喪，天地爲之久低昂。㸌如羿射九日落，矯如羣帝驂龍翔。來如雷霆收震怒，罷如江海凝清光。絳脣珠袖兩寂莫，況有弟子傳芬芳。臨潁美人在白帝，妙舞此曲神揚揚。與余問答既有以，感時撫事增惋傷。先帝侍女八千人，公孫劒器初第一。五十年間似反掌，風塵傾動昏王室。棃園子弟散如煙，女樂餘姿映寒日。金粟堆南木已拱，瞿唐石城草蕭瑟。玳筵急管曲復終，樂極哀來月東出。老夫不知其所往，足繭荒山轉愁疾。——《觀公孫大娘弟子舞劒器行》杜甫",
      "別夢依依到謝家，小廊迴合曲闌斜。多情只有春庭月，猶爲離人照落花。——《寄人二首  其一》張佖",
      "秦時明月漢時關，萬里征人尚未還。但願龍庭神將在，不教胡馬渡陰山。——《雜曲歌辭 蓋羅縫 一》不詳",
      "迴樂峰前沙似雪，受降城外月如霜。不知何處吹蘆管？一夜征人盡望鄉。——《雜曲歌辭 婆羅門》楊敬述進",
      "雲想衣裳花想容，春風拂檻露華濃。若非羣玉山頭見，會向瑤臺月下逢。——《雜曲歌辭 清平調 一》李白",
      "一枝紅豔露凝香，雲雨巫山枉斷腸。借問漢宮誰得似，可憐飛燕倚新妝。——《雜曲歌辭 清平調 二》李白",
      "名花傾國兩相歡，長得君王帶笑看。解釋春風無限恨，沈香亭北倚闌干。——《雜曲歌辭 清平調 三》李白",
      "謂城朝雨浥輕塵，客舍青青柳色春。勸君更盡一杯酒，西出陽關無故人。——《雜曲歌辭 渭城曲》王維",
      "勸君莫惜金縷衣，勸君惜取少年時。花開堪折直須折，莫待無花空折枝。——《雜曲歌辭 金縷衣》不詳",
      "蘭葉春葳蕤，桂華秋皎潔。欣欣此生意，自爾爲佳節。誰知林棲者，聞風坐相悅。草木有本心，何求美人折。——《感遇十二首 一》張九齡",
      "幽林歸獨臥，滯慮洗孤清。持此謝高鳥，因之傳遠情。日夕懷空意，人誰感至精。飛沈理自隔，何所慰吾誠。——《感遇十二首 二》張九齡",
      "孤鴻海上來，池潢不敢顧。側見雙翠鳥，巢在三珠樹。矯矯珍木巔，得無金丸懼。美服患人指，高明逼神惡。今我遊冥冥，弋者何所慕。——《感遇十二首 四》張九齡",
      "江南有丹橘，經冬猶綠林。豈伊地氣暖，自有歲寒心。可以薦嘉客，奈何阻重深。運命唯所遇，循環不可尋。徒言樹桃李，此木豈無陰。——《感遇十二首 七》張九齡",
      "移家雖帶郭，野徑入桑麻。近種籬邊菊，秋來未著花。扣門無犬吠，欲去問西家。報道山中去，歸時每日斜。——《尋陸鴻漸不遇》皎然",
      "西晉樓船下益州，金陵王氣黯然收。千尋鐵鎖沈江底，一片降旛出石頭。人世幾回傷往事，山形依舊枕江流。今逢四海爲家日，故壘蕭蕭蘆荻秋。——《西塞山懷古》劉禹錫",
      "朱雀橋邊野草花，烏衣巷口夕陽斜。舊時王謝堂前燕，飛入尋常百姓家。——《金陵五題 烏衣巷》劉禹錫",
      "新妝面面下朱樓，深鎖春光一院愁。行到中庭數花朵，蜻蜓飛上玉搔頭。——《和樂天春詞》劉禹錫",
      "梧桐相待老，鴛鴦會雙死。貞女貴狥夫，捨生亦如此。波瀾誓不起，妾心井中水。——《列女操》孟郊",
      "慈母手中線，遊子身上衣。臨行密密縫，意恐遲遲歸。誰言寸草心，報得三春暉。——《遊子吟》孟郊",
      "隠隠飛橋隔野煙，石磯西畔問漁船。桃花盡日隨流水，洞在清溪何處邊。——《度南澗》蔡襄",
      "泉壑帶茅茨，雲霞生薜帷。竹憐新雨後，山愛夕陽時。閑鷺棲常早，秋花落更遲。家童掃蘿逕，昨與故人期。——《谷口書齋寄楊補闕》錢起",
      "上國隨緣住，來途若夢行。浮天滄海遠，去世法舟輕。水月通禪觀，魚龍聽梵聲。惟憐一燈影，萬里眼中明。——《送僧歸日本》錢起",
      "二月黃鶯飛上林，春城紫禁曉陰陰。長樂鐘聲花外盡，龍池柳色雨中深。陽和不散窮途恨，霄漢長懷捧日新。獻賦十年猶未遇，羞將白髮對華簪。——《贈闕下裴舍人》錢起",
      "月黑雁飛高，單于夜遁逃。欲將輕騎逐，大雪滿弓刀。——《和張僕射塞下曲》錢起",
      "昔歲逢太平，山林二十年。泉源在庭戶，洞壑當門前。井稅有常期，日[晏]猶得眠。忽然遭世變，數歲親戎旃。今來典斯郡，山夷又紛然。城小賊不屠，人貧傷可憐。是以陷隣境，此州獨見全。使臣將王命，豈不如賊焉。今彼徴斂者，迫之如火煎。誰能絕人命，以作時世賢。思欲委符節，引竿自刺船。將家就魚麥，歸老江湖邊。——《賊退示官吏》元結",
      "石魚湖，似洞庭，夏水欲滿君山青。山爲樽，水爲沼，酒徒歷歷坐洲島。長風連日作大浪，不能廢人運酒舫。我持長瓢坐巴丘，酌飲四坐以散愁。——《石魚湖上醉歌》元結",
      "月落烏啼霜滿天，江楓漁父對愁眠。姑蘇城外寒山寺，夜半鐘聲到客船。——《楓橋夜泊》張繼",
      "長簟迎風早，空城澹月華。星河秋一雁，砧杵夜千家。節候看應晚，心期臥亦賒。向來吟秀句，不覺已鳴鴉。——《酬程延秋夜即事見贈》韓翃",
      "仙臺下見五城樓，風物淒淒宿雨收。山色遙連秦樹晚，砧聲近報漢宮秋。疎松影落空壇靜，細草香閑小洞幽。何用別尋方外去，人間亦自有丹丘。——《同題仙游觀》韓翃",
      "春城無處不飛花，寒食東風御柳斜。日暮漢宮傳蠟燭，輕煙散入五侯家。——《寒食》韓翃",
      "去年花裏逢君別，今日花開已一年。世事茫茫難自料，春愁黯黯獨成眠。身多疾病思田里，邑有流亡愧俸錢。聞道欲來相問訊，西樓望月幾廻圓。——《寄李儋元錫》韋應物",
      "今朝郡齋冷，忽念山中客。澗底束荆薪，歸來煮白石。欲持一瓢酒，遠慰風雨夕。落葉滿空山，何處尋行跡。——《寄全椒山中道士》韋應物",
      "懷君屬秋夜，散步詠涼天。山空松子落，幽人應未眠。——《秋夜寄丘二十二員外》韋應物",
      "楚江微雨裏，建業暮鐘時。漠漠帆來重，冥冥鳥去遲。海門深不見，浦樹遠含滋。相送情無限，沾襟比散絲。——《賦得暮雨送李胄》韋應物",
      "永日方慼慼，出門復悠悠。女子今有行，大江泝輕舟。爾輩況無恃，撫念益慈柔。幼爲長所育，兩別泣不休。對此結中腸，義往難復留。自小闕內訓，事姑貽我憂。賴茲託令門，仁恤庶無尤。貧儉誠所尚，資從豈待周。孝恭遵婦道，容止順其猷。別離在今晨，見爾當何秋。居閑始自遣，臨感忽難收。歸來視幼女，零淚緣纓流。——《送楊氏女》韋應物",
      "客從東方來，衣上灞陵雨。問客何爲來，采山因買斧。冥冥花正開，颺颺燕新乳。昨別今已春，鬢絲生幾縷。——《長安遇馮著》韋應物",
      "落帆逗淮鎮，停舫臨孤驛。浩浩風起波，冥冥日沈夕。人歸山郭暗，雁下蘆洲白。獨夜憶秦關，聽鐘未眠客。——《夕次盱眙縣》韋應物",
      "吏舍跼終年，出郊曠清曙。楊柳散和風，青山澹吾慮。依叢適自憩，緣澗還復去。微雨靄芳原，春鳩鳴何處？樂幽心屢止，遵事跡猶遽。終罷斯結廬，慕陶真可庶。——《東郊》韋應物",
      "獨憐幽草澗邊生，上有黃鸝深樹鳴。春潮帶雨晚來急，野渡無人舟自橫。——《滁州西澗》韋應物",
      "獨有宦遊人，偏驚物候新。雲霞出海曙，梅柳渡江春。淑氣催黃鳥，晴光照綠蘋。忽聞歌苦調，歸思欲霑巾。——《和晉陵陸丞早春遊望》韋應物",
      "塔勢如湧出，孤高聳天宮。登臨出世界，磴道盤虛空。突兀壓神州，崢嶸如鬼工。四角礙白日，七層摩蒼穹。下窺指高鳥，俯聽聞驚風。連山若波濤，奔湊似朝東。青槐夾馳道，宮館何玲瓏。秋色從西來，蒼然滿關中。五陵北原上，萬古青濛濛。淨理了可悟，勝因夙所宗。誓將挂冠去，覺道資無窮。——《與高適薛據慈恩寺浮圖》岑參",
      "北風捲地白草折，胡天八月即飛雪。忽然一夜春風來，千樹萬樹梨花開。散入珠簾濕羅幕，狐裘不煖錦衾薄。將軍角弓不得控，都護鐵衣冷難着。瀚海闌干百丈冰，愁雲黲淡萬里凝。中軍置酒飲歸客，胡琴琵琶與羌笛。紛紛暮雪下轅門，風掣紅旗凍不翻。輪臺東門送君去，去時雪滿天山路。山迴路轉不見君，雪上空留馬行處。——《白雪歌送武判官歸京》岑參",
      "輪臺城頭夜吹角，輪臺城北旄頭落。羽書昨夜過渠黎，單于已在金山西。戍樓西望煙塵黑，漢兵屯在輪臺北。上將擁旄西出征，平明吹笛大軍行。四邊伐鼓雪海湧，三軍大呼陰山動。虜塞兵氣連雲屯，戰場白骨纏草根。劒河風急雪片闊，沙口石凍馬蹄脫。亞相勤王甘苦辛，誓將報主靜邊塵。古來青史誰不見，今見功名勝古人。——《輪臺歌奉送封大夫出師西征》岑參",
      "君不見走馬川行雪海邊，平沙莽莽黃入天。輪臺九月風夜吼，一川碎石大如斗，隨風滿地石亂走。匈奴草黃馬正肥，金山西見煙塵飛。漢家大將西出師，將軍金甲夜不脫。半夜軍行戈相撥，風頭如刀面如割。馬毛帶雪汗氣蒸，五花連錢旋作冰。幕中草檄硯水凝，虜騎聞之應膽懾。料知短兵不敢接，車師西門佇獻捷。——《走馬川行奉送出師西征》岑參",
      "聯步趨丹陛，分曹限紫微。曉隨天仗入，暮惹御香歸。白髮悲花落，青雲羨鳥飛。聖朝無闕事，自覺諫書稀。——《寄左省杜拾遺》岑參",
      "雞鳴紫陌曙光寒，鶯囀皇州春色闌。金闕曉鐘開萬戶，玉階仙仗擁千官。花迎劒珮星初落，柳拂旌旗露未乾。獨有鳳皇池上客，陽春一曲和皆難。——《奉和中書舍人賈至早朝大明宮》岑參",
      "故園東望路漫漫，雙袖龍鍾淚不乾。馬上相逢無紙筆，憑君傳語報平安。——《逢入京使》岑參",
      "松下問童子，言師採藥去。只在此山中，雲深不知處。——《訪羊尊師》孫革",
      "調角斷清秋，征人倚戍樓。春風對青塚，白日落梁州。大漢無兵阻，窮邊有客遊。蕃情似此水，長願向南流。——《書邊事》張喬",
      "金樽清酒斗十千，玉盤珍羞直萬錢。停杯投筯不能食，拔劒四顧心茫然。欲渡黃河冰塞川，將登太行雪滿山。閑來垂釣碧溪上，忽復乘舟夢日邊。行路難，行路難，多岐路，今安在。長風破浪會有時，直挂雲帆濟滄海。——《行路難三首 一》李白",
      "大道如青天，我獨不得出。羞逐長安社中兒，赤雞白狗賭梨栗。彈劒作歌奏苦聲，曳裾王門不稱情。淮陰市井笑韓信，漢朝公卿忌賈生。君不見昔時燕家重郭隗，擁篲折節無嫌猜。劇辛樂毅感恩分，輸肝剖膽效英才。昭王白骨縈爛草，誰人更掃黃金臺。行路難，歸去來。——《行路難三首 二》李白",
      "有耳莫洗潁川水，有口莫食首陽蕨。含光混世貴無名，何用孤高比雲月。吾觀自古賢達人，功成不退皆殞身。子胥既棄吳江上，屈原終投湘水濱。陸機雄才豈自保，李斯稅駕苦不早。華亭鶴唳詎可聞，上蔡蒼鷹何足道。君不見吳中張翰稱達生，秋風忽憶江東行。且樂生前一杯酒，何須身後千載名。——《行路難三首 三》李白",
      "長相思，在長安，絡緯秋啼金井闌。微霜淒淒簟色寒，孤燈不明思欲絕。卷帷望月空長歎，美人如花隔雲端。上有青冥之長天，下有淥水之波瀾。天長路遠魂飛苦，夢魂不到關山難。長相思，摧心肝。——《長相思》李白",
      "明月出天山，蒼茫雲海間。長風幾萬里，吹度玉門關。漢下白登道，胡窺青海灣。由來征戰地，不見有人還。[戍]客望邊色，思歸多苦顏。高樓當此夜，歎息未應閑。——《關山月》李白",
      "玉階生白露，夜久侵羅襪。却下水晶簾，玲瓏望秋月。——《玉階怨》李白",
      "雲想衣裳花想容，春風拂檻露華濃。若非羣玉山頭見，會向瑤臺月下逢。——《清平調詞三首 一》李白",
      "一枝穠豔露凝香，雲雨巫山枉斷腸。借問漢宮誰得似，可憐飛燕倚新妝。——《清平調詞三首 二》李白",
      "牀前看月光，疑是地上霜。舉頭望山月，低頭思故鄉。——《靜夜思》李白",
      "燕草如碧絲，秦桑低綠枝。當君懷歸日，是妾斷腸時。春風不相識，何事入羅幃。——《春思》李白",
      "秦地羅敷女，採桑綠水邊。素手青條上，紅妝白日鮮。蠶飢妾欲去，五馬莫留連。——《子夜吳歌 春歌》李白",
      "鏡湖三百里，菡萏發荷花。五月西施採，人看隘若耶。回舟不待月，歸去越王家。——《子夜吳歌 夏歌》李白",
      "長安一片月，萬戶擣衣聲。秋風吹不盡，總是玉關情。何日平胡虜，良人罷遠征。——《子夜吳歌 秋歌》李白",
      "明朝驛使發，一夜絮征袍。素手抽針冷，那堪把剪刀。裁縫寄遠道，幾日到臨洮。——《子夜吳歌 冬歌》李白",
      "吾愛孟夫子，風流天下聞。紅顏棄軒冕，白首臥松雲。醉月頻中聖，迷花不事君。高山安可仰，徒此揖清芬。——《贈孟浩然》李白",
      "我本楚狂人，鳳歌笑孔丘。手持綠玉杖，朝別黃鶴樓。五嶽尋仙不辭遠，一生好入名山遊。廬山秀出南斗傍，屏風九疊雲錦張，影落明湖青黛光。金闕前開二峰長，銀河倒挂三石梁。香爐瀑布遙相望，迴厓沓嶂凌蒼蒼。翠影紅霞映朝日，鳥飛不到吳天長。登高壯觀天地間，大江茫茫去不還。黃雲萬里動風色，白波九道流雪山。好爲廬山謠，興因廬山發。閑窺石鏡清我心，謝公行處蒼苔沒。早服還丹無世情，琴心三疊道初成。遙見仙人綵雲裏，手把芙蓉朝玉京。先期汗漫九垓上，願接盧敖遊太清。——《廬山謠寄盧侍御虛舟》李白",
      "海客談瀛洲，煙濤微茫信難求。越人語天姥，雲霓明滅或可覩。天姥連天向天橫，勢拔五嶽掩赤城。天台四萬八千丈，對此欲倒東南傾。我欲因之夢吳越，一夜飛度鏡湖月。湖月照我影，送我至剡溪。謝公宿處今尚在，淥水蕩漾清猨啼。脚著謝公屐，身登青雲梯。半壁見海日，空中聞天雞。千巖萬轉路不定，迷花倚石忽已暝。熊咆龍吟殷巖泉，慄深林兮驚層巔。雲青青兮欲雨，水澹澹兮生煙。列缺霹靂，丘巒崩摧。洞天石扇，訇然中開。青冥浩蕩不見底，日月照耀金銀臺。霓爲衣兮風爲馬，雲之君兮紛紛而來下。虎鼓瑟兮鸞迴車，仙之人兮列如麻。忽魂悸以魄動，怳驚起而長嗟。惟覺時之枕席，失向來之煙霞。世間行樂亦如此，古來萬事東流水。別君去時何時還，且放白鹿青崖間，須行即騎訪名山。安能摧眉折腰事權貴？使我不得開心顏。——《夢遊天姥吟留別》李白",
      "風吹柳花滿店香，吳姬壓酒喚客嘗。金陵子弟來相送，欲行不行各盡觴。請君試問東流水，別意與之誰短長。——《金陵酒肆留別》李白",
      "故人西辭黃鶴樓，煙花三月下揚州。孤帆遠影碧山盡，唯見長江天際流。——《黃鶴樓送孟浩然之廣陵》李白",
      "渡遠荆門外，來從楚國遊。山隨平野盡，江入大荒流。月下飛天鏡，雲生結海樓。仍連故鄉水，萬里送行舟。——《渡荆門送別》李白",
      "青山橫北郭，白水遶東城。此地一爲別，孤蓬萬里征。浮雲遊子意，落日故人情。揮手自茲去，蕭蕭班馬鳴。——《送友人》李白",
      "棄我去者昨日之日不可留，亂我心者今日之日多煩憂。長風萬里送秋雁，對此可以酣高樓。蓬萊文章建安骨，中間小謝又清發。俱懷逸興壯思飛，欲上青天覽日月。抽刀斷水水更流，舉杯銷愁愁更愁。人生在世不稱意，明朝散髮弄扁舟。——《宣州謝朓樓餞別校書叔雲》李白",
      "暮從碧山下，山月隨人歸。却顧所來徑，蒼蒼橫翠微。相攜及田家，童稚開荆扉。綠竹入幽徑，青蘿拂行衣。歡言得所憩，美酒聊共揮。長歌吟松風，曲盡河星稀。我醉君復樂，陶然共忘機。——《下終南山過斛斯山人宿置酒》李白",
      "鳳凰臺上鳳凰遊，鳳去臺空江自流。吳宮花草埋幽徑，晉代衣冠成古丘。三山半落青天外，二水中分白鷺洲。總爲浮雲能蔽日，長安不見使人愁。——《登金陵鳳凰臺》李白",
      "朝辭白帝彩雲間，千里江陵一日還。兩岸猨聲啼不盡，輕舟已過萬重山。——《早發白帝城》李白",
      "牛渚西江夜，青天無片雲。登舟望秋月，空憶謝將軍。余亦能高詠，斯人不可聞。明朝挂帆席，楓葉落紛紛。——《夜泊牛渚懷古》李白",
      "花間一壺酒，獨酌無相親。舉杯邀明月，對影成三人。月既不解飲，影徒隨我身。暫伴月將影，行樂須及春。我歌月裴回，我舞影零亂。醒時同交歡，醉後各分散。永結無情遊，相期邈雲漢。——《月下獨酌四首 一》李白",
      "蜀僧抱綠綺，西下峨眉峰。爲我一揮手，如聽萬壑松。客心洗流水，餘響入霜鐘。不覺碧山暮，秋雲暗幾重。——《聽蜀僧濬彈琴》李白",
      "美人捲珠簾，深坐顰蛾眉。但見淚痕濕，不知心恨誰。——《怨情》李白",
      "江漢曾爲客，相逢每醉還。浮雲一別後，流水十年間。歡笑情如舊，蕭疎鬢已斑。何因北歸去，淮上對秋山。——《淮上喜會梁川故人》韋應物",
      "兵衛森畫戟，宴寢凝清香。海上風雨至，逍遙池閣涼。煩疴近消散，嘉賓復滿堂。自慙居處崇，未覩斯民康。理會是非遣，性達形迹忘。鮮肥屬時禁，蔬果幸見嘗。俯飲一杯酒，仰聆金玉章。神歡體自輕，意欲凌風翔。吳中盛文史，羣彥今汪洋。方知大藩地，豈曰財賦疆。——《郡齋雨中與諸文士燕集》韋應物",
      "悽悽去親愛，泛泛入煙霧。歸棹洛陽人，殘鐘廣陵樹。今朝此爲別，何處還相遇。世事波上舟，沿洄安得住。——《初發揚子寄元大校書》韋應物",
      "嫁得瞿塘賈，朝朝誤妾期。早知潮有信，嫁與弄潮兒。——《相和歌辭 江南曲》李益",
      "漢家煙塵在東北，漢將辭家破殘賊。男兒本自重橫行，天子非常賜顏色。摐金伐鼓下榆關，旌旗逶迤碣石間。校尉羽書飛瀚海，單于獵火照狼山。山川蕭條極邊土，胡騎憑凌雜風雨。戰士軍前半死生，美人帳下猶歌舞。大漠窮秋塞草衰，孤城落日鬬兵稀。身當恩遇常輕敵，力盡關山未解圍。鐵衣遠戍辛勤久，玉箸應啼別離後。少婦城南欲斷腸，征人薊北空回首。邊風飄飄那可度，絕域蒼茫更何有。殺氣三日作陣雲，寒聲一夜傳刁斗。相看白刃血紛紛，死節從來豈顧勳。君不見沙場征戰苦，至今猶憶李將軍。——《相和歌辭 燕歌行》高適",
      "白日登山望烽火，昏黃飲馬傍交河。行人刁斗風砂暗，公主琵琶幽怨多。野營萬里無城郭，雨雪紛紛連大漠。胡雁哀鳴夜夜飛，胡兒眼淚雙雙落。聞道玉門猶被遮，應將性命逐輕車。年年戰骨埋荒外，空見蒲萄入漢家。——《相和歌辭 從軍行》李頎",
      "噫吁嚱！危乎高哉！蜀道之難難於上青天！蠶叢及魚鳧，開國何茫然。爾來四萬八千歲，乃與秦塞通人煙。西當太白有鳥道，可以橫絕峨眉巔。地崩山摧壯士死，然後天梯石棧方鉤連。上有六龍迴日之高標，下有衝波逆折之迴川。黃鶴之飛尚不得，猨猱欲度愁攀緣。青泥何盤盤，百步九折縈巖巒。捫參歷井仰脅息，以手撫膺坐長歎。問君西遊何時還？畏途巉巖不可攀。但見悲鳥號枯木，雄飛呼雌繞林間。又聞子規啼夜月，愁空山，蜀道之難難於上青天！使人聽此彫朱顏。連峰去天不盈尺，枯松倒挂倚絕壁。飛湍瀑流相喧豗，砅崖轉石萬壑雷。其嶮也若此，嗟爾遠道之人胡爲乎來哉？劒閣崢嶸而崔嵬，一夫當關，萬夫莫開。所守或匪親，化爲狼與豺。朝避猛虎，夕避長蛇。磨牙吮血，殺人如麻。錦城雖云樂，不如早還家。蜀道之難難於上青天，側身西望長咨嗟。——《相和歌辭 蜀道難》李白",
      "奉帚平明金殿開，暫將團扇共裴回。玉顏不及寒鵶色，猶帶昭陽日影來。——《相和歌辭 長信怨 二》王昌齡",
      "玉階生白露，夜久侵羅襪。却下水精簾，玲瓏望秋月。——《相和歌辭 玉階怨》李白",
      "秦地羅敷女，采桑綠水邊。素手青條上，紅妝白日鮮。蠶飢妾欲去，五馬莫留連。——《相和歌辭 子夜四時歌四首 春歌》李白",
      "鏡湖三百里，菡萏發荷花。五月西施采，人看隘若邪。迴舟不待月，歸去越王家。——《相和歌辭 子夜四時歌四首 夏歌》李白",
      "長安一片月，萬戶擣衣聲。秋風吹不盡，總是玉關情。何日平胡虜？良人罷遠征。——《相和歌辭 子夜四時歌四首 秋歌》李白",
      "明朝驛使發，一夜絮征袍。素手抽針冷，那堪把剪刀。裁縫寄遠道，幾日到臨洮。——《相和歌辭 子夜四時歌四首 冬歌》李白",
      "梧桐相待老，鴛鴦會雙死。貞婦貴徇夫，舍生亦如此。波瀾誓不起，妾心井中水。——《琴曲歌辭 列女操》孟郊",
      "慈母手中線，遊子身上衣。臨行密密縫，意恐遲遲歸。誰言寸草心，報得三春暉。——《雜曲歌辭 遊子吟》孟郊",
      "三月三日天氣新，長安水邊多麗人。態濃意遠淑且真，肌理細膩骨肉勻。繡羅衣裳照暮春，蹙金孔雀銀麒麟。頭上何所有？翠微㔩葉垂鬢脣。背後何所見？珠壓腰衱穩稱身。就中雲幕椒房親，賜名大國虢與秦。紫駞之峯出翠釜，水晶之盤行素鱗。犀筯厭飫久未下，鸞刀縷切空紛綸。黃門飛鞚不動塵，御廚絲絡送八珍。簫鼓哀吟感鬼神，賓從雜遝實要津。後來鞍馬何逡巡，當軒下馬入錦茵。楊花雪落覆白蘋，青鳥飛去銜紅巾。炙手可熱勢絕倫，慎莫近前丞相嗔。——《雜曲歌辭 麗人行》杜甫",
      "長相思，在長安，絡緯秋啼金井欄。微霜淒淒簟色寒，孤燈不明思欲絕。卷帷望月空長歎，美人如花隔雲端。上有青冥之長天，下有綠水之波瀾。天長路遠魂飛苦，夢魂不到關山難。長相思，摧心肝。——《雜曲歌辭 長相思三首 一》李白",
      "日色已盡花含煙，月明欲素愁不眠。趙瑟初停鳳凰柱，蜀琴欲奏鴛鴦弦。此曲有意無人傳，願隨春風寄燕然，憶君迢迢隔青天。昔日橫波目，今成流淚泉。不信妾腸斷，歸來看取明鏡前。——《雜曲歌辭 長相思三首 二》李白",
      "金尊清酒斗十千，玉盤珍羞直萬錢。停杯投筯不能食，拔劒四顧心茫然。欲渡黃河冰塞川，將登太行雪暗天。閑來垂釣坐溪上，忽復乘舟夢日邊。行路難，行路難，多岐路，今安在？長風破浪會有時，直挂雲帆濟滄海。——《雜曲歌辭 行路難三首 一》李白",
      "大道如青天，我獨不得出。羞逐長安社中兒，赤雞白狗賭梨栗。彈劒作歌奏苦聲，曳裾王門不稱情。淮陰市井笑韓信，漢朝公卿忌賈生。君不見昔時燕家重郭隗，擁篲折腰無嫌猜。劇辛樂毅感恩分，輸肝剖膽效英才。昭王白骨縈蔓草，誰人更掃黃金臺。行路難，歸去來。——《雜曲歌辭 行路難三首 二》李白",
      "有耳莫洗潁川水，有口莫食首陽蕨。含光混世貴無名，何用孤高比雲月。吾觀自古賢達人，功成不退皆殞身。子胥既棄吳江上，屈原終投湘水濱。陸機才多豈自保，李斯稅駕苦不早。華亭鶴唳詎可聞，上蔡蒼鷹何足道？君不見吳中張翰稱達士，秋風忽憶江東行。且樂生前一杯酒，何須身後千載名。——《雜曲歌辭 行路難三首 三》李白",
      "君家定何處？妾住在橫塘。停舟暫借問，或恐是同鄉。——《雜曲歌辭 長干曲四首 一》崔顥",
      "家臨九江水，去來九江側。同是長干人，生小不相識。——《雜曲歌辭 長干曲四首 二》崔顥",
      "妾髮初覆額，折花門前劇。郎騎竹馬來，遶牀弄青梅。同居長干里，兩小無嫌猜。十四爲君婦，羞顏尚不開。低頭向暗壁，千喚不一迴。十五始展眉，願同塵與灰。常存抱柱信，豈上望夫臺。十六君遠行，瞿塘灩預堆。五月不可觸，猨鳴天上哀。門前遲行跡，一一生綠苔。苔深不能掃，落葉秋風早。八月蝴蝶來，雙飛西園草。感此傷妾心，坐愁紅顏老。早晚下三巴，預將書報家。相迎不道遠，直至長風沙。——《雜曲歌辭 長干行二首 一》李白",
      "盧家小婦鬱金堂，海燕雙栖玳瑁梁。九月寒砧催下葉，十年征戍憶遼陽。白狼河北音書斷，丹鳳城南秋夜長。誰知含愁獨不見，使妾明月照流黃。——《雜曲歌辭 獨不見》沈佺期",
      "桂魄初生秋露微，輕羅已薄未更衣。銀箏夜久殷勤弄，心怯空房不忍歸。——《雜曲歌辭 秋夜曲》王涯",
      "鶯啼燕語報新年，馬邑龍堆路幾千。家住秦城鄰漢苑，心隨明月到胡天。機中錦字論長恨，樓上花枝笑獨眠。爲問元戎竇車騎，何時反斾勒燕然。——《春思》皇甫冉",
      "更深月色半人家，北斗闌干南斗斜。今夜偏知春氣暖，蟲聲新透綠窗紗。——《夜月》劉方平",
      "紗窗日落漸黃昏，金屋無人見淚痕。寂寞空庭春欲晚，梨花滿地不開門。——《春怨》劉方平",
      "白日依山盡，黃河入海流。欲窮千里目，更上一層樓。——《登鸛雀樓》王之渙",
      "黃河遠上白雲間，一片孤城萬仞山。羌笛何須怨楊柳，春光不度玉門關。——《涼州詞二首 一》王之渙",
      "道由白雲盡，春與青溪長。時有落花至，遠隨流水香。閑門向山路，深柳讀書堂。幽映每白日，清輝照衣裳。——《闕題》劉眘虛",
      "歲歲金河復玉關，朝朝馬策與刀環。三春白雪歸青冢，萬里黃河遶黑山。——《征怨》柳中庸",
      "故關衰草遍，離別正堪悲。路出寒雲外，人歸暮雪時。少孤爲客早，多難識君遲。揜泣空相向，風塵何所期。——《送李端》嚴維",
      "玉樓天半起笙歌，風送宮嬪笑語和。月殿影開聞夜漏，水精簾卷近銀河。——《宮詞五首 二》顧況",
      "领导我们事业的核心力量是中国共产党。指导我们思想的理论基础是马克思列宁主义。——《中华人民共和国第一届全国人民代表大会第一次会议开幕词》（一九五四年九月十五日），一九五四年九月十六日《人民日报》。",
      "既要革命，就要有一个革命的党。没有一个革命的党，没有一个按照马克思列宁主义的革命理论和革命风格建立起来的革命党，就不可能领导工人阶级和广大人民群众战胜帝国主义及其走狗。——《全世界革命力量团结起来，反对帝国主义的侵略》（一九四八年十一月），《毛泽东选集》第四卷第一三六零页。",
      "没有中国共产党的努力，没有中国共产党人做中国人民的中流砥柱，中国的独立和解放是不可能的，中国的工业化和农业近代化也是不可能的。 ——《论联合政府》（一九四五年四月二十四日），《毛泽东选集》第三卷第一零九八-一零九九页。",
      "中国共产党是全中国人民的领导核心。没有这样一个核心，社会主义事业就不能胜利。——《在接见出席中国新民主主义青年团第三次全国代表大会的全体代表时的讲话》（一九五七年五月二十五日），《新华半月刊》一九五七年第十二号第五七页。",
      "一个有纪律的，有马克思列宁主义的理论武装的，采取自我批评方法的，联系人民群众的党。一个由这样的党领导的军队。一个由这样的党领导的各革命阶级各革命派别的统一战线。这三件是我们战胜敌人的主要武器。——《论人民民主专政》（一九四九年六月三十日），《毛泽东选集》第四卷第一四八四页。",
      "我们应当相信群众，我们应当相信党，这是两条根本的原理。如果怀疑这两条原理，那就什么事情也做不成了。——《关于农业合作化问题》（一九五五年七月三十一日），人民出版社第九页。",
      "以马克思列宁主义的理论思想武装起来的中国共产党，在中国人民中产生了新的工作作风，这主要的就是理论和实践相结合的作风，和人民群众紧密地联系在一起的作风以及自我批评的作风。——《论联合政府》（一九四五年四月二十四日），《毛泽东选集》第三卷第一零九四—一零九五页。",
      "指导一个伟大的革命运动的政党，如果没有革命理论，没有历史知识，没有对于实际运动的深刻的了解，要取得胜利是不可能的。——《中国共产党在民族战争中的地位》（一九三八年十月），《毛泽东选集》第二卷第五二一页。",
      "我们过去说过，整风运动是一个“普遍的马克思主义的教育运动”。整风就是全党通过批评和自我批评来学习马克思主义。在整风中间，我们一定可以更多地学到一些马克思主义。——《在中国共产党全国宣传工作会议上的讲话》（一九五七年三月十二日），人民出版社版第一一页。",
      "要使几亿人中的中国人生活得好，要把我们这个经济落后、文化落后的国家，建设成为富裕的、强盛的、具有高度文化的国家，这是一个很艰巨的任务。我们所以要整风，现在要整风，将来还要整风，要不断把我们身上的错误东西整掉，就是为了使我们能够更好地担负起这项任务，更好地同党外的一切立志改革的志士仁人共同工作。——《在中国共产党全国宣传工作会议上的讲话》（一九五七年三月十二日），人民出版社版第一二页。",
      "政策是革命政党一切实际行动的出发点，并且表现于行动的过程和归宿。一个革命政党的任何行动都是实行政策。不是实行正确的政策，就是实行错误的政策；不是自觉地，就是盲目地实行某种政策。所谓经验，就是实行政策的过程和归宿。政策必须在人民实践中，也就是经验中，才能证明其正确与否，才能确定其正确和错误的程度。但是，人们的实践，特别是革命政党和革命群众的实践，没有不同这种或那种政策相联系的。因此，在每一行动之前，必须向党员和群众讲明我们按情况规定的政策。否则，党员和群众就会脱离我们政策的领导而盲目行动，执行错误的政策。——《关于工商业政策》（一九四八年二月二十七日），《毛泽东选集》第四卷第一二八四页。",
      "我党规定了中国革命的总路线和总政策，又规定了各项具体的工作路线和各项具体的政策。但是，许多同志往往记住了我党的具体的个别的工作路线和政策，忘记了我党的总路线和总政策。而如果真正忘记了我党的总路线和总政策，我们就将是一个盲目的不完全的不清醒的革命者，在我们执行具体工作路线和具体政策的时候，就会迷失方向，就会左右摇摆，就会贻误我们的工作。——《在晋绥干部会议上的讲话》（一九四八年四月一日），《毛泽东选集》第四卷第一三一四页。",
      "政策和策略是党的生命，各级领导同志务必充分注意，万万不可粗心大意。——《关于情况的通报》（一九四八年三月二十日），《毛泽东选集》第四卷第一二九六页。",
      "阶级斗争，一些阶级胜利了，一些阶级消灭了。这就是历史，这就是几千年的文明史。拿这个观点解释历史的就叫做历史的唯物主义，站在这个观点的反面的是历史的唯心主义。《丢掉幻想，准备斗争》（一九四九年八月十四日），《毛泽东选集》第四卷第一四九一页。",
      "在阶级社会中，每一个人都在一定的阶级地位中生活，各种思想无不打上阶级的烙印。《实践论》（一九三七年七月），《毛泽东选集》第一卷第二七二页。",
      "社会的变化，主要地是由于社会内部矛盾的发展，即生产力和生产关系的矛盾，阶级之间的矛盾，新旧之间的矛盾，由于这些矛盾的发展，推动了社会的前进，推动了新旧社会的代谢。《矛盾论》（一九三七年八月），《毛泽东选集》第一卷第二九零页。",
      "地主阶级对于农民的残酷的经济剥削和政治压迫，迫使农民多次地举行起义，以反抗地主阶级的统治。……在中国封建社会里，只有这种农民的阶级斗争、农民的起义和农民的战争，才是历史发展的真正动力。《中国革命和中国共产党》（一九三九年十二月），《毛泽东选集》第二卷第六一九页。",
      "民族斗争，说到底，是一个阶级斗争问题。在美国压迫黑人的，只是白色人种中的反动统治集团。他们绝不能代表白色人种中占绝大多数的工人、农民、革命的知识分子和其他开明人士。《支持美国黑人反对美帝国主义种族歧视的正义斗争的声明》。（一九六三年八月八日），《全世界人民团结起来打败美国侵略者及其一切走狗》人民出版社版第四页人民靠我们去组织。中国的反动分子，靠我们组织起人民去反他打倒。凡是反动的东西，你不打，他就不倒。这也和扫地一样，扫帚不到，灰尘照例不会自己跑掉。《抗日战争胜利后的时局和我们的方针》（一九四五年八月十三日），《毛泽东选集》第四卷第一一三一页。",
      "敌人是不会自行消灭的。无论是中国的反动派，或是美国帝国主义在中国的侵略势力，都不会自行退出历史舞台。《将革命进行到底》（一九四八年十二月三十日），《毛泽东选集》第四卷第一三七九页。",
      "革命不是请客吃饭，不是做文章，不是绘画绣花，不能那样雅致，那样从容不迫，文质彬彬，那样温良恭俭让。革命是暴动，是一个阶级推翻一个阶级的暴烈的行动。《湖南农民运动考察报告》（一九二七年三月），《毛泽东选集》第一卷第一八页。",
      "蒋介石对于人民是寸权必夺，寸利必得。我们呢？我们的方针是针锋相对，寸土必争。我们是按照蒋介石的办法办事。蒋介石总是要强迫人民接受战争，他左手拿着刀，右手也拿着刀。我们就按照他的办法，也拿起刀来。……现在蒋介石已经在磨刀了，因此，我们也要磨刀。《抗日战争胜利后的时局和我们的方针》（一九四五年八月十三日），《毛泽东选集》第四卷第一一二六——一一二七页。",
      "谁是我们的敌人？谁是我们的朋友？这个问题是革命的首要问题。中国过去一切革命斗争成效甚少，其基本原因就是因为不能团结真正的朋友，以攻击真正的敌人。革命党是群众的向导，在革命中未有革命党领错了路而革命不失败的。我们的革命要有不领错路和一定成功的把握，不可不注意团结我们的真正的朋友，以攻击我们的真正的敌人。我们要分辨真正的敌友，不可不将中国社会各阶级的经济地位及其对于革命的态度，作一个大概的分析。《中国社会各阶级的分析》（一九二六年三月），《毛泽东选集》第一卷第三页。",
      "一切勾结帝国主义的军阀、官僚、买办阶级、大地主阶级以及附属于他们的一部分反动知识界，是我们的敌人。工业无产阶级是我们革命的领导力量。一切半无产阶级、小资产阶级，是我们最接近的朋友。那动摇不定的中产阶级，其右翼可能是我们的敌人，其左翼可能是我们的朋友——但我们要时常提防他们，不要让他们扰乱了我们的阵线。《中国社会各阶级的分析》（一九二六年三月），《毛泽东选集》第一卷第八——第九页。",
      "什么人站在革命人民方面，他就是革命派，什么人站在帝国主义封建主义官僚资本主义方面，他就是反革命派。什么人只是口头上站在革命人民方面而在行动上则另是一样，他就是一个口头革命派，如果不但在口头上而且在行动上也站在革命人民方面，他就是一个完全的革命派。在中国人民政治协商会议第一届全国委员会第二次会议上的闭幕词（一九五零年六月二十三日），一九五零年六月二十四日《人民日报》。",
      "我认为，对我们来说，一个人，一个党，一个军队，或者一个学校，如若不被敌人反对，那就不好了那一定是同敌人同流合污了。如若被敌人反对，那就好了，那就证明我们同敌人划清界线了。如若敌人起劲地反对我们，把我们说得一塌糊涂，一无是处，那就更好了，那就证明我们不但同敌人划清了界线，而且证明我们的工作是很有成绩的了。《被敌人反对是好事而不是坏事》（一九三九年五月二十六日），人民出版社版第二页。",
      "凡是敌人反对的，我们就要拥护；凡是敌人拥护的，我们就要反对。《和中央社、扫荡报、新民报三记者的谈话》（一九三九年九月十六日），《毛泽东选集》第二卷第五八零页。",
      "我们是站在无产阶级的和人民大众的立场。对于共产党员来说，也就是要站在党的立场，站在党性和党的政策的立场。《在延安文艺座谈会上的讲话（一九四二年五月），〈毛泽东选集〉第三卷第八五零页。",
      "在拿枪的敌人被消灭以后，不拿枪的敌人依然存在，他们必然地要和我们作拚死的斗争 ，我们决不可以轻视这些敌人。如果我们现在不是这样地提出问题和认识问题，我们就要犯极大的错误。《在中国共产党第七届中央委员会第二次全体会议上的报告》（一九四九年三月五日），《毛泽东选集》第四卷第一四二八页。",
      "帝国主义者和国内反动派决不甘心于他们的失败，他们还要作最后的挣扎。在全国平定以后，他们也还会以各种方式从事破坏和捣乱，他们将每日每时企图在中国复辟。这是必然的，毫无疑义的，我们务必不要松懈自己的警惕性。在中国人民政治协商会议第一届全体会议上的开幕词（一九四九年九月二十一日），一九四九年九月二十二日《人民日报》。",
      "在我国，虽然社会主义改造，在所有制方面说来，已经基本完成，革命时期的大规模的急风暴雨式的群众阶级斗争已经基本结束，但是，被推翻的地主买办阶级的残余还是存在，资产阶级还是存在，小资产阶级刚刚在改造。阶级斗争并没有结束。无产阶级和资产阶级之间的阶级斗争，各派政治力量之间的阶级斗争，无产阶级和资产阶级之间在意识形态方面的阶级斗争，还是长时期的，曲折的，有时甚至是很激烈的。资产阶级也要按照自己的世界观改造世界，无产阶级要按照自己的世界观改造世界。在这一方面，社会主义和资本主义之间谁胜谁负的问题还没有真正解决。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第二六——二七页。",
      "我国社会主义和资本主义之间在意识形态方面的谁胜谁负的斗争，还需要一个相当长的时间才能解决。这是因为资产阶级和从旧社会来的知识分子的影响还要在我国长期存在，作为阶级的意识形态，还要在我国长期存在。如果对于这种形势认识不足，或者根本不认识，那就要犯绝大的错误，就会忽视必要的思想斗争。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第二七页。",
      "在我国，资产阶级和小资产阶级的思想，反马克思主义的思想，还会长期存在。社会主义制度在我国已经基本建立。我们已经在生产资料所有制的改造方面，取得了基本胜利，但是在政治战线和思想战线方面，我们还没有完全取得胜利。无产阶级和资产阶级之间在意识形态方面的谁胜谁负问题，还没有真正解决。我们同资产阶级和小资产阶级的思想还要进行长期的斗争。不了解这种情况，放弃思想斗争，那就是错误的。凡是错误的思想，凡是毒草，凡是牛鬼蛇神，都应该进行批判，决不能让它们自由泛滥。但是，这种批判，应该是充分说理的，有分析的，有说服力的，而不应该是粗暴的、官僚主义的，或者是形而上学的、教条主义的。《在中国共产党铨国宣传工作会议上的讲话》（一九五七年三月十二日），人民出版社版第一九——二零页。",
      "教条主义和修正主义都是违反马克思主义的。马克思主义一定要向前发展，要随着实践的发展而发展，不能停滞不前。停止了，老是那么一套，它就没有生命了。但是，马克思主义的基本原则又是不能违背的，违背了就要犯错误。用形而上学的观点来看待马克思主义，把它看成僵死的东西，这是教条主义。否定马克思主义的基本原则，否定马克思主义的普遍真理，这就是修正主义。修正主义是一种资产阶级思想。修正主义者抹杀社会主义和资本主义的区别，抹杀无产阶级专政和资产阶级专政的区别。他们所主张的，在实际上并不是社会主义路线，而是资本主义路线。在现在的情况下，修正主义的比教条主义更有害的东西。我们现在思想战线上的一个重要任务，就是要开展对于修正主义的批判。《在中国共产党全国宣传工作会议上的讲话》（一九五七年三月十二日），人民出版社版第二零——二十一页。",
      "修正主义，或者右倾机会主义，是一种资产阶级思潮，它比教条主义有更大的危险性。修正主义者，右倾机会主义者，口头上也挂着马克思主义，他们也在那里攻击“教条主义”。但是他们所攻击的正是马克思主义的最根本的东西。他们反对或者歪曲唯物论和辩证法，反对或者企图削弱人民民主专政和共产党的领导，反对或者企图削弱社会主义改造和社会主义建设。在我国社会主义革命取得基本胜利以后，社会上还有一部分人梦想恢复资本主义制度，他们要从各个方面向工人阶级进行斗争，包括思想方面的斗争。而在这个斗争中，修正主义者就是他们最好的助手。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第二九——三零页。",
      "共产主义是无产阶级的整个思想体系，同时又是一种新的社会制度。这种思想体系和社会制度，是区别于任何别的思想体系和任何别的社会制度的，是自有人类历史以来，最完全最进步最革命最合理的。封建主义的思想体系和社会制度，是进了历史博物馆的东西了。资本主义的思想体系和社会制度，已有一部分进了博物馆（在苏联）；其余部分，也已“日薄西山，气息奄奄，人命危浅，朝不虑夕”，快进博物馆了。惟独共产主义的思想体系和社会制度，正以排山倒海之势，雷霆万钧之力，磅礴于全世界，而葆其美妙之青春。《新民主主义论》（一九四零年一月），《毛泽东选集》第二卷第六七九页。",
      "社会主义制度终究要代替资本主义制度，这是一个不以人们自己的意志为转移的客观规律。不管反动派怎样企图阻止历史车轮的前进，革命或迟或早总会发生，并且将必然取得胜利。《在苏联最高苏维埃庆祝伟大的十月社会主义革命四十周年会议上的讲话》（一九五七年十一月六日），人民出版社版第五页。",
      "我们共产党人从来不隐瞒自己的政治主张。我们的将来纲领或最高纲领，是要将中国推进到社会主义社会和共产主义社会去的，这是确定的和毫无疑义的。我们的党的名称和我们的马克思主义的宇宙观，明确地指明了这个将来的、无限光明的、无限美妙的最高理想。《论联合政府》（一九四五年四月二十四日），《毛泽东选集》第三卷第一零五九页。",
      "中国共产党领导的整个中国革命运动，是包括民主主义革命和社会主义革命两个阶段在内的全部革命运动；这是两个性质不同的革命过程，只有完成了前一个革命过程才有可能去完成后一个革命过程。民主主义革命是社会主义革命的必要准备，社会主义革命是民主主义革命的必然趋势。而一切共产主义者的最后目的，则是在于力争社会主义社会和共产主义社会的最后的完成。《中国革命和中国共产党》（一九三九年十二月），《毛泽东选集》第二卷第六四六页。",
      "社会主义革命的目的是为了解放生产力。农业和手工业由个体所有制变为社会主义的集体所有制，私营工商业由资本主义所有制变为社会主义所有制，必然使生产力大大地获得解放。这样就为大大地发展工业和农业的生产创造了社会条件。在最高国务会议上的讲话（一九五六年一月二十五日），一九五六年一月二十六日《人民日报》。",
      "我们现在不但正在进行关于社会制度方面的由私有制到公有制的革命，而且正在进行技术方面的由手工业生产到大规模现代化机器生产的革命，而这两种革命是结合在一起的。在农业方面，在我国的条件下（资本主义国家内是使农业资本主义化），则必须先有合作化，然后才能使用大机器。由此可见，我们对于工业和农业、社会主义的工业化和社会主义的农业改造这样两件事，决不可以分割起来和互相孤立起来去看，决不可以只强调一方面，减弱另一方面。《关于农业合作化问题》（一九五五年七月三十一日），人民出版社版第二三——二四页。",
      "新的社会制度还刚刚建立，还需要有一个巩固的时间。不能认为新制度一旦建立起来就完全巩固了，那是不可能的。需要逐步地巩固。要使它最后巩固起来，必须实现国家的社会主义工业化，坚持经济战线上的社会主义革命，还必须在政治战线和思想战线上，进行经常的、艰苦的社会主义革命斗争和社会主义教育。除了这些以外，还要有各种国际条件的配合。《在中国共产党全国宣传工作会议上的讲话》（一九五七年三月十二日），人民出版社版第二页。",
      "在我国，巩固社会主义制度的斗争，社会主义和资本主义谁战胜谁的斗争，还要经过一个很长的历史时期。但是，我们大家都应该看到，这个社会主义的新制度是一定会巩固起来的。我们一定会建设一个具有现代工业、现代农业和现代科学文化的社会主义国家。《在中国共产党全国宣传工作会议上的讲话》（一九五七年三月十二日），人民出版社版第二页。",
      "对于我们的国家抱着敌对情绪的知识分子，是极少数。这种人不喜欢我们这个无产阶级专政的国家，他们留恋旧社会。一遇机会，他们就会兴风作浪，想要推翻共产党，恢复旧中国。这是在无产阶级和资产阶级两条路线、社会主义和资本主义两条路线中间，顽固地要走后一条路线的人。这后一条路线，在实际上是不能实现的，所以他们实际上是准备投降帝国主义、封建主义和官僚资本主义的人。这种人在政治界、工商界、文化教育界、科学技术界、宗教界里都有，这是一些极端反动的人。《在中国共产党全国宣传工作会议上的讲话》（一九五七年三月十二日），人民出版社版第三页。",
      "严重的问题是教育农民。农民的经济是分散的，根据苏联的经验，需要很长的时间和细心的工作，才能做到农业社会化。没有农业社会化，就没有全部的巩固的社会主义。《论人民民主专政》（一九四九年六月三十日），《毛泽东选集》第四卷第一四八二页我们必须相信：（1）广大农民是愿意在党的领导下逐步地走上社会主义道路的；（2）党是能够领导农民走上社会主义道路的。这两点是事物的本质和主流。《关于农业合作化问题》（一九五五年七月三十一日），人民出版社版第二一页。",
      "合作社的领导机关必须建立现有贫农和新下中农在领导机关中的优势，而以老下中农和新老两部分上中农作为辅助力量，才能按照党的政策实现贫农和中农的团结，巩固合作社，发展生产，正确地完成整个农村的社会主义改造。没有这个条件，中农和贫农就不能团结，合作社就不能巩固，生产就不能发展，整个农村的社会主义改造就不能实现。《长沙县高山乡武塘农业生产合作社是行政机关从中农占优势转变为贫农占优势的》一文的按语（一九五五年），《中国农村的社会主义高潮》中册第八五七页。",
      "中农是必须团结，不团结中农是错误的。但是工人阶级和共产党，在农村中，依靠什么人去团结中农，实现整个农村的社会主义改造呢？当然只有贫农。在过去向地主作斗争、实行土地改革的时候是这样，在现在向富农和其他资本主义因素作斗争实行农业的社会主义改造的时候，也是这样。在两个革命时期，中农在开始阶段都是动摇的。等到看清了大势，革命将要胜利的时候，中农才会参加到革命方面来。贫农必须向中农做工作，把中农团结到自己方面来，使革命一天一天地扩大，直到取得最后的胜利。《福安县发生“中农社”和“贫农社”的教训》一文的按语（一九五五年），《中国农村的社会主义高潮》中册第七零一页。",
      "富裕农民中的资本主义倾向是严重的。只要我们在合作化运动中，乃至以后一个很长的时期内，稍微放松了对于农民的政治工作，资本主义倾向就会泛滥起来。《必须对资本主义倾向作坚决的斗争》一文按语（一九五五年），《中国农村的社会主义高潮》上册第三五三页。",
      "农业合作化运动，从一开始，就是一种严重的思想的和政治的斗争。每一个合作社，不经过这样的一场斗争，就不能创立。一个崭新的社会制度要从旧制度的基地上建立起来，它就必须清除这个基地。反映旧制度的旧思想的残余，总是长期地留在人们的头脑里，不愿意轻易地退走的。合作社建立以后，还必须经过许多的斗争，才能使自己巩固起来。巩固了以后，只要一松劲，又可能垮台。《严重的教训》一文的按语（一九五五年），《中国农村的社会主义高潮》上册第一二三页。",
      "在最近几年中间，农村中的资本主义自发势力一天一天地在发展，新富农已经到处出现，许多富裕中农力求把自己变为富农。许多贫农，则因为生产资料不足，仍然处于贫困地位，有些人欠了债，有些人出卖土地，或者出租土地。这种情况如果让它发展下去，农村中向两极分化的现象必然一天一天地严重起来。失去土地的农民和继续处于贫困地位的农民将要埋怨我们，他们将说我们见死不救，不去帮助他们解决困难。向资本主义方向发展的那些富裕中农也将对我们不满，因为我们如果不想走资本主义的道路的话，就永远不能满足这些农民的要求。在这种情况之下，工人和农民的同盟能够继续巩固下去吗？显然是不能够的。这个问题，只有在新的基础之上才能获得解决。这就是在逐步地实现社会主义工业化和逐步地实现对于手工业、对于资本主义工商业的社会主义改造的同时，逐步地实现对于整个农业的社会主义的改造，即实行合作化，在农村中消灭富农经济制度和个体经济制度，使全体农村人民共同富裕起来。我们认为只有这样，工人和农民的联盟才能获得巩固。《关于农业合作化问题》（一九五五年七月三十一日），人民出版社版第三一——三二页。",
      "……统筹兼顾，是指对于六亿人口的统筹兼顾。我们作计划、办事、想问题，都要从我国有六亿人口这一点出发，千万不要忘记这一点。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第二四页。",
      "除了党的领导之外，六亿人口是一个决定的因素。人多议论多，热气高，干劲大。从来也没有看见人民群众象现在这样精神振奋，斗志昂扬，意气风发。《介绍一个合作社》（一九五作年四月十五日），人民出版社版第一页。",
      "除了别的特点之外，中国六亿人口的显著特点是一穷二白。这些看起来是坏事，其实是好事。穷则思变，要干，要革命。一张白纸，没有负担，好写最新最美的文字，好画最新最美的画图。《介绍一个合作社》（一九五作年四月十五日），人民出版社版第一——二页。",
      "中国革命在全国胜利，并且解决了土地问题以后，中国还存在着两种基本的矛盾。第一种是国内的，即工人阶级和资产阶级的矛盾。第二种是国外的，即中国和帝国主义国家的矛盾。因为这样，工人阶级领导的人民共和国的国家政权，在人民民主革命胜利以后，不是可以削弱，而是必须强化。《在中国共产党第七届中央委员会第二次全体会议上的报告》。（一九四九年三月五日），《毛泽东选集》第四卷第一四三四页 。",
      "“你们不是要消灭国家权力吗？”我们要，但是我们现在还不要，我们现在还不能要。为什么？帝国主义还存在，国内反动派还存在，国内阶级还存在。我们现在的任务是要强化人民的国家机器，这主要地是指人民的军队、人民的警察和人民的法庭，借以巩固国防和保护人民利益。《论人民民主专政》（一九四九年六月三十日），《毛泽东选集》第四卷第一四八零页。",
      "我们的国家是工人阶级领导的以工农联盟为基础的人民民主专政的国家。这个专政是干什么的呢？专政的第一个作用，就是压迫国家内部的反动阶级、反动派和反抗社会主义革命的剥削者，压迫那些对于社会主义建设的破坏者，就是为了解决国内敌我之间的矛盾。例如逮捕某些反革命分子并且将他们判罪，在一个时期内不给地主阶级分子和官僚资产阶级分子以选举权，不给他们发表言论的自由权利，都是属于专政的范围。为了维护社会秩序和广大人民的利益，对于那些盗窃犯、诈骗犯、杀人放火犯、流氓集团和各种严重破坏社会秩序的坏分子，也必须实行专政。专政还有第二个作用，就是防御国家外部敌人的颠覆活动和可能的侵略。在这种情况出现的时候，专政就担负着对外解决敌我之间的矛盾的任务。专政的目的是为了保卫全体人民进行和平劳动，将我国建设成为一个具有现代工业、现代农业和现代科学文化的社会主义国家。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第三——第四页。",
      "人民民主专政需要工人阶级的领导。因为只有工人阶级最有远见，大公无私，最富于革命的彻底性。整个革命历史证明，没有工人阶级的领导，革命就要失败，有了工人阶级的领导，革命就胜利了。《论人民民主专政》（一九四九年六月三十日），《毛泽东选集》第四卷第一四八三页。",
      "人民民主专政的基础是工人阶级、农民阶级和城市小资产阶级的联盟，而主要是工人和农民的联盟，因为这两个阶级占了中国人口的百分之八十到九十。推翻帝国主义和国民党反动派，主要是这两个阶级的力量。由新民主主义到社会主义，主要依靠这两个阶级的联盟。《论人民民主专政》（一九四九年六月三十日），《毛泽东选集》第四卷第一四八三页。",
      "阶级斗争、生产斗争和科学实验，是建设社会主义强大国家的三项伟大革命运动，是使共产党人免除官僚主义、避免修正主义和教条主义，永远立于不败之地的确实保证，是使无产阶级能够和广大劳动群众联合起来，实行民主专政的可靠保证。不然的话，让地、富、反、坏、牛鬼蛇神一齐跑了出来，而我们的干部则不闻不问，有许多人甚至敌我不分，互相勾结，被敌人腐蚀侵袭，分化瓦解，拉出去，打进来，许多工人、农民和知识分子也被敌人软硬兼施，照此办理，那就不要很多时间，少则几年、十几年，多则几十年，就不可避免地要出现全国性的反革命复辟，马列主义的党就一定会变成修正主义的党，变成法西斯党，整个中国就要改变颜色了。请同志们想一想，这是一种多么危险的情景啊！《浙江省七个关于干部参加劳动的好材料》的批语（一九六三年五月九日），《关于赫鲁晓夫的假共产主义及其在世界历史上的教训》一文的引语，一九六四年七月十四日《人民日报》。",
      "人民民主专政有两个方法。对敌人说来是用专政的方法，就是说在必要的时期内，不让他们参与政治活动，强迫他们服从人民政府的法律，强迫他们从事劳动并在劳动中改造他们成为新人。对人民说来则与此相反，不是用强迫的方法，而是用民主的方法，就是说必须让他们参与政治活动，不是强迫他们做这样做那样，而是用民主的方法向他们进行教育和说服的工作。在中国人民政治协商会议第一届全国委员会第二次会议上的闭幕词（一九五零年六月二十三日），一九五零后六月二十四日《人民日报》。",
      "为了在更加巩固的基础上迅速发展中国的社会主义事业，中国人民正在共产党的领导之下进行一个生气勃勃的整风运动。这就是在城市和农村中对于社会主义和资本主义两条道路、国家的根本制度和重大政策、党政工作人员的工作作风、人民的生活福利等项问题，用摆事实讲道理的方法，有领导地自由地展开全民性的大辩论，用以正确地解决在人民内部实际存在而为当前所必需解决的各项矛盾问题。这是一个社会主义的人民自我教育、自我改造的运动。《在苏联最高苏维埃庆祝伟大的十月社会主义革命四十周年会议上的讲话》（一九五七年十一月六日），人民出版社版第八页。",
      "为了进行伟大的建设工作，在我们的面前，摆着极为繁重的任务。虽然我们有一千多万党员，但是在全国人口中仍然只占极少数。在我们的各个国家机关和各项社会事业中，大量的工作要依靠党外的人员来作。如果我们不善于依靠人民群众，不善于同党外的人员合作，那就无法把工作做好。在我们继续加强全党的团结的时候，我们还必须继续加强各民族、各民主阶级、各民主党派、各人民团体的团结，继续巩固和扩大我们的人民民主统一战线，必须认真地纠正在任何工作环节上的任何一种妨害党同人民团结的不良现象。《中国共产党第八次全国代表大会开幕词》（一九五六年九月十五日），《中国共产党第八次全国代表大会文献》人民出版社版第八页。 ",
      "在我们的面前有两类社会矛盾，这就是敌我之间的矛盾和人民内部的矛盾。这是性质完全不同的两类矛盾。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第一页。",
      "为了正确地认识敌我之间和人民内部这两类不同的矛盾，应该首先弄清楚什么是人民，什么是敌人。……在现阶段，在建设社会主义的时期，一切赞成、拥护和参加社会主义建设事业的阶级、阶层和社会集团，都属于人民的范围；一切反抗社会主义革命和敌视、破坏社会主义建设的社会势力和社会集团，都是人民的敌人。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第一——二页在我国现在的条件下，所谓人民内部的矛盾，包括工人阶级内部的矛盾，农民阶级内部的矛盾，知识分子内部的矛盾，工农两个阶级之间的矛盾，工人、农民同知识分子之间的矛盾，工人阶级和其他劳动人民同民族资产阶级之间的矛盾，民族资产阶级内部的矛盾，等等。我们的人民政府是真正代表人民利益的政府，是为人民服务的政府，但是它同人民群众之间也有一定的矛盾。这种矛盾包括国家利益、集体利益同个人利益之间的矛盾，民主同集中的矛盾，领导同被领导之间的矛盾，国家机关某些工作人员的官僚主义作风同群众之间的矛盾。这种矛盾也是人民内部的一个矛盾。一般说来，人民内部的矛盾，是在人民利益根本一致的基础上的矛盾。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第二页。",
      "敌我之间的矛盾是对抗性的矛盾。人民内部的矛盾，在劳动人民之间说来，是非对抗性的；在被剥削阶级和剥削阶级之间说来，除了对抗性的一面以外，还有非对抗性的一面。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第二页。",
      "在我国人民的政治生活中，应当怎样来判断我们的言论和行动的是非呢？我们以为，根据我国的宪法的原则，根据我国最大多数人民的意志和我国各党派历次宣布的共同的政治主张，这种标准可以大致规定如下：（一）有利于团结全国各族人民，而不是分裂人民；（二）有利于社会主义改造和社会主义建设，而不是不利于社会主义改造和社会主义建设；（三）有利于巩固人民民主专政，而不是破坏或者削弱这个专政；（四）有利于巩固民主集中制，而不是破坏或者削弱这个制度；（五）有利于巩固共产党的领导，而不是摆脱或者削弱这种领导；（六）有利于社会主义的国际团结和全世界爱好和平人民的国际团结，而不是有损于这些团结。这六条标准中，最重要的是社会主义道路和党的领导两条。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第三零页。",
      "肃清反革命分子的问题是敌我矛盾的斗争问题。在人民内部，有些人对于肃反问题的看法，也有一些不同。有两种人的意见，和我们的意见不相同。有右倾思想的人不分敌我，认敌为我。广大群众认为是敌人的人，他们却认为是朋友。有“左”倾思想的人则把敌我矛盾扩大化，以至把某些人民内部的矛盾也看做敌我矛盾，把某些本来不是反革命的人也看作反革命。这两种看法都是错误的，都不能正确地处理肃反问题，也不能正确地估计我们的肃反工作。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第一三页。",
      "不同质的矛盾，只有用不同持的方法才能解决。例如，无产阶级和资产阶级的矛盾，用社会主义革命的方法去解决；人民大众和封建制度的矛盾，用民主革命的方法去解决；殖民地和帝国主义的矛盾，用民族革命战争的方法去解决；在社会主义社会中工人阶级和农民阶级的矛盾，用农业集体化和农业机械化的方法去解决；共产党内部的矛盾，用批评和自我批评的方法去解决；社会和自然的矛盾，用发展生产力的方法去解决。……用不同的方法去解决不同的矛盾，这是马克思列宁主义者必须严格地遵守的一个原则。《矛盾论》（一九三七年八月），《毛泽东选集》第一卷第二九九页。",
      "敌我之间和人民内部这两类矛盾的性质不同，解决的方法也不同，简单地说起来，前者是分清敌我的问题，后者是分清是非的问题。当然，敌我问题也是一种是非问题。比如我们同帝国主义、封建主义、官僚资本主义这些内外反动派，究竟谁是谁非，也是是非问题，但是这是和人民内部问题性质不同的另一类是非问题。《关于正确处理人民内部矛盾的总是》（一九五七年二月二十七日），人民出版社版第三页。",
      "凡属于思想性质的问题，凡属于人民内部的争论问题，只能用民主的方法去解决，只能用讨论的方法、批评的方法、说服教育的方法去解决，而不能用强制的、压服的方法去解决。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第六页。",
      "人民为了有效地进行生产、进行学习和有秩序地过生活，要求自己的政府、生产的领导者、文化教育机关的领导者发布各种适当的带强制性的行政命令。没有这种行政命令，社会秩序就无法维持，这是人们的常识所了解的。这同用说服教育的方法去解决人民内部的矛盾，是相辅相成的两个方面。为着维持社会秩序的目的而发布的行政命令，也要伴之以说服教育，单靠行政命令，在许多情况下就行不通。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第六页。",
      "资产阶级、小资产阶级，他们的思想意识是一定要反映出来的。一定要在政治问题和思想问题上，用各种办法顽强地表现他们自己。要他们不反映不表现，是不可能的。我们不应当用压制的办法不让他们表现，而应当让他们表现，同时在他们表现的时候，和他们辩论，进行适当的批评。毫无疑问，我们应当批评各种各样的错误思想。不加批评，看着错误思想到处泛滥，任凭它们去占领市场，当然不行。有错误就得批判，有毒草就得进行斗争。但是这种批评不应当是教条主义的，不应当用形而上学方法，应当力求用辩证方法。要有科学的分析，要有充分的说服力。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第二九页。",
      "对于人民的缺点是需要批评的，……但必须是真正站在人民的立场上，用保护人民、教育人民的满腔热情来说话。如果把同志当作敌人来对待，就是使自己站在敌人的立场上去了。《在延安文艺座谈会上的讲话》（一九四二年五月），《毛泽东选集》第三卷第八七四页。",
      "矛盾和斗争是普遍的、绝对的，但是解决矛盾的方法，即斗争的形式，则因矛盾的性质不同而不相同。有些矛盾具有公开的对抗性，有些矛盾则不是这样。根据事物的具体发展，有些矛盾是由原来还非对抗性的，而发展成为对抗性的；也有些矛盾则由原来是对抗性的，而发展成为非对抗性的。《矛盾论》（一九三七年八月），《毛泽东选集》第一卷第三二三页在一般情况下，人民内部的矛盾不是对抗性的。但是如果处理得不适当，或者失去警觉，麻痹大意，也可能发生对抗。这种情况，在社会主义国家通常只是局部的暂时的现象。这是因为社会主义国家消灭了人剥削人的制度，人民的利益在根本上是一致的。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第八页。",
      "在我们国家里，工人阶级同民族资产阶级的矛盾属于人民内部的矛盾。工人阶级和民族资产阶级的阶级斗争一般地属于人民内部的阶级斗争，这是因为我国的民族资产阶级有两面性。在资产阶级民主革命时期，它有革命性的一面，又有妥协性的一面。在社会主义革命时期，它有剥削工人阶级取得利润的一面，又有拥护宪法、愿意接受社会主义改造的一面。民族资产阶级和帝国主义、地主阶级、官僚资产阶级不同。工人阶级和民族资产阶级之间存在着剥削和被剥削的矛盾，这本来是对抗性的矛盾。但是在我国的具体条件下，这两个阶级的对抗性的矛盾如果处理得当，可以转变为非对抗性的矛盾，可以用和平的方法解决这个矛盾。如果我们处理不当，不是对民族资产阶级采取团结、批评、教育的政策，或者民族资产阶级不接受我们的这个政策，那末工人阶级同民族资产阶级之间的矛盾就会变成敌我之间的矛盾。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第二——三页。",
      "社会主义国家内部的反动派同帝国主义者互相勾结，利用人民内部的矛盾，挑拨离间，兴风作浪，企图实现他们的阴谋。匈牙利事件的这种教训，值得大家注意。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第八页。",
      "战争——从有私有财产和有阶级以来就开始了的、用以解决阶级和阶级、民族和民族、国家和国家、政治集团和政治集团之间、在一定发展阶段上的矛盾的一种最高的斗争形式。《中国革命战争的战略问题》（一九三六年十二月），《毛泽东选集》第一卷第一六四页。",
      "“战争是政治的继续”，在这点上说，战争就是政治、战争本身就是政治性质的行动，从古以来没有不带政治性的战争。…… 但是战争有其特殊性，在这点上说，战争不即等于一般的政治。",
      "“战争是政治的特殊手段的继续”。政治发展到一定的阶段，再也不能照旧前进，于是爆发了战争，用以扫除政治道路上的障碍。……障碍既除，政治的目的达到，战争结束。障碍没有扫除得干净，战争仍须继续进行，以求贯彻。……因此可以说，政治是不流血的战争，战争是流血的政治。《论持久战》（一九三八年五月），《毛泽东选集》第二卷第四六八——四六九页。",
      "历史上的战争分为两类，一类是正义的，一类是非正义的。一切进步的战争都是正义的，一切阻碍进步的战争都是非正义的。我们共产党人反对一切阻碍进步的非正义的战争，但是不反对进步的正义的战争。对于后一类战争，我们共产党人不但不反对，而且积极地参加。前一类战争，例如第一次世界大战，双方都是为着帝国主义利益而战，所以全世界的共产党人坚决地反对那一次战争。反对的方法，在战争未爆发前，极力阻止其爆发；既爆发后，只要有可能，就用战争反对战争，用正义战争反对非正义战争。《论持久战》（一九三八年五月），《毛泽东选集》第二卷第四六五——四六六页。",
      "在阶级社会中，革命和革命战争是不可避免的，舍此不能完成社会发展的飞跃，不能推翻反动的统治阶级，而使人民获得政权。《矛盾论》（一九三七年八月），《毛泽东选集》第一卷第三二二页。",
      "革命战争是一种抗毒素，它不但将排除敌人的毒焰，也将清洗自己的污浊。凡属正义的革命的战争，其力量是很大的，它能改造很多事物，或为改造事物开辟道路。中日战争将改造中日两国；只要中国坚持抗战和坚持统一战线，就一定能把旧日本化为新日本，把旧中国化为新中国，中日两国的人和物都将在这次战争中和战争后获得改造。《论持久战》（一九三八年五月），《毛泽东选集》第二卷第四四七页。",
      "每个共产党员都应懂得这个真理：“枪杆子里面出政权”。《战争和战略问题》（一九三八年十一月六日），《毛泽东选集》第二卷第五三五页。",
      "革命的中心任务和最高形式是武装夺取政权，战争解决问题。这个马克思列宁主义的革命原则是普遍地对的，不论在中国在外国，一概都是对的。《战争和战略问题》（一九三八年十一月六日），《毛泽东选集》第二卷第五二九页在中国，离开了武装斗争，就没有无产阶级的地位，就没有人民的地位，就没有共产党的地位，就没有革命的胜利。十八年来，我们党的发展、巩固和布尔塞维克化，是在革命战争中进行的，没有武装斗争，就不会有今天的共产党。这个拿血换来的经验，全党同志都不要忘记。《“共产党人”发刊词》（一九三九年十月四日），《毛泽东选集》第二卷第六零零——六零一页。",
      "从马克思主义关于国家学说的观点看来，军队是国家政权的主要成分。谁想夺取国家政权，并想保持它，谁就应有强大的军队。有人笑我们是“战争万能论”，对，我们是革命战争万能论者，这不是坏的，是好的，是马克思主义的。俄国共产党的枪杆子造了一个社会主义。我们要造一个民主共和国。帝国主义时代的阶级斗争的经验告诉我们：工人阶级和劳动群众，只有用枪杆子的力量才能战胜武装的资产阶级和地主；在这个意义上，我们可以说，整个世界只有用枪杆子才可能改造。《战争和战略问题》（一九三八年十一月六日），《毛泽东选集》第二卷第五三五页。",
      "我们是战争消灭论者，我们是不要战争的；但是只能经过战争去消灭战争，不要枪杆子必须拿起枪杆子。《战争和战略问题》（一九三八年十一月六日），《毛泽东选集》第二卷第五三五页。",
      "战争——这个人类互相残杀的怪物，人类社会的发展终久要把它消灭的，而且就在不远的将来会要把它消灭的。但是消灭它的方法只有一个，就是用战争反对战争，用革命战争反对反革命战争，用民族革命战争反对民族反革命战争，用阶级革命战争反对阶级反革命战争。……人类社会进步到消灭了阶级，消灭了国家，到了那时，什么战争也没有了，反革命战争没有了，革命战争也没有了，非正义战争没有了，正义战争也没有了，这就是人类的永久和平的时代。我们研究革命战争的规律，出发于我们要求消灭一切战争的志愿，这是区别我们共产党人和一切剥削阶级的界线。《中国革命战争的战略问题》（一九三六年十二月），《毛泽东选集》第一卷第一六七——一六八页。",
      "我国和各社会主义国家都需要和平，世界各国的人民也都需要和平。渴望战争，不要和平的，仅仅是少数帝国主义国家中的某些依靠侵略发财的垄断资本集团。《中国共产党第八次全国代表大会开幕词》（一九五六年九月十五日），《中国共产党第八次全国代表大会文献》第八页为了争取世界的持久和平，我们必须进一步地发展同社会主义阵营中各个兄弟国家的友好合作，并且同一切爱好和平的国家加强团结。我们必须争取同一切愿意和我们和平相处的国家，在互相尊重领土主权和平等互利的基础上，建立正常的外交关系。亚洲、非洲和拉丁美洲各国的民族独立解放运动，以及世界上一切国家的和平运动和正义斗争，我们都必须给以积极的支持。《中国共产党第八次全国代表大会开幕词》（一九五六年九月十五日），《中国共产党第八次全国代表大会文献》第八页。",
      "至于帝国主义国家，我们也要团结那里的人民，并且争取同那些国家和平共处，做些生意，制止可能发生的战争，但是决不可以对他们怀抱一些不切实际的想法。《关于正确处理人民内部矛盾的问题》（一娥五七年二月二十七日），人民出版社版第三八页。",
      "我们希望和平。但是如果帝国主义硬要打仗，我们也只好横下一条心，打了仗再建设。每天怕战争，战争来了你有什么办法呢？我先是说东风压倒西风，战争打不起来，现在再就如果发生了战争的情况，作了这些补充的说明，这样两种可能性都估计到了。在各国共产党和工人党莫斯科会议上的讲话（一九五七年十一月十八日），一九六三年九月一日《人民日报》《中国政府发言人声明》中的引语现在世界各国的人们都在谈论着会不会打第三次世界大战。对于这个问题，我们也要有精神准备，也要有分析。我们是坚持和平反对战争的。但是，如果帝国主义一定要发动战争，我们也不要害怕。我们对待这个问题的态度，同对待一切“乱子”的态度一样，第一条，反对；第二条，不怕。第一次世界大战以后，出了一个苏联，两亿人口。第二次世界大战以后，出了一个社会主义阵营，一共九亿人口。如果帝国主义者一定要发动第三次世界大战，可以断定，其结果必定又要有多少亿人口转到社会主义方面，帝国主义剩下的地盘就不多了，也有可能整个帝国主义制度全部崩溃。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第三五页。",
      "捣乱，失败，再捣乱，再失败，直至灭亡——这就是帝国主义和世界上一切反动派对待人民事业的逻辑，他们决不会违背这个逻辑的。这是一条马克思主义的定律。我们说“帝国主义是很凶恶的”，就是说它的本性是不能改变的，帝国主义分子决不肯放下屠刀，他们也决不能成佛，直至他们的灭亡。",
      "斗争，失败，再斗争，再失败，再斗争，直至胜利——这就是人民的逻辑，他们也是决不会违背这个逻辑的。这是马克思主义的又一条定律。俄国人民的革命曾经是依照了这条定律，中国人民的革命也是依照这条定律。《丢掉幻想，准备斗争》（一九四九年八月十四日），《毛泽东选集》第四卷第一四九零——一四九一页。",
      "我们决不可因为胜利，而放松对于帝国主义分子及其走狗们的疯狂的报复阴谋的警惕性，谁要是放松这一项警惕性，谁就将在政治上解除武装，而使自己处于被动的地位。《在新政治协商会议筹备会上的讲话》（一九四九年六月十五日），《毛泽东选集》第四卷第一四六九页。",
      "帝国主义者及其走狗中国反动派对于他们在中国这块土地上的失败，是不会甘心的。他们还会要互相勾结在一起，用各种可能的方法，反对中国人民。例如，派谴他们的走狗钻进中国内部来进行分化工作和捣乱工作。这是必然的，他们决不会忘记这一项工作。例如，唆使中国反动派甚至加上他们自己的力量，封锁中国的海港。只要还有可能，他们就会这样做，再则，假如他们还想冒险的话，派出一部分兵力侵扰中国的边境，也不是不可能的。",
      "所有这些，我们都必须充分地估计到。《在新政治协商会议筹备会上的讲话》（一九四九年六月十五日），《毛泽东选集》第四卷第一四六九页世界是在进步的，前途是光明的，这个历史的总趋势任何人也改变不了。我们应当把世界进步的情况和光明的前途，常常向人民宣传，使人民建立起胜利的信心。《关于重庆谈判》（一九四五年十月十七日），《毛泽东选集》第四卷第一一六二页。",
      "人民解放军的全体指挥员、战斗员，绝对不可以稍微松懈自己的战斗意志，任何松懈战斗意志的思想和轻敌的思想，都是错误的。《在中国共产党第七届中央委员会第二次全体会议上的报告》（一九四九年三月五日），《毛泽东选集》第四卷第一四二五页。",
      "一切反动派都是纸老虎。看起来，反动派的样子是可怕的，但是实际上并没有什么了不起的力量。从长远的观点看问题，真正强大的力量不是属于反动派，而是属于人民。《和美国记者安那·路易斯·斯特朗的谈话》（一九四六年八月），《毛泽东选集》第四卷第一一九三页同世界上一切事物无不具有两重性（即对立统一规律）一样，帝国主义和一切反动派也有两重性，它们是真老虎又是纸老虎。历史上奴隶主阶级、封建地主阶级和资产阶级，在它们取得统治权力以前和取得统治权力以后的一段时间内，它们是生气勃勃的，是革命者，是先进者，是真老虎。在随后的一段时间，由于它们的对立面，奴隶阶级、农民阶级和无产阶级，逐步壮大，并同它们进行斗争，越来越厉害，它们就逐步向反面转化，化为反动派，化为落后的人们，化为纸老虎，终究被或者将被人民所推翻。反动的、落后的、腐朽的阶级，在面临人民的决死斗争的时候，也还有这样的两重性。一面，真老虎，吃人，成百万人成千万人地吃。人民斗争事业处在艰难困苦的时代，出现许多弯弯曲曲的道路。中国人民为了消灭帝国主义、封建主义和官僚资本主义在中国的统治，花了一百多年时间，死了大概几千万人之多，才取得一九四九年的胜利。你看，这不是活老虎，铁老虎，真老虎吗？但是，它们终究转化成了纸老虎，死老虎，豆腐老虎。这是历史的事实。人们难道没有看见听见过这些吗？真是成千成万！成千成万！所以，从本质上看，从长期上看，从战略上看，必须如实地把帝国主义和一切反动派，都看成纸老虎。从这点上，建立我们的战略思想。另一方面，它们又是活的铁的真的老虎，它们会吃人的。从这点上，建立我们的策略思想和战术思想。在中共中央政治局武昌会议上的讲话（一九五八年十二月一日），《毛泽东选集》第四卷第一一九零页《和美国记者安那·路易斯·斯特朗的谈话》一文的题解",
      "我说一切所有号称强大的反动派统统不过是纸老虎。原因是他们脱离人民。你看，希特勒是不是纸老虎？希特勒不是被打倒了吗？我也谈到沙皇是纸老虎，中国皇帝是纸老虎，日本帝国主义是纸老虎，你看，都倒了。美帝国主义没有倒，还有原子弹，我看也是要倒的，也是纸老虎。",
      "在各国共产党和工人党莫斯科会议上的讲话（一九五七年十一月十八日），《毛泽东同志论帝国主义和一切反动派都是纸老虎》人民出版社版第二四页。",
      "“搬起石头打自己的脚”，这是中国人形容某些蠢人的行为的一名俗话。各国反动派也就是这样的一批蠢人。他们对于革命人民所作的种种迫害，归根结底，只能促进人民的更广泛更剧烈的革命。难道沙皇和蒋介石对于革命人民的种种迫害，不就是对于伟大的俄国革命和伟大的中国革命起了这样的促进作用吗？《在苏联最高苏维埃庆祝伟大的十月社会主义革命四十周年会议上的讲话》（一九五七年十一月六日），人民出版社版第五页美帝国主义九年来侵占了我国领土台湾，不久以前又派遣它的武装部队侵占了黎巴嫩。美国在全世界许多国家建立了几百个军事基地。中国领土台湾、黎巴嫩以及所有美国在外国的军事基地，都是套在美帝国主义脖子上的绞索。不是别人而是美国人自己制造这种绞索，并把它套在自己的脖子上，而把绞索的另一端交给了中国人民、阿拉伯各国人民和全世界一切爱和平反侵略的人民。美国侵略者在这些地方停留得越久，套在它的头上的绞索就将越紧。",
      "在最高国务会议上的讲话（一九五八年九月八日），一九五八年九月九日《人民日报》",
      "帝国主义者的寿命不会很长了，因为他们尽做坏事，专门扶植各国反人民的反动派，霸占大量的殖民地、半殖民地和军事基地，以原子战争威胁和平。这样，他们就迫使全世界百分之九十以上的人正在或者将要对他们群起而攻之。但是帝国主义者目前还是在活着，他们依然在向亚洲、非洲、拉丁美洲横行霸道。他们在西方世界也依然在压迫他们本国的人民群众。这种局面必需改变。结束帝国主义主要是美帝国主义的侵略和压迫，是全世界人民的任务。",
      "对新华社记者的谈话（一九五八年九月二十九日），《毛泽东同志论帝国主义和一切反动派都是纸老虎》人民出版社版第三一页美帝国主义到处横行霸道，把它自己放在同全世界人民为敌的地位，使它自己越来越陷于孤立。美帝国主义手里的原子弹、氢弹，是吓不倒一切不愿意做奴隶的人们的。全世界人民反对美国侵略者的怒潮是不可阻挡的。全世界人民对美帝国主义及其走狗的斗争一定会取得更加伟大的胜利。《支持巴拿马人民反美爱国正义斗争的谈话》（一九六四年一月十二日），《全世界人民团结起来打败美国侵略者及其一切走狗》人民出版社版第九——一零页。",
      "美国垄断资本集团如果坚持推行它的侵略政策和战争政策，势必有一天要被全世界人民处以绞刑。其他美国帮凶也将是这样。",
      "在最高国务会议上的讲话（一九五八年九月八日），一九五八年九月九日《人民日报》",
      "为了同敌人作斗争，我们在一个长时间内形成了一个概念，就是说，在战略上我们要藐视一切敌人，在战术上我们要重视一切敌人。也就是说在整体上我们一定要藐视它，在一个一个的具体问题上我们一定要重视它。如果不是在整体上藐视敌人，我们就要犯机会主义的错误。马克思、恩格思只有两个人，那时他们就说全世界资本主义要被打倒。但是在具体问题上，在一个一个敌人的问题上，如果我们不重视它，我们就要犯冒险主义的错误。打仗只能一仗一仗地打，敌人只能一部分一部分地消灭。工厂只能一个一个地盖，农民犁地只能一块一块的犁，就是吃饭也是如此。我们在战略上藐视吃饭：这顿饭我们能够吃下去。但是具体地吃，却是一口口地吃的，你不可能把一桌酒席一口吞下去。这叫做各个解决，军事书上叫做各个击破。",
      "在各国共产党和工人党莫斯科会议上的讲话（一九五七年十一月十八日），《毛泽东同志论帝国主义和一切反动派都是纸老虎》人民出版社版第二五页。",
      "我认为现在国际形势到了一个新的转折点。世界上现在有两股风：东风，西风。中国有句成语：“不是东风压倒西风，就是西风压倒东风。”我认为目前形势的特点是东风压倒西风，也就是说，社会主义的力量对于帝国主义的力量占了压倒的优势。",
      "在各国共产党和工人党莫斯科会议上的讲话（一九五七年十一月十八日），《毛泽东同志论帝国主义和一切反动派都是纸老虎》人民出版社版第二六页。",
      "全世界人民团结起来，打败美国侵略者及其一切走狗！全世界人民要有勇气，敢于战斗，不怕困难，前赴后继，那末，全世界就一定是人民的。一切魔鬼通通都会被消灭。《支持刚果（利）人民反对美国侵略的声明》（一九六四年十一月二十八日），《全世界人民团结起来打败美国侵略者及其一切走狗》人民出版社版第一四页。",
      "中国共产党依据马克思列宁主义的科学，清醒地估计了国际和国内的形势，知道一切内外反动派的进攻，不但是必须打败的，而且是能够打败的。当着天空中出现乌云的时候，我们就指出：这不过是暂时的现象，黑暗即将过去，曙光即在前头。《目前形势和我们的任务》（一九四七年十二月二十五日），《毛泽东选集》第四卷第一二四五——一二四六页。",
      "在人类历史上，凡属将要灭亡的反动势力，总是要向革命势力进行最后挣扎的，而有些革命的人们也往往在一个期间内被这种外强中干的现象所迷惑，看不出敌人快要消灭，自己快要胜利的实质。《第二次世界大战的转折点》（一九四二年十月十二日），《毛泽东选集》第三卷第八八五页。",
      "如果他们要打，就把他们彻底消灭。事情就是这样，他来进攻，我们把他消灭了，他就舒服了。消灭一点，舒服一点；消灭得多，舒服得多；彻底消灭，彻底舒服。中国的问题是复杂的，我们的脑子也要复杂一点。人家打来了，我们就打，打是为了争取和平。《关于重庆谈判》（一九四五年十月十七日），《毛泽东选集》第四卷第一一五八页。",
      "有来犯者，只要好打，我党必定站在自卫立场上坚决彻底干净全部消灭之（不要轻易打，打则必胜），绝对不要被反动派的其势汹汹所吓倒。《中共中央关于同国民党进行和平谈判的通知》（一九四五年八月二十六日），《毛泽东选集》第四卷第一一五三页。",
      "就我们自己的愿望说，我们连一天也不愿意打。但是如果形势迫使我们不得不打的话，我们是能够一直打到底的。《和美国记者安那·路易斯·斯特朗的谈话》（一九四六年八月），《毛泽东选集》第四卷第一一八九——一一九零页。",
      "我们是要和平的，但是，只要美帝国主义一天不放弃它那种横蛮无理的要求和扩大侵略的阴谋，中国人民的决心就是只有同朝鲜人民一起，一直战斗下去。这不是因为我们好战，我们愿意立即停战，剩下的问题待将来去解决。但美帝国主义不愿意这样做，那么好罢，就打下去，美帝国主义愿意打多少年，我们也就准备跟他打多少年，一直打到美帝国主义愿意罢手的时候为止，一直打到中朝人民完全胜利的时候为止。",
      "在中国人民政治协商会议第一届全国委员会第四次会议上的讲话（一九五三年二月七日），一九五三年二月八日《人民日报》",
      "我们应当在自己内部肃清一切软弱无能的思想。一切过高地估计敌人力量和过低地估计人民力量的观点，都是错误的。《目前形势和我们的任务》（一九四七年十二月二十五日），《毛泽东选集》第四卷第一二五九页。",
      "被压迫人民和被压迫民族，决不能把自己的解放寄托在帝国主义及其走狗的“明智”上面，而只有通过加强团结、坚持斗争，才能取得胜利。《反对美国——吴庭艳集团侵略和屠杀越南南方人民的声明》（一九六三年八月二十九日），《全世界人民团结起来打败美国侵略者及其一切走狗》人民出版社版第六页。",
      "全国性的内战不论那一天爆发，我们都要准备好。早一点，明天早上就打吧，我们也在准备着。这是第一条。现在的国际国内形势，有可能把内战暂时限制在局部范围，内战可能暂是若干地方性的战争。这是第二条。第一条我们准备着，第二条是早已如此。总而言之，我们要有准备。有了准备，就能恰当地应付各种复杂的局面。《抗日战争胜利后的时局和我们的方针》（一九四五年八月十三日），《毛泽东选集》第四卷第一——三页。",
      "革命战争是群众的战争，只有动员群众才能进行战争，只有依靠群众才能进行战争。《关心群众生活，注意工作方法》（一九三四年一月二十七日），《毛泽东选集》第一卷第一三一页。",
      "真正的铜墙铁壁是什么？是群众，是千百万真心实意地拥护革命的群众。这是真正的铜墙铁壁，什么力量也打不破的，完全打不破的。反革命打不破我们，我们却要打破反革命。在革命政府的周围团结起千百万群众来，发展我们的革命战争，我们就能消灭一切反革命，我们就能夺取全中国。《关心群众生活，注意工作方法》（一九三四年一月二十七日），《毛泽东选集》第一卷第一三四页战争的伟力之最深厚的根源，存在于民众之中。日本敢于欺负我们，主要的原因在于中国民众的无组织状态。克服了这一缺点，就把日本侵略者置于我们数万万站起来了的人民之前，使它象一匹野牛冲入火阵，我们一声唤也要把它吓一大跳，这匹野牛就非烧死不可。《论持久战》（一九三八年五月），《毛泽东选集》第二卷第五零一页。",
      "帝国主义者如此欺负我们，这是需要认真对付的。我们不但要有强大的正规军，我们还要大办民兵师。这样，在帝国主义侵略我国的时候，就会使他们寸步难行。",
      "对新华社记者的谈话（一九五八年九月二十九日），一九五八年十月一日《人民日报》",
      "人民的游击战争，从整个革命战争的观点看来，和主力红军是互为左右手，只有主力红军而无人民的游击战争，就象一个独臂将军。根据地的人民条件，具体地说来，特别是对于作战说来，就是有武装起来了的人民。敌人视为畏途，主要地也在这一点。《中国革命战争的战略问题》（一九三六年十二月），《毛泽东选集》第一卷第二二一页战争胜负，主要地决定于作战双方的军事、政治、经济、自然诸条件，这是没有问题的。然而不仅仅如此，还决定于作战双方主观指导的能力。军事家不能超过物质条件许可的范围外企图战争的胜利，然而军事家可以而且必须在物质条件许可的范围内争取战争的胜利。军事家活动的舞台建筑在客观物质条件的上面，然而军事家凭着这个舞台，却可以导演出许多有声有色威武雄壮的活剧来。《中国革命战争的战略问题》（一九三六年十二月），《毛泽东选集》第一卷第一七五页。",
      "战争的目的不是别的，就是“保存自己，消灭敌人”（消灭敌人，就是解除敌人的武装，也就是所谓“剥夺敌人的抵抗力”，不是要完全消灭其肉体）。古代战争，用矛用盾：矛是进攻的，为了消灭敌人；盾是防御的，为了保存自己。直到今天的武器，还是这二者的继续。轰炸机、机关枪、远射程炮、毒气，是矛的发展；防空掩蔽部、钢盔、水泥工事、防毒面具，是盾的发展。坦克，是矛盾二者结合为一的新式武器。进攻，是消灭敌人的主要手段，但防御也是不能废的。进攻，是直接为了消灭敌人的，同时也是为了保存自己，因为如不消灭敌人，则自己将被消灭。防御，是直接为了保存自己的，但同时也是辅助进攻或准备转入进攻的一种手段。退却，属于防御一类，是防御的继续；而追击，则是进攻的继续。应该指出：战争目的中，消灭敌人是主要的，保存自己是第二位的，因为只有大量地消灭敌人，才能有效地保存自己。因此，作为消灭敌人之主要手段的进攻是主要的，而作为消灭敌人之辅助手段和作为保存自己之一种手段的防御，是第二位的。战争实际中，虽有许多时候以防御为主，而在其余时候以进攻为主，然而通战争的全体来看，进攻仍然是主要的。《论持久战》（一九三八年五月），《毛泽东选集》第二卷第四七一——四七二页。",
      "一切军事行动的指导原则，都根据于一个基本的原则，就是：尽可能地保存自己的力量，消灭敌人的力量。……何以解释战争中提倡勇敢牺牲呢？每一战争都须支付代价，有时是极大的代价，岂非和“保存自己”相矛盾？其实一点也不矛盾，正确点说，是相反相成的。因为这种牺牲，不但是为了消灭敌人的必要，也是为了保存自己的必要——部分的暂的“不保存”（牺牲或支付），是为了全体的永久的保存所必需的。在这个基本的原则上，发生了指导整个军事行动的一系列的所谓原则，从射击原则（荫蔽身体，发扬火力，前者为了保存自己，后者为了消灭敌人）起，到战略原则止，都贯彻这个基本原则的精神。一切技术的、战术的、战役的、战略的原则，都是执行这个基本原则时的条件。保存自己消灭敌人的原则，是一切军事原则的根据。《抗日游击战争的战略问题》（一九三八年五月），《毛泽东选集》第二卷第三九七——三九八页我们的军事原则是：（1）先打分散和孤立之敌，后打集中和强大之敌。（2）先取小城市、中等城市和广大乡村，后取大城市。（3）以歼灭敌人有生力量为主要目标，不以保守或夺取城市和地方为主要目标。保守或夺取城市和地方，是歼灭敌人有生力量的结果，往往需要反复多次才能最后地保守或夺取之。（4）每战集中绝对优势兵力（两倍、三倍、四倍、有时甚至是五倍或六倍于敌之兵力），四面包围敌人，力求全歼，不使漏网。在特殊情况下则采用给敌以歼灭性打击的方法，即集中全力打敌正面及其一翼或两翼，求达歼灭其一部、击溃其另一部的目的，以便我军能够迅速转移兵力歼击他部敌军。力求避免打那种得不偿失的、或得失相当的消耗战。这样，在全体上，我们是劣势（就数量来说），但在每一个局部上，在每一个具体战役上，我们是绝对的优势，这就保证了战役的胜利。随着时间的推移，我们就将在全体上转变为优势，直到歼灭一切敌人。（5）不打无准备之仗，不打无把握之仗，每战都应力求有准备，力求在敌我条件对比下有胜利的把握。（6）发扬勇敢战斗、不怕牺牲、不怕疲劳和连续作战（即在短期内不休息地接连打几仗）的作风。（7）力求在运动中歼灭敌人。同时，注重阵地攻击战术，夺取敌人的据点和城市。（8）在攻城问题上，一切敌人守备薄弱的据点和城市，坚决夺取之。一切敌人有中等程度的守备、而环境又许可加以夺取的据点和城市，相机夺取之。一切敌人守备强固的据点和城市，则等候条件成熟时然后夺取之。（9）以俘获敌人的全部武器和大部人员，补充自己。我军人力物力的来源，主要在前线。（10）善于利用两个战役之间的间隙，休息和整训部队。休整的时间，一般地不要过长，尽可能不使敌人获得喘息的时间。以上这些，就是人民解放军打败蒋介石的主要的方法。这些方法，是人民解放军在和国内外敌人长期作战的锻炼中产生出来，并完全适合我们目前的情况的。……我们的战略战术是建立在人民战争这个基础上的，任何反人民的军队都不能利用我们的战略战术。《目前形势和我们的任务》（一九四七年十二月二十五日），《毛泽东选集》第四卷第一二四七——一二四八页。",
      "优势而无准备，不是真正的优势，也没有主动。懂得这一点，劣势而有准备之军，常可对敌举行不意的攻势，把优势者打败。《论持久战》（一九三八年五月），《毛泽东选集》第二卷第四八一页。",
      "没有一个人民的军队，便没有人民的一切。《论联合政府》（一九四五年四月二十四日），《毛泽东选集》第三卷第一零七四页。",
      "这个军队之所以有力量，是因为所有参加这个军队的人，都具有自觉的纪律；他们不是为着少数人的或狭隘集团的私利，而是为着广大人民群众的利益，为着全民族的利益，而结合，而战斗的。紧紧地和中国人民站在一起，全心全意地为中国人民服务，就是这个军队的唯一的宗旨。《论联合政府》（一九四五年四月二十日），《毛泽东选集》第三卷第一零三九页。",
      "中国红军是一个执行革命的政治任务的武装集团。特别是现在，红军决不是单纯地打仗的，它除了打仗消灭敌人军事力量之外，还要负担宣传群众、组织群众、武装群众、帮助群众建立革命政权以至于建立共产党的组织等项重大的任务。红军的打仗，不是单纯地为了打仗而打仗，而是为了宣传群众、组织群众、武装群众，并帮助群众建设革命政权才去打仗的，离了对群众的宣传、组织、武装和建设革命政权等项目标，就是失去了打仗的意义，也就是失去了红军存在的意义。《关于纠正党内的错误思想》（一九二九年十二月），《毛泽东选集》第一卷第八八页人民解放军永远是一个战斗队。就是在全国胜利以后，在国内没有消灭阶级和世界上存在着帝国主义制度的历史时期内，我们的军队还是一个战斗队。对于这一点不能有任何的误解和动摇。《在中国共产党第七届中央委员会第二次全体会议上的报告》（一九四九年三月五日），《毛泽东选集》第四卷第一四二七页。",
      "我们有打仗的军队，又有劳动的军队。打仗的军队，我们有八路军新四军；这支军队也要当两支用，一方面打仗，一方面生产。我们有了这两支军队，我们的军队有了这两套本领，再加上做群众工作一项本领，那末，我们就可以克服困难，把日本帝国主义打垮。《组织起来》（一九四三年十一月二十九日），《毛泽东选集》第三卷第九三一页。",
      "我们的国防将获得巩固，不允许任何帝国主义者再来侵略我们的国土。在英勇的经过了考验的人民解放军的基础上，我们的人民武装力量必须保存和发展起来。我们将不但有一个强大的陆军，而且有一个强大的空军和一个强大的海军。",
      "在中国人民政治协商会议第一届全体会议上的开幕词（一九四九年九月二十一日），一九四九年九月二十二日《人民日报》",
      "我们的原则是党指挥枪，而决不容许枪指挥党。《战争和战略问题》（一九三八年十一月六日），《毛泽东选集》第二卷第五三五页。",
      "我全军将士必须时刻牢记，我们是伟大的人民解放军，是伟大的中国共产党领导的队伍。只要我们时刻遵守党的指示，我们就一定胜利。《中国人民解放军宣言》（一九四七年十月），《毛泽东选集》第四卷第一二三九页。",
      "党委制是保证集体领导、防止个人包办的党的重要制度。近查有些（当然不是一切）领导机关，个人包办和个人解决重要问题的习气甚为浓厚。重要问题的解决，不是由党委会议做决定，而是由个人做决定，党委委员等于虚设。委员间意见分歧以的事亦无由解决，并且听任这些分歧长期地不加解决。党委委员间所保持的只是形式上的一致，而不是实质上的一致。此种情形必须加以改变。今后从中央局至地委，从前委至旅委以及军区（军分会或领导小组）、政府党组、民众团体党组、通讯社和报社党组，都必须建立健全的党委会议制度，一切重要问题（当然不是无关重要的小问题或者已经会议讨论解决只待执行的问题）均须交委员会讨论，由到会委员充分发表意见，做出明确决定，然后分别执行。……委员会又须分别为常委会和全体会两种，不可混在一起。此外，还须注意，集体领导和个人负责，二者不可偏废。军队在作战时和情况需要时，首长有临机处置之权。《关于健全党委制》（一九四八年九月二十日），《毛泽东选集》第四卷第一三四三——一三四四页。",
      "党委书记要善于当“班长”。党的委员会有一二十个人，象军队的一个班，书记好比是“班长”。要把这个班带好，的确不容易。目前各中央局、分局都领导很大的地区，担负很繁重的任务。领导工作不仅要决定方针政策，还要制定正确的工作方法。有了正确的方针政策，如果在工作方法上疏忽了，还是要发生问题。党委要完成自己的领导任务，就必须依靠党委这“一班人”，充分发挥他们的作用。书记要当好“班长”，就应该很好地学习和研究。书记、副书记如果不注意向自己的“一班人”作宣传工作和组织工作，不善于研究怎样把会议开好，就很难把这“一班人” 指挥好。如果这“一班人”动作不整齐，就休想带领千百万人去作战，去建设。当然，书记和委员之间的关系是少数服从多数，这同班长和战士之间的关系是不一样的。这里不过是一个比方。《党委会的工作方法》（一九四九年三月十三日），《毛泽东选集》第四卷第一四四一页要把问题摆到桌面上来。不仅“班长”要这样做，委员也要这样做。不要在背后议论。有了问题就开会，摆到桌面上来讨论，规定它几条，问题就解决了。有问题而不摆到桌面上来，就会长期不得解决，甚至一拖几年。“班长”和委员还要能互相谅解。书记和委员，中央和各中央局，各中央局和区党委之间的谅解、支援和友谊，比什么都重要。《党委会的工作方法》（一九四九年三月十三日），《毛泽东选集》第四卷第一四四一——一四四二页。",
      "“互通情报”。就是说，党委各委员之间要把彼此知道的情况互相通知、互相交流。这对于取得共同的语言是很重要的。有些人不是这样做，而是象老子说的“鸡犬之声相闻，老死不相往来”，结果彼此之间就缺乏共同的语言。《党委会的工作方法》（一九四九年三月十三日），《毛泽东选集》第四卷第四四二页。",
      "不懂得和不了解的东西要问下级，不要轻易表示赞成或反对。……我们切不可强不知以为知，要“不耻下问”，要善于倾听下面干部的意见。先做学生，然后再做先生；先向下面干部请教，然后再下命令。……下面干部的话，有正确的，也有不正确的，听了以后要加以分析。对正确的意见，必须听，并且照它做。……对下面来的错误意见也要听，根本不听是不对的；不过听了而不照它做，并且要给以批评。《党委会的工作方法》（一九四九年三月十三日），《毛泽东选集》第一四四二——一四四三页。",
      "学会“弹钢琴”。弹钢琴要十个指头都动作，不能有的动，有的不动。但是，十个指头同时都按下去，那也不成调子。要产生好的音乐，十个指头的动作要有节奏，要互相配合。党委要抓紧中心工作，又要围绕中心工作而同时开展其他方面的工作。我们现在管的方面很多，各地、各军、各部门的工作，都要照顾到，不能只注意一部分问题而把别的丢掉。凡是有问题的地方都要点一下，这个方法我们一定要学会。钢琴有人弹得好，有人弹得不好，这两种人弹出来的调子差别很大。党委的同志必须学好“弹钢琴”。《党委会的工作方法》（一九四九年三月十三日），《毛泽东选集》第四卷第一四四三页。",
      "要“抓紧”。就是说，党委对主要工作不但一定要“抓”，而且一定要“抓紧”。什么东西只有抓得很紧，毫不放松，才能抓住。抓而不紧，等于不抓。伸着巴掌，当然什么也抓不住。就是把手握起来，但是不握紧，样子象抓，还是抓不住东西。我们有些同志，也抓主要工作，但是抓而不紧，所以工作还是不能做好。不抓不行，抓而不紧也不行。《党委会的工作方法》（一九四九年三月十三日），《毛泽东选集》第四卷第一四四三页。",
      "胸中有“数”。这是说，对情况和问题一定要注意到它们的数量方面，要有基本的数量的分析。任何质量都表现为一定的数量，没有数量也就没有质量。我们有许多同志至今不懂得注意事物的数量方面，不懂得注意基本的统计、主要的百分比，不懂得注意决定事物质量的数量界限，一切都是胸中无“数”，结果就不能不犯错误。《党委会的工作方法》（一九四九年三月十三日），《毛泽东选集》第四卷第一四四三页。",
      "“安民告示”。开会要事先通知，象出安民告示一样，让大家知道讨论什么问题，解决什么问题，并且早作准备。有些地方开干部会，事前不准备好报告和决议草案，等开会的人到了才临时凑合，好象“兵马已到，粮草未备”，这是不好的。如果没有准备，就不要急于开会。《党委会的工作方法》（一九四九年三月十三日），《毛泽东选集》第四卷第一四四四页 “精兵简政”。讲话、演说、写文章和写决议案，都应当简明扼要。会议也不要开得太长。《党委会的工作方法》（一九四九年三月十三日），《毛泽东选集》第四卷第一四四四页。",
      "注意团结那些和自己意见不同的同志一道工作。不论在地方上或部队里，都应该注意这一条。对党外人士也是一样。我们都是从五湖四海汇集拢来的，我们不仅要善于团结和自己意见相同的同志，而且要善于团结和自己意见不同的同志一道工作。《党委会的工作方法》（一九四九年三月十三日），《毛泽东选集》第四卷第一四四四页。",
      "力戒骄傲。这对领导者是一个原则问题，也是保持团结的一个重要条件。就是没有犯过大错误，而且工作有了很大成绩的人，也不要骄傲。《党委会的工作方法》（一九四九年三月十三日），《毛泽东选集》第四卷第一四四四页。",
      "划清两种界限。首先，是革命还是反革命？是延安还是西安？有些人不懂得要划清这种界限。例如，他们反对官僚主义，就把延安说得好似“一无是处”，而没有把延安的官僚主义同西安的官僚主义比较一下，区别一下。这就从根本上犯了错误。其次，在革命的队伍中，要划清正确和错误、成绩和缺点的界限，还要弄清它们中间什么是主要的，什么是次要的。例如，成绩究竟是三分还是七分？说少了不行，说多了也不行。一个人的工作，究竟是三分成绩七分错误，还是七分成绩三分错误，必须有个根本的估计。如果是七分成绩，那末就应该对他的工作基本上加以肯定。把成绩为主说成错误为主，那就完全错了。我们看问题一定不要忘记划清这两种界限：革命和反革命的界限，成绩和缺点的界限。记着这两条界限，事情就好办，否则就会把问题的性质弄混淆了。自然，要把界限划好，必须经过细致的研究和分析。我们对于每一个人和每一件事，都应该采取分析研究的态度。《党委会的工作方法》（一九四九年三月十三日），《毛泽东选集）第四卷第一四四四——一四四五页。",
      "在组织上，厉行集中指导下的民主生活。其路线是：1党的领导机关要有正确的指导路线，遇事要拿出办法，以建立领导的中枢。2上级机关要明了下级机关的情况和群众生活的情况，成为正确指导的客观基础。3党的各级机关解决问题，不要太随便。一成决议，就须坚决执行。4上级机关的决议，凡属重要一点的，必须迅速地传达到下级机关和党员群众中去。党的下级机关和党员群众对于上级机关的指示，要经过详尽的讨论，以求彻底地了解指示的意义，并决定对它的执行方法。《关于纠正党内的错误思想》（一九二九年十二月），《毛泽东选集》第一卷第九一页。",
      "人民、只有人民，才是创造世界历史的动力。《论联合政府》（一九四五年四月二十四日），《毛泽东选集》第三卷第一零三一页。",
      "群众是真正的英雄，而我们自己则往往是幼稚可笑的，不了解这一点，就不能得到起码的知识。《“农村调查”的序言和跋》（一九四一年三月、四月），《毛泽东选集》第三卷第七九零页。",
      "人民群众有无限的创造力。他们可以组织起来，向一切可以发挥自己力量的地方和部门进军，向生产的深度和广度进军，替自己创造日益增多的福利事业。《多余劳动力找到了出路》一文的按语（一九五五年），《中国农村的社会主义高潮》中册第五七八页目前农民运动的兴起是一个极大的问题。很短的时间内，将有几万万农民从中国中部、南部和北部各省起来，其势如暴风骤雨，迅猛异常，无论什么大的力量都将压抑不住。他们将冲决一切束缚他们的罗网，朝着解放的路上迅跑。一切帝国主义、军阀、贪官污吏、土豪劣绅，都将被他们葬入坟墓。一切革命的党派、革命的同志，都将在他们面前受他们的检验而决定弃取。站在他们的前头领导他们呢？还是站在他们的后头指手画脚地批评他们呢？还是站在他们的对面反对他们呢？每个中国人对于这三项都有选择的自由，不过时局将强迫你迅速地选择罢了。《湖南农民运动考察报告》（一九二七年三月），《毛泽东选集》第一卷第一三——一四页。",
      "目前农村中合作化的社会改革的高潮，有些地方已经到来，全国也即将到来。这是五亿多农村人口的大规模的社会主义的革命运动，带有极其伟大的世界意义。我们应当积极地热情地有计划地去领导这个运动，而不是用各种办法去拉它向后退。运动中免不了要出些偏差，这是可以理解的，也是不难纠正的。干部中和农民中存在的缺点或错误，只要我们积极地去帮助他们，就会克服或纠正。《关于农业合作化问题》（一九五五年七月三十日），人民出版社 版第一——第二页群众中蕴藏了一种极大的社会主义的积极性。那些在革命时期还只会按照常规走路的人们，对于这种积极性一概看不见。他们是瞎子，在他们面前出现的只是一片黑暗。他们有时简直要闹到颠倒是非、混淆黑白的程度。这种人难道我们遇见得还少吗？这些只会循着常规走路的人们，老是对于人民的积极性估计过低。一种新事物出现，他们总是不赞成，首先反对一气。随后就是认输，做一点自我批评。第二种新事物出现，他们又按照这两种态度循环一遍。以后各种新事物出现，都按照这个格式处理。这种人老是被动，在紧要的关头老是止步不前，老是需要别人在他的背上击一猛掌，才肯向前跨进一步。《这个乡两年就合作化了》一文的按语（一九五五年），《中国农村的社会主义高潮》中册第五八七——五八八页。",
      "我党二十几年来，天天做群众工作，近十几年来，天天讲群众路线。我们历来主张革命要依靠人民群众，大家动手，反对只依靠少数人发号施令。但是在有些同志的工作中间，群众路线仍然不能贯彻，他们还是只靠少数人冷冷清清地做工作。其原因之一，就是他们做一件事情，总不愿意向被领导的人讲清楚，不懂得发挥被领导者的积极性和创造力。他们主观上也要大家动手动脚去做，但是不让大家知道要做的是怎么一回事，应当怎样做法，这样，大家怎么能动起来，事情怎么能够办好？要解决这个问题，根本上当然要从思想上进行群众路线的教育，同时也要教给同志们许多具体办法。《对晋绥日报编辑人员的谈话》（一九四八年四月二日），《毛泽东选集》第四卷第一三一七——一三一八页。",
      "二十四年的经验告诉我们，凡属正确的任务、政策和工作作风，都是和当时当地的群众要求相适合，都是联系群众的；凡属错误的任务、政策和工作作风，都是和当时当地的群众要求不相适合，都是脱离群众的。教条主义、经验主义、命令主义、尾巴主义、宗派主义、官僚主义、骄傲自大的工作态度等项弊病之所以一定不好，一定要不得，如果什么人有了这类弊病一定要改正，就是因为它们脱离群众。《论联合政府》（一九四五年四月二十四日），《毛泽东选集》第三卷第一零九六页。",
      "要联系群众，就要按照群众的需要和自愿。一切为群众的工作都要从群众的需要出发，而不是从任何良好的个人愿望出发。有许多时候，群众在客观上虽然有了某种改革的需要，但在他们的主观上还没有这种觉悟，群众还没有决心，还不愿实行改革，我们就要耐心地等待；直到经过我们的工作，群众的多数有了觉悟，有了决心，自愿实行改革，才去实行这种改革，否则就会脱离群众。凡是需要群众参加的工作，如果没有群众的自觉和自愿，就会流于徒有形式而失败。……这里是两条原则：一条是群众的实际上的需要，而不是我们脑子里头幻想出来的需要；一条是群众的自愿，由群众自己下决心，而不是由我们代替群众下决心。《文化工作中的统一战线》（一九四四年十月三十日），《毛泽东选集》第三卷第一零一零——一零一一页。",
      "我们的代表大会应该号召全党提起警觉，注意每一个工作环节上的每一个同志，不要让他脱离群众。教育每一个同志热爱人民群众，细心地倾听群众的呼声；每到一地，就和那里的群众打成一片，不是高踞于群众之上，而是深入于群众之中；根据群众的觉悟程度，去启发和提高群众的觉悟，在群众出于内心自愿的原则之下，帮助群众逐步地组织起来，逐步地展开为当时当地内外环境所许可的一切必要的斗争。《论联合政府》（一九四五年四月二十四日），《毛泽东选集》第三卷第一零九六页。",
      "当着群众还不觉悟的时候，我们要进攻，那是冒险主义。群众不愿干的事，我们硬要领导他们去干，其结果必然失败。当着群众要求前进的时候，我们不前进，那是右倾机会主义。《对晋绥日报编辑人员的谈话》（一九四八年四月二日），《毛泽东选集》第四卷第一三一九页在一切工作中，命令主义是错误的，因为它超过群众的觉悟程度，违反了群众的自愿原则，害了急性病。我们的同志不要以为自己了解了的东西，广大群众也和自己一样都了解了。群众是否已经了解并且是否愿意行动起来，要到群众中去考察才会知道。如果我们这样做，就可以避免命令主义。在一切工作中，尾巴主义也是错误的，因为它落后于群众的觉悟程度，违反了领导群众前进一步的原则，害了慢性病。我们的同志不要以为自己还不了解的东西，群众也一概不了解。许多时候，广大群众跑到我们的前头去了，迫切地需要前进一步了，我们的同志不能做广大群众的领导者，却反映了一部分落后分子的意见，并且将这种落后分子的意见误认为广大群众的意见，做了落后分子的尾巴。《论联合政府》（一九四五年四月二十四日），《毛泽东选集》第三卷第一零九六——一零九七页。",
      "从群众中集中起来又到群众中坚持下去，以形成正确的领导意见，这是基本的领导方法。《关于领导方法的若干问题》（一九四三年六月一日），《毛泽东选集》第三卷第九零二页。",
      "在我党的一切实际工作中，凡属正确的领导，必须是从群众中来，到群众中去。这就是说，将群众的意见（分散的无系统的意见）集中起来（经过研究，化为集中的系统的意见），又到群众中去作宣传解释，化为群众的意见，使群众坚持下去，见之于行动，并在群众行动中考验这些意见是否正确。然后再从群众中集中起来，再到群众中坚持下去。如此无限循环，一次比一次的更正确、更生动、更丰富。这就是马克思主义的认识论。《关于领导方法的若干问题》（一九四三年六月一日），《毛泽东选集》第三卷第九零一页。",
      "我们应该走到群众中间去，向群众学习，把他们的经验综合起来，成为更好的有条理的道理和办法，然后再告诉群众（宣传），并号召群众实行起来，解决群众的问题，使群众得到解放和幸福。《组织起来》（一九四三年十一月二十九日），《毛泽东选集》第三卷第九三六页。",
      "在我们一些地方的领导机关中，有的人认为，党的政策只要领导人知道就行，不需要让群众知道。这是我们的有些工作不能做好的基本原因之一。《对晋绥日报编辑人员的谈话》（一九四八年四月二日），《毛泽东选集》第四卷第一三一七页。",
      "在任何群众运动中，群众积极拥护的有多少，反对的有多少，处于中间状态的有多少，这些都必须有个基本的调查，基本的分析，不可无根据地、主观地决定问题。《党委会的工作方法》（一九四九年三月十三日），《毛泽东选集》第四卷第一四四四页。",
      "任何有群众的地方，大致都有比较积极的、中间状态的和比较落后的三部分人。故领导者必须善于团结少数积极分子作为领导的骨干，并凭借这批骨干去提高中间分子，争取落后分子。《关于领导方法的若干问题》（一九四三年六月一日），《毛泽东选集》第三卷第九零零页。",
      "善于把党的政策变为群众的行动，善于使我们的每一个运动，每一个斗争，不但领导干部懂得，而且广大的群众都能懂得，都有能掌握，这是一项马克思列宁主义的领导艺术。我们的工作犯不犯错误，其界限也在这里。《对晋绥日报编辑人员的谈话》（一九四八年四月二日），《毛泽东选集》第四卷第一三一八——一三一九页。",
      "只有领导骨干的积极性，而无广大群众的积极性相结合，便将成为少数人的空忙。但如果只有广大群众的积极性，而无有力的领导骨干去恰当地组织群众的积极性，则群众积极性既不可能持久，也不可能走向正确的方向和提到高级的程度。《关于领导方法的若干问题》（一九四三年六月一日），《毛泽东选集》第三卷第九零零页群众生产，群众利益，群众经验，群众情绪，这些都是领导干部们应时刻注意的。",
      "为中直军直生产展览会题词，一九四三年十一月二十四日延安《解放日报》",
      "我们应该深刻地注意群众生活的问题，从土地、劳动问题，到柴米油盐问题。……一切这些群众生活上的问题，都应该把它提到自己的议事日程上。应该讨论，应该决定，应该实行，应该检查。要使广大群众认识我们是代表他们的利益的，是和他们呼吸相通的。要使他们从这些事情出发，了解我们提出来的更高的任务，革命战争的任务、拥护革命，把革命推到全国去，接受我们的政治号召，为革命的胜利斗争到底。《关心群众生活，注意工作方法》（一九三四年一月二十七日），《毛泽东选集》第一卷第一三三页。",
      "那时（指一九二四——一九二七年第一次国内革命战争时期—— 编者）军队设立了党代表和政治部，这种制度是中国历史上没有的，靠了这种制度使军队一新其面目。一九二七年以后的红军以至今日的八路军，是继承了这种制度而加以发展的。《和英国记者贝特兰的谈话》（一九五七年十月二十五日），《毛泽东选集》第二卷第三工零页。",
      "在人民战争的基础上，在军队和人民团结一致、指挥员和战斗员团结一致以及瓦解敌军等项原则的基础上，人民解放军建立了自己的强有力的革命的政治工作，这是我们战胜敌人的重大因素。《目前形势和我们的任务》（一九四七年十二月二十五日），《毛泽东选集》第四卷第一二四八页。",
      "这个军队形成了为人民战争所必需的一系列的政治工作，其任务是为团结我军，团结友军，团结人民，瓦解敌军和保证战斗胜利而斗争。《论联合政府》（一九四五年四月二十四日），（毛泽东选集》第三卷第一零四零页。",
      "政治工作是一切经济工作的生命线。在社会经济制度发生根本变革的时期，尤其是这样。《严重的教训》一文的按语（一九五五年），《中国农村的社会主义高潮》上册第一二三页红军所以艰难奋战而不溃散，“支部建在连上”是一个重要原因。《井冈山的斗争》（一九二八年十一月二十五日），《毛泽东选集》第一卷第六八页。",
      "八路军的政治工作的基本原则有三个，即：第一、官兵一致的原则，这就是在军队中肃清封建主义，废除打骂制度，建立自觉纪律，实行同甘共苦的生活，因此全军是团结一致的。第二、军民一致的原则，这就是秋毫无犯的民众纪律，宣传、组织和武装民众，减轻民众的经济负担，打击危害军民的汉奸卖国贼，因此军民团结一致，到处得到人民的欢迎。第三、瓦解敌军和宽待俘虏的原则。我们的胜利不但是依靠我军的作战，而且依靠敌军的瓦解。《和英国记者贝特兰的谈话》（一九三七年十月二十五日），《毛泽东选集》第二卷第三六九页。",
      "我们的军队必须在军民关系上、军政关系上、军党关系上、官兵关系上、军事工作和政治工作关系上、干部相互关系上，遵守正确的原则，决不可犯军阀主义的毛病。官长必须爱护士兵，不能漠不关心，不能采取肉刑；军队必须爱护人民，不能损害人民利益；军队必须尊重政府，尊重党，不能闹独立性。《组织起来》（一九四三年十一月二十九日），《毛泽东选集》第三卷第九三七页对敌军、伪军、反共军的俘虏，除为群众所痛恶、非杀不可而又经过上级批准的人以外，应一律采取释放的政策。其中被迫参加、多少带有革命性的分子，应大批地争取为我军服务，其他则一律释放；如其再来，则再捉再放；不加侮辱，不搜财物，不要自首，一律以诚恳和气的态度对待之。不论他们如何反动，均取这种政策。这对于孤立反动营垒，是非常有效的。《论政策》（一九四零年十二月二十五日），《毛泽东选集》第二卷第七六四——七六五页。",
      "武器是战争的重要的因素，但不是决定的因素，决定的因素是人不是物。力量对比不但是军力和经济力的对比，而且是人力和人心的对比。军力和经济力是要人去掌握的。《论持久战》（一九三八年五月），《毛泽东选集》第二卷第四五九页。",
      "原子弹是美国反动派用来吓人的一只纸老虎，看样子可怕，实际上并不可怕。当然，原子弹是一种大规模屠杀的武器，但是决定战争胜败的是人民，而不是一两件新式武器。《和美国记者安娜·路易斯·斯特朗的谈话》（一九四六年八月），《毛泽东选集》第四卷第一一九二页军队的基础在士兵，没有进步的政治精神贯注于军队之中，没有进步的政治工作去执行这种贯注，就不能达到真正的官长和士兵的一致，就不能激发官兵最大限度的抗战热忱，一切技术和战术就不能得着最好的基础去发挥它们应有的效力。《论持久战》（一九三八年五月），《毛泽东选集》第二卷第五零零页。",
      "单纯军事观点在红军一部分同志中非常发展。其表现如：（一）认为军事政治二者是对立的，不承认军事只是完成政治任务的工具之一。甚至还有说“军事好，政治自然会好，军事不好，政治也不会好”的，则更进一步认为军事领导政治了。",
      "……《关于纠正党内的错误思想》（一九二九年十二月），《毛泽东选集》第一卷第八七——八八页。",
      "掌握思想教育，是团结全党进行伟大政治斗争的中心环节。如果这个任务不解决，党的一切政治任务是不能完成的。《论联合政府》（一九四五年四月二十四日），《毛泽东选集》第三卷第一零九五页。",
      "在知识分子和青年学生中间，最近一个时期，思想政治工作减弱了，出现了一些偏向。在一些人的眼中，好象什么政治，什么祖国的前途，人类的理想，都没有关心的必要。好象马克思主义行时了一阵，现在就不那么行时了。针对着这种情况，现在需要加强思想政治工作。不论是知识分子，还是青年学生，都应该努力学习。除了学习专业之外，在思想上要有所进步，政治上也要有所进步，这就需要学习马克思主义，学习时事政治。没有正确的政治观点，就等于没有灵魂。……思想政治工作，各个部门都要负责任。共产党应该管，青年团应该管，政府主管部门应该管，学校的校长教师更应该管。《关于正确处理人民内部矛盾的问题》（一九二八年十一月二十五日），《毛泽东选集》第一卷第六六页。",
      "经过政治教育，红军士兵都有了阶级觉悟，都有了分配土地、建立政权和武装工农等项常识，都知道是为了自己和工农阶级而作战。因此，他们能在艰苦的斗争中不出怨言。连、营、团都有了士兵会，代表士兵利益，并做政治工作和民众工作。《井冈山的斗争》（一九二八年十一月二十五日），《毛泽东选集》第一卷第六六页。",
      "由于诉苦（诉旧社会和反动派所给予劳动人民之苦）和三查（查阶级、查工作、查斗志）运动的正确进行，大大提高了全军指战员为解放被剥削的劳动大众，为全国的土地改革，为消灭人民公敌蒋介石匪帮而战的觉悟性；同时就大大加强了全体指战员在共产党领导之下的坚强的团结。在这个基础上，部队的纯洁性提高了，纪律整顿了，群众性的练兵运动开展了，完全有领导地有秩序地在部队中进行的政治、经济、军事三方面的民主发扬了。这样就使部队万众一心，大家想办法，大家出力量，不怕牺牲，克服物质条件的困难，群威群胆，英勇杀敌。这样的军队，将是无敌于天下的。《评西北大捷兼论解放军的新式整军运动》（一九四八年三月七日），《毛泽东选集》第四卷第一二九二页。",
      "差不多一切人民解放军的部队，在最近几个月内，都利用了战争的空隙，实行了大规模的整训。这种整训，是完全有领导地和有秩序地采用民主方法进行的。由此，激发了广大的指挥员和战斗员群众的革命热情，明确地认识了战争的目的，清除了存在于军队中的若干不正确的思想上的倾向和不良现象，教育了干部和战士，极大地提高了战斗力。这种民主的群众性的新式的整军运动，今后必须继续进行。《在晋绥干部会议上的讲话》（一九四八年四月一日），《毛泽东选集》第四卷第一三一零——一三一一页。",
      "抗大的教育方针是：坚定正确的政治方向，艰苦朴素的工作作风，灵活机动的战略战术。这三者是造成一个抗日的革命的军人所不可缺的。抗大的职员、教员、学生，都是根据这三者去进行教育，从事学习的。《被敌人反对是好事而不是坏事》（一九三九年五月二十六日），人民出版社版第三页。",
      "我们民族历来有一种艰苦奋斗的作风，我们要把它发扬起来。……共产党历来提倡坚定正确的政治方向，……这种坚定正确的政治方向，是与艰苦奋斗的工作作风不能脱离的，没有坚定正确的政治方向，就不能激发艰苦奋斗的工作作风；没有艰苦奋斗的工作作风，也就不能执行坚定正确的政治方向。《在延安庆祝五一国际劳动节大会上的讲话》（一九三九年五月一日），一九三九年五月十日《新中华报》",
      "团结、紧张、严肃、活泼。为“抗大”制定的校训。",
      "世界上怕就怕“认真”二字，共产党就最讲“认真”。在莫斯科会见我国留学生和实习生时的谈话（一九五七年十一月十七日），《毛主席在苏联的言论》人民日报出版社版第一五页。",
      "我们的军队一向就有两条方针：第一对敌人要狠，要压倒它，要消灭它；第二对自己人、对人民、对同志、对官长、对部下要和，要团结。",
      "在中央招待留守兵团学习代表时的演说（一九四四年九月十八日），一九四四年九月二十三日延安《解放日报》",
      "我们都是来自五湖四海，为了一个共同的革命目标，走到一起来了。……我们的干部要关心每一个战士，一切革命队伍的人都要互相关心，互相爱护，互相帮助。《为人民服务》（一九四四年九月八日），《毛泽东选集》第三卷第一零零三——一零零四页。",
      "应在每一部队内部举行拥干爱兵运动，号召干部爱护士兵，同时号召士兵拥护干部，彼此的缺点错误，公开讲明，迅速纠正，这样就能达到很好地团结内部之目的。《一九四五年的任务》（一九四四年十二月十五日），一九四四年十二月十六日延安《解放日报》",
      "很多人对于官兵关系、军民关系弄不好，以为是方法不对，我总告诉他们是根本态度（或根本宗旨）问题，这态度就是尊重士兵和尊重人民。从这态度出发，于是有各种的政策、方法、方式。离了这态度，政策、方法、方式也一定是错的，官兵之间、军民之间的关系便决然弄不好。军队政治工作的三大原则：第一是官兵一致，第二是军民一致，第三是瓦解敌军。这些原则要实行有效，都须从尊重士兵、尊重人民和尊重已经放下武器的敌军俘虏的人格这种根本态度出发。那些认为不是根本态度问题而是技术问题的人，实在是想错了，应该加以改正才对。《论持久战》（一九三八年五月），《毛泽东选集》第二卷第五零一页。",
      "共产党人在劳动人民中间进行工作的时候必须采取民主的说服教育的方法，决不允许采取命令主义态度和强制手段。中国共产党忠实地遵守马克思列宁主义的这个原则。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第八页。",
      "我们的同志一定要懂得，思想改造的工作是长期的、耐心的、细致的工作，不能企图上几次课，开几次会，就把人家在几十年生活中间形成的思想意识改变过来。要人家服，只能说服，不能压服。压服的结果总是压而不服。以力服人是不行的。对付敌人可以这样，对付同志，对付朋友，绝不能用这个方法。《在中国共产党全国宣传工作会议上的讲话》（一九五七年三月十二日），人民出版社版第一七页要分清敌我，不能站在敌对的立场用对待敌人的态度来对待同志。必须是满腔热情地用保护人民事业和提高人民觉悟的态度来说话，而不能用嘲笑和攻击的态度来说话。《在中国共产党全国宣传工作会议上的讲话》（一九五七年三月十二日），人民出版社版第一五——一六页。",
      "军队须和民众打成一片，使军队在民众眼睛中看成是自己的军队，这个军队便无敌于天下，……《论持久战》（一九三八年五月），《毛泽东选集》第二卷第五零一页。",
      "应该使每一个同志懂得，只要我们依靠人民，坚决地相信人民群众的创造力是无穷无尽的，因而信任人民，和人民打成一片，那就任何困难也能克服，任何敌人也不能压倒我们，而只会被我们所压倒。《论联合政府》（一九四五年四月二十四日），《毛泽东选集》第三卷第一零九七页我们的同志不论到什么地方，都要和群众的关系搞好，要关心群众，帮助他们解决困难。团结广大人民，团结得越多越好。《关于重庆谈判》（一九四五年十月十七日），《毛泽东选集》第四卷第一一六一页。",
      "在解放区，一方面，军队应实行拥政爱民的工作，另一方面，民主政府应领导人民实行拥军优抗的工作，更大地改善军民关系。《论联合政府》（一九四五年四月二十四日），《毛泽东选集》第三卷第一零九一页。",
      "军队中应当从每个指战员的思想上解决问题，使他们彻底认识拥政爱民的重要性。只要军队方面做好了，地方对军队的关系必会跟着改善。《一九四六年解放区工作的方针》（一九四五年十二月十五日），《毛泽东选集》第四卷第一一七三页。",
      "在拥政爱民和拥军优抗的运动中，彻底检查军队方面和党政方面各自在一九四三年的缺点错误，而于一九四四年坚决改正之。以后应于每年正月普遍举行一次，再三再四地宣读拥政爱民公约和拥军优抗公约，再三再四地将各根据地曾经发生的军队欺压党政民和党政民关心军队不足的缺点错误，实行公开的群众性的自我批评（各方面只批评自己，不批评对方），而彻底改正之。《开展根据地的减租、生产和拥政爱民运动》（一九四三年十月一日），《毛泽东选集》第三卷第九一六页。",
      "军队应实行一定限度的民主化，主要地是废除封建主义的打骂制度和官兵生活同甘苦。这样一来，官兵一致的目的就达到了，军队就增加了绝大的战斗力，长期的残酷的战争就不患不能支持。《论持久战》（一九三八年五月），《毛泽东选集》第二卷第五零零——五零一页。",
      "红军的物质生活如此菲薄，战斗如此频繁，仍能维持不敝，除党的作用外，就是靠实行军队内的民主主义。官长不打士兵，官兵待遇平等，士兵有开会说话的自由，废除烦琐的礼节，经济公开。……中国不但人民需要民主主义，军队也需要民主主义。军队内的民主主义制度，将是破坏封建雇佣军队的一个重要的武器。《井冈山的斗争》（一九二八年十一月二十五日），《毛泽东选集》第一卷第六七——六八页部队内部政治工作方针，是放手发动士兵群众、指挥员和一切工作人员，通过集中领导下的民主运动，达到政治上高度团结、生活上获得改善、军事上提高技术和战术的三大目的。目前在我军部队中热烈进行的三查、三整，就是用政治民主、经济民主的方法，达到前两项目的。",
      "关于经济民主，必须使士兵选出的代表有权协助（不是超过）连队首长管理连队的给养和伙食。",
      "关于军事民主，必须在练兵时实行官兵互教，兵兵互教；在作战时，实行在火线上连队开各种大、小会。在连队首长指导下，发动士兵群众讨论如何攻克敌阵，如何完成战斗任务。在连续几天的战斗中，此种会应开几次。此项军事民主，在陕北蟠龙战役和晋察冀石家庄战役中，都实行了，收到了极大效果。证明只有好处，毫无害处。《军队内部的民主运动》（一九四八年一月三十日），《毛泽东选集》第四卷第一二七五页。",
      "处在伟大斗争面前的中国共产党，要求整个党的领导机关，全党的党员和干部，高度地发挥其积极性，才能取得胜利。所谓发挥积极性，必须具体地表现在领导机关、干部和党员的创造能力，负责精神，工作的活跃，敢于和善于提出问题、发表意见、批评缺点，以及对于领导机关和领导干部从爱护观点出发的监督作用。没有这些，所谓积极性就是空的。而这些积极性的发挥，有赖于党内生活的民主化。党内缺乏民主生活，发挥积极性的目的就不能达到。大批能干人材的创造，也只有在民主生活中才有可能。《中国共产党在民族战争中的地位》（一九三八年十月），《毛泽东选集》第二卷第五一七页。",
      "不论什么人，只要不是敌对分子，不是恶意攻击，允许大家讲话，讲错了也不要紧。各级领导人员，有责任听别人的话。实行两条原则：（一）知无不言，言无不尽；（二）言者无罪，闻者足戒。如果没有“言者无罪”一条，并且是真的，不是假的，就不可能收到“知无不言，言无不尽”的效果。《一九四五年的任务》（一九四四年十二月十五日），一九四四年十二月十六日延安《解放日报》",
      "必须在党内施行有关民主生活的教育，使党员懂得什么是民主生活，什么是民主制和集中制的关系，并如何实行民主集中制。这样才能做到：一方面，确实扩大党内的民主生活；又一方面，不至于走到极端民主化，走到破坏纪律的自由放任主义。《中国共产党在民族战争中的地位》（一九三八年十月），《毛泽东选集》第二卷第五一七页无论在军队或在地方，党内民主都应是为着巩固纪律和增强战斗力，而不是削弱这种纪律和战斗力。《中国共产党在民族战争中的地位》（一九三八年十月），《毛泽东选集》第二卷第五一七——五一八页。",
      "从理论上铲除极端民主化的根苗。首先，要指出极端民主化的危险，在于损伤以至完全破坏党的组织，削弱以至完全毁灭党的战斗力，使党担负不起斗争的责任，由此造成革命的失败。其次，要指出极端民主化的来源，在于小资产阶级的自由散漫性。这种自由散漫性带到党内，就成了政治上的和组织上的极端民主化的思想。这种思想是和无产阶级的斗争任务根本不相容的。《关于纠正党内的错误思想》（一九二九年十二月），《毛泽东选集》第一卷第九一页。",
      "我们的教育方针，应该使受教育者在德育、智育、体育几方面都得到发展，成为有社会主义觉悟的有文化的劳动者。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第二三页对于在职干部的教育和干部学校的教育，应确立以研究中国革命实际问题为中心，以马克思列宁主义基本原则为指导的方针，废除静止地孤立地研究马克思列宁主义的方法。《改造我们的学习》（一九四一年五月），《毛泽东选集》第三卷第八零三页。",
      "一个军事学校，最重要的问题，是选择校长教员和规定教育方针。《中国革命战争的战略问题》（一九三六年十二月），《毛泽东选集》第一卷第一七零页。",
      "一个百人的学校，如果没有一个从教员中、职员中、学生中按照实际形成的（不是勉强凑集的）最积极最正派最机敏的几个人乃至十几个人的领导骨干，这个学校就一定办不好。《关于领导方法的若干问题》（一九四三年六月一日），《毛泽东选集》第三卷第九零一页。",
      "我全军将士必须提高军事艺术，在必胜的战争中勇猛前进，坚决彻底干净全部地歼灭一切敌人。《中国人民解放军宣言》（一九四七年十月），《毛泽东选集》第四卷第一二三九页目前开始的一年整训计划，军事整训与政治整训应该并重，并使二者互相结合。整训开始时，还应着重政治方面，着重于改善官兵关系，增强内部团结，发动干部与战士群众的高度积极性，军事整训才易于实施与更有效果。《一九四五年的任务》（一九四四年十二月十五日），一九四四年十二月十六日延安《解放日报》",
      "练兵方法，应开展官教兵、兵教官、兵教兵的群众练兵运动。《一九四六年解放区工作的方针》（一九四五年十二月十五日），《毛泽东选集》第四卷第一一七二页。",
      "我们练兵的口号是：“官教兵，兵教官，兵教兵。”战士们有很多打仗的实际经验。当官的要向战士学习，把别人的经验变成自己的，他的本领就大了。《对晋绥日报编辑人员的谈话》（一九四入年四月二日），《毛泽东选集》第四卷第一三一九页。",
      "练兵项目，仍以提高射击、刺杀、投弹等项技术程度为主，提高战术程度为辅，特别着重于练习夜战。《一九四六年解放区工作的方针政策》（一九四五年十二月十五日），《毛泽东选集》第四卷第一一七二页。",
      "我们应该谦虚。谨慎，戒骄，戒躁，全心全意地为人民服务，……《两个中国之命运》（一九四五年四月二十三日），《毛泽东选集》第三卷第一零二八页。",
      "全心全意地为人民服务，一刻也不脱离群众；一切从人民的利益出发，而不是从个人或小集团的利益出发；向人民负责和向党的领导机关负责的一至性；这些就是我们的出发点。《论联合政府》（一九四五年四月二十四日），《毛泽东选集》第三卷第一零九五——一零九六页。",
      "国家机关实行民主集中制，国家机关必须依靠人民群众，国家机关工作人员必须为人民服务。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第四页。",
      "白求恩同志毫不利己专门利人的精神，表现在他对工作的极端的负责任，对同志对人民的极端的热忱。每个共产党员都要学习他。",
      "…… 我们大家要学习他毫无自私自利之心的精神。从这点出发，就可以变为大有利于人民的人。一个人能力有大小，但只要有这点精神，就是一个高尚的人，一个纯粹的人，一个有道德的人，一个脱离了低级趣味的人，一个有益于人民的人。《纪念白求恩》（一九三九年十二月二十一日），《毛泽东选集》第二卷第六五三——六五四页。",
      "我们的共产党和共产党所领导的八路军、新四军，是革命的队伍。我们这个队伍完全是为着解放人民的，是彻底地为人民的利益工作的。《为人民服务》（一九四四年九月八日），《毛泽东选集》第三卷第一零零三页。",
      "我们一切工作干部，不论职位高低，都是人民的勤务员，我们所做的一切，都是为人民服务，我们有些什么不好的东西舍不得丢掉呢？《一九四五年的任务 》（一九四四年十二月十五日），一九四四年十二月十六日延安《解放日报》",
      "我们的责任，是向人民负责，每句话，每个行动，每项政策，都要适合人民的利益，如果有了错误，定要改正，这就叫向人民负责。《抗日战争后的时局和我们的方针》（一九四五年八月十三日），《毛泽东选集》第四卷第一一二八页。",
      "要奋斗就会有牺牲，死人的事是经常发生的。但是我们想到人民的利益，想到大多数人民的痛苦，我们为人民而死，就是死得其所。不过，我们应当尽量地减少那些不必要的牺牲。《为人民服务》（一九四四年九月八日），《毛泽东选集》第三卷第一零零四页。",
      "人总是要死的，但死的意义有不同。中国古时候有个文学家叫做司马迁的说过：“人固有一死，或重于泰山，或轻于鸿毛。”为人民利益而死，就比泰山还重；替法西斯卖力，替剥削人民和压迫人民的人去死，就比鸿毛还轻。《为人民服务》（一九四四年九月八日），《毛泽东选集》第三卷第一零零三页。",
      "国际主义者的共产党员，是否可以同时又是一个爱国主义者呢？我们认为不但是可以的，而且是应该的。爱国主义的具体内容，看在什么样的历史条件之下来决定。有日本侵略者和希特勒的 “爱国主义”，有我们的爱国主义。对于日本侵略者和希特勒的所谓“爱国主义，共产党员是必须坚决地反对的。日本共产党人和德国共产党人都是他们国家的战争的失败主义者。用一切方法使日本侵略者和希特勒的战争归于失败，就是日本人民和德国人民的利益；失败得越彻底，就越好。……",
      "这是因为日本侵略者和希特勒的战争，不但是损害世界人民的，也是损害其本国人民的。中国的情况则不同，中国是被侵略的国家。因此，中国共产党人必须将爱国主义和国际主义结合起来。我们是国际主义者，我们又是爱国主义者，我们的口号是为保卫祖国反对侵略者而战。对于我们，失败主义是罪恶，争取抗日胜利是责无旁贷的。因为只有为着保卫祖国而战才能打败侵略者，使民族得到解放。只有民族得到解放，才有使无产阶级和劳动人民得到解放的可能。中国胜利了，侵略中国的帝国主义者被打倒了，同时也就是帮助了外国的人民。因此，爱国主义就是国际主义在民族解放战争中的实施。《中国共产党在民族战争中的地位》（一九三八年十月），《毛泽东选集》第二卷第五零八——五零九页。",
      "一个外国人，毫无利已的动机，把中国人民的解放事业当作他自己的事业，这是什么精神？这是国际主义的精神，这是共产主义的精神，每一个中国共产党员都要学习这种精神。……我们要和一切资本主义国家的无产阶级联合起来，要和日本的、英国的、美国的、德国的、意大利的以及一切资本主义国家的无产阶级联合起来，才能打倒帝国主义，解放我们的民族和人民，解放世界的民族和人民。这就是我们的国际主义，这就是我们用以反对狭隘民族主义和狭隘爱国主义的国际主义。《纪念白求恩》（一九三九年十二月二十一日），《毛泽东选集》第二卷第六五三页。",
      "被压迫人民争取彻底的解放，首先是依靠自己的斗争，其次才是国际的援助。已经获得革命胜利的人民，应该援助正在争取解放的人民的斗争，这是我们的国际主义的义务。接见非洲朋友时的谈话《一九六三年八月八日），一九六三年八月九日《人民日报》",
      "社会主义国家是完全新型的国家，是推翻了剥削阶级而由劳动人民掌握权力的国家。在这些国家间的相互关系中，实现着国际主义和爱国主义相统一的原则。共同的利益和共同的理想把我们紧紧地联结在一起。《在苏联最高苏维埃庆祝伟大的十月社会主义革命四十周年会议上的讲话》（一九五七年十一月六日），人民出版社版第九——十零页",
      "社会主义阵营各国人民要联合起来，亚洲、非洲、拉丁美洲各国人民要联合起来，全世界各大洲的人民要联合起来，所有爱好和平的国家要联合起来，所有受到美国侵略、控制、干涉和欺负的国家要联合起来，结成最广泛的统一战线，反对美帝国主义的侵略政策和战争政策，保卫世界和平。《支持巴拿马人民反美爱国正义斗争的谈话》（一九六四年一月十二日），《全世界人民团结起来打败美国侵略者及其一切走狗》人民出版社版第九页。",
      "事物总是发展的。一九一一年的革命，即辛亥革命，到今年，不过四十五年，中国的面目完全变了。再过四十五年，就是二千零一年，也就是进到二十一世纪的时候，中国的面目更要大变。中国将变为一个强大的社会主义工业国。中国应当这样。因为中国是一个具有九百六十万平方公里土地和六万万人口的国家，中国应当对于人类有较大的贡献。而这种贡献，在过去一个长时期内，则是太少了。这使我们感到惭愧。",
      "但是要谦虚。不但现在应当这样，四十五年之后也应当这样，永远应当这样。中国人在国际交往方面，应当坚决、彻底、干净、全部地消灭大国主义。《纪念孙中山先生》（一九五六年十一月），一九五六年十一月十二日《人民日报》我们决不可有傲慢的大国主义的态度，决不应当由于革命的胜利和在建设上有了一些成绩而自高自大。国无论大小，都各有长处和短处。《中国共产党第八次全国代表大会开幕词》（一九五六年九月十五日），《中国共产党第八次全国代表大会文献》第九页。",
      "这个军队具有一往无前的精神，它要压倒一切敌人，而决不被敌人所屈服。不论在任何艰难困苦的场合，只要还有一个人，这个人就要继续战斗下去。《论联合政府》（一九四五年四月二十四日），《毛泽东选集》第三卷第一零三九页。",
      "发扬勇敢战斗、不怕牺牲、不怕疲劳和连续作战（即在短期内不休息地接连打几仗）的作风。《目前形势和我们的任务》（一九四七年十二月二十五日），《毛泽东选集》第四卷第一二四七页。",
      "成千成万的先烈，为着人民的利益，在我们的前头英勇地牺牲了，让我们高举起他们的旗帜，踏着他们的血迹前进吧！《论联合政府》（一九四五年四月二十四日），《毛泽东选集》第三卷第一零九九页。",
      "下定决心，不怕牺牲，排除万难，去争取胜利。《愚公移山》（一九四五年六月十一日），《毛泽东选集》第三卷第一一零一页。",
      "……正当北伐战争向前发展的紧要关头，这个代表中国人民解放事业的国共两党和各界人民的民族统一战线及其一切革命政策，就被国民党当局的叛卖性的反人民的“清党”政策和屠杀政策所破坏了。……从此以后，内战代替了团结，独裁代替了民主，黑暗的中国代替了光明的中国。但是中国共产党和中国人民并没有被吓倒，被征服，被杀绝。他们从地下爬起来，揩干净身上的血迹，掩埋好同伴的尸首，他们又继续战斗了。他们高举起革命的大旗，举行了武装的抵抗，在中国的广大区域内，组织了人民的政府，实行了土地制度的改革，创造了人民的军队——中国红军，保存了和发展了中国人民的革命力量。《论联合政府》（一九四五年四月二十四日），《毛泽东选集》第三卷第一零三六页。",
      "你们有许多的长处，有很大的功劳，但是你们切记不可以骄傲，你们被大家尊敬，是应当的，但是也容易因此引起骄傲。如果你们骄傲起来，不虚心，不再努力，不尊重人家，不尊重干部，不尊重群众，你们就会当不成英雄和模范了。过去已有一些这样的人，希望你们不要学他们。《必须学会做经济工作》（一九四五年一月十日），《毛泽东选集》第三卷第一零一三页。",
      "你们在消灭敌人的斗争中，在恢复和发展工农业生产的斗争中，克服了很多的艰难困苦，表现了极大的勇敢、智慧和积极性。你们是全中华民族的模范人物，是推动各方面人民事业胜利前进的骨干，是人民政府的可靠支柱和人民政府联系广大群众的桥梁。代表中共中央在全国战斗英雄和劳动模范代表会议上的祝词（一九五零年九月二十五日），一九五零年九月二十六日《人民日报》",
      "我们中华民族有同自己的敌人血战到底的气概。有在自力更生的基础上光复旧物的决心，有自立于世界民族之林的能力。《论反对日本帝国主义的策略》（一九三五年十二月二十七日），《毛泽东选集》第一卷第一五六页。",
      "要使全体干部和全体人民经常想到我国是一个社会主义的大国，但又是一个经济落后的穷国，这是一个很大的矛盾。要使我国富强起来，需要几十年艰苦奋斗的时间，其中包括执行厉行节约、反对浪费这样一个勤俭建国的方针。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第三六页。",
      "勤俭办工厂，勤俭办商店，勤俭办一切国营事业和合作事业，勤俭办一切其他事业，什么事情都应当执行勤俭的原则。这就是节约的原则，节约是社会主义经济的基本原则之一。中国是一个大国，但是现在还很穷，要使中国富起来，需要几十年时间，几十年以后也需要执行勤俭的原则，但是特别要提倡勤俭，特别要注意节约的，是在目前这几十年内，是在目前这几个五年计划的时期内。《勤俭办社》一文的按语（一九五五年），《中国农村的社会主义高潮》上册第一六页。",
      "任何地方必须十分爱惜人力物力，决不可只顾一时，滥用浪费。任何地方必须从开始工作的那一年起，就计算到将来的很多年，计算到长期坚持战争，计算到反攻，计算到赶走敌人之后的建设。一面决不滥用浪费，一面努力发展生产。过去有些地方缺少长期打算，既未注意节省人力物力，又未注意发展生产，吃了大亏。",
      "得了这个教训，现在必须引起注意。《必须学会做经济工作》（一九四五年一月十日），《毛泽东选集》第三卷第一零一九页。",
      "为了迅速地恢复和发展农业生产和市镇上的工业生产，在消灭封建制度的斗争中，必须注意尽一切努力最大限度地保存一切可用的生产资料和生活资料，采取办法坚决地反对任何人对于生产资料和生活资料的破坏和浪费，反对大吃大喝，注意节约。《在晋绥干部会议上的讲话》（一九四八年四月一日），《毛泽东选集》第四卷第一三一四页。",
      "财政的支出，应该根据节省的方针。应该使一切政府工作人员明白，贪污和浪费是极大的犯罪。反对贪污和浪费的斗争，过去有了些成绩，以后还应用力。节省每一个铜板为着战争和革命事业，为着我们的经济建设，是我们的会计制度的原则。《我们的经济政策》（一九三四年一月二十三日），《毛泽东选集》第一卷第一二九页。",
      "在我们的许多工作人员中间，现在滋长着一种不愿意和群众同甘苦，喜欢计较个人名利的危险倾向，这是很不好的。我们在增产节约运动中要求精简机关，下放干部，使相当大的一批干部回到生产中去，就是克服这种危险倾向的一个方法。《关于正确处理人民内部矛盾的问题》（一九五七年二月二十七日），人民出版社版第三六页。",
      "军队生产自给，不但改善了生活，减轻了人民负担，并因而能够扩大军队，而且立即带来了许多副产物。这些副产物就是：（一）改善官兵关系。官兵一道生产劳动，亲如兄弟了。（二）增强劳动观念。……生产自给以来，劳动观念加强了，二流子的习气被改造了。（三）增强纪律性。在生产中执行劳动纪律，不但不会减弱战斗纪律和军人生活纪律，反而会增强它们。（四）改善军民关系。部队有了家务，侵害老百姓财物的事就少了，或者完全没有了。在生产中，军民变工互助，更增强他们之间的友好关系。（五）军队埋怨政府的事也会少了，军政关系也好了。（六）促进人民的大生产运动。军队生产了，机关生产更显得必要，更有劲了；全体人民的普遍增产运动，当然也更显得必要，更有劲了。《论军队生产自给，兼论整风和生产两大运动的重要性》（一九四五年四月二十七日），《毛泽东选集》第三卷第一一零七页。",
